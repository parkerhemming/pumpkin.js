				const tooth = new THREE.BoxGeometry(0.06, 0.11, 0.05);
				const teeth = (parent, y, radius, depth, flip) => {
					for (let i = 0; i < 10; i++) {
						const a = (i / 9 - 0.5) * 2.2;
						const t = new THREE.Mesh(tooth, toothMaterial);
						t.position.set(Math.sin(a) * radius, y + random(-0.01, 0.01), depth + Math.cos(a) * radius * 0.9);
						t.rotation.y = a;
						t.scale.y = flip * random(0.8, 1.1);

				const jaw = new THREE.Group();

			function buildApple() {
				const geometry = displace(new THREE.SphereGeometry(1, 48, 32), (x, y, z) => {
					const fromTop = Math.acos(clamp(y, -1, 1));
					let r = 1 - 0.24 * Math.exp(-((fromTop / 0.38) ** 2)) - 0.12 * Math.exp(-(((Math.PI - fromTop) / 0.35) ** 2));
					r *= 1 + 0.07 * y + 0.02 * Math.sin(5 * Math.atan2(z, x)) * Math.sin(fromTop);
					return [x * r, y * r * 0.9, z * r];
				});
				const [[canvas, ctx]] = paintCanvases(512, 256, 1, (px, py, out) => {
					const u = px / 512;
					const v = py / 256;
					const streak = woodNoise(u * 60 + 1200, v * 4, 60);
					const blush = smoothstep(0.35, 0.75, woodNoise(u * 4 + 1300, v * 3, 4) + 0.3 * v);
					out[0][0] = 150 + 50 * streak - 10 * blush + 40 * (1 - blush);
					out[0][1] = 22 + 20 * streak + 110 * (1 - blush) * 0.6;
					out[0][2] = 22 + 10 * streak;
				});
				for (let i = 0; i < 500; i++) {
					ctx.fillStyle = `rgba(240, 220, 150, ${random(0.2, 0.5)})`;
					ctx.fillRect(random(0, 512), random(0, 256), 1.2, 1.2);
				}
				const apple = new THREE.Group();
				apple.add(new THREE.Mesh(geometry, new THREE.MeshPhysicalMaterial({ map: colorTexture(canvas), roughness: 0.35, clearcoat: 0.4 })));
				const stalk = new THREE.Mesh(
					new THREE.TubeGeometry(new THREE.QuadraticBezierCurve3(new THREE.Vector3(0, 0.6, 0), new THREE.Vector3(0.02, 0.95, 0), new THREE.Vector3(0.12, 1.15, 0)), 8, 0.035, 6),
					new THREE.MeshStandardMaterial({ color: "#4a3420", roughness: 0.9 }),
				);
				apple.add(stalk);
				return apple;
			}

			// =====================================================================
			// The doll (back right). Her head slowly follows you. Click her and

			function porcelainTexture() {
				const [[canvas, ctx]] = paintCanvases(512, 256, 1, (x, y, out) => {
					const grime = woodNoise(x * 0.03 + 2000, y * 0.03) * 0.5 + smoothstep(0.4, 1, y / 256) * 0.3;
					out[0][0] = 238 - 40 * grime;
					out[0][1] = 225 - 45 * grime;
					out[0][2] = 208 - 50 * grime;
				});
				// Faded rosy cheeks and lips (the face is at u = 0.25 on a sphere).
				ctx.filter = "blur(8px)";
				ctx.fillStyle = "rgba(205, 110, 105, 0.35)";
				for (const dx of [-38, 38]) {
					ctx.beginPath();
					ctx.ellipse(128 + dx, 150, 22, 16, 0, 0, TAU);
					ctx.fill();
				}
				ctx.filter = "blur(1.5px)";
				ctx.fillStyle = "rgba(150, 40, 45, 0.75)";
				ctx.beginPath();
				ctx.ellipse(128, 170, 13, 5, 0, 0, TAU);
				ctx.fill();
				ctx.strokeStyle = "rgba(95, 70, 50, 0.55)";
				ctx.lineWidth = 2;
				for (const dx of [-30, 30]) {
					ctx.beginPath();
					ctx.arc(128 + dx, 120, 18, Math.PI * 1.2, Math.PI * 1.8);
					ctx.stroke();
				}
				ctx.filter = "none";
				// Cracks: one long one across the face, a few hairlines.
				ctx.strokeStyle = "rgba(40, 30, 25, 0.85)";
				for (let c = 0; c < 6; c++) {
					let x = c === 0 ? 100 : random(10, 250);
					let y = c === 0 ? 40 : random(30, 220);
					ctx.lineWidth = c === 0 ? 1.8 : 1;
					ctx.beginPath();
					ctx.moveTo(x, y);
					for (let s = 0, n = c === 0 ? 30 : randInt(6, 14); s < n; s++) {
						x += random(-6, 8);
						y += random(1, 7);
						ctx.lineTo(x, y);
					}
					ctx.stroke();
				}
				return colorTexture(canvas);
			}

			function eyeTexture() {
				const [canvas, ctx] = makeCanvas(256, 128);
				ctx.fillStyle = "#e6dcc4";
				ctx.fillRect(0, 0, 256, 128);
				// Iris and pupil at the front of the sphere (u = 0.25).
				const gradient = ctx.createRadialGradient(64, 64, 3, 64, 64, 20);
				gradient.addColorStop(0, "#111");
				gradient.addColorStop(0.35, "#111");
				gradient.addColorStop(0.4, "#5f7c86");
				gradient.addColorStop(0.95, "#33474f");
				gradient.addColorStop(1, "rgba(40, 50, 55, 0)");
				ctx.fillStyle = gradient;
				ctx.beginPath();
				ctx.ellipse(64, 64, 20, 24, 0, 0, TAU);
				ctx.fill();
				return colorTexture(canvas);
			}

			function buildDoll() {
				rand = mulberry32(666);
				const doll = new THREE.Group();
				const porcelain = new THREE.MeshPhysicalMaterial({ map: porcelainTexture(), roughness: 0.35, clearcoat: 0.6 });
				const limbPorcelain = new THREE.MeshPhysicalMaterial({ color: "#d9cbb6", roughness: 0.4, clearcoat: 0.5 });
				const [[laceCanvas, laceCtx]] = paintCanvases(256, 256, 1, (x, y, out) => {
					const n = woodNoise(x * 0.05 + 3000, y * 0.05);
					out[0][0] = 205 - 45 * n;
					out[0][1] = 195 - 50 * n;
					out[0][2] = 172 - 55 * n;
				});
				laceCtx.fillStyle = "rgba(90, 75, 55, 0.35)";
				for (let y = 6; y < 256; y += 12) for (let x = (y / 12) % 2 ? 6 : 12; x < 256; x += 12) laceCtx.fillRect(x, y, 3, 3);
				const lace = colorTexture(laceCanvas);
				lace.wrapS = lace.wrapT = THREE.RepeatWrapping;
				lace.repeat.set(3, 3);
				const cloth = new THREE.MeshStandardMaterial({ map: lace, roughness: 0.95, side: THREE.DoubleSide });

				// Seated body: dress with a ruffled hem, legs out in front.
				const skirt = displace(
					lathe([
						[0.1, 0.62],
						[0.2, 0.5],
						[0.3, 0.2],
						[0.36, 0.05],
						[0.38, 0.02],
					]),
					(x, y, z) => {
						const k = 1 + 0.06 * Math.sin(18 * Math.atan2(z, x)) * smoothstep(0.3, 0.02, y);
						return [x * k, y, z * k];
					},
				);
				doll.add(new THREE.Mesh(skirt, cloth));
				const torso = new THREE.Mesh(new THREE.CapsuleGeometry(0.13, 0.16, 6, 16), cloth);
				torso.position.y = 0.66;
				doll.add(torso);
				for (const side of [-1, 1]) {
					const arm = new THREE.Mesh(new THREE.CapsuleGeometry(0.045, 0.26, 4, 10), cloth);
					arm.position.set(side * 0.19, 0.55, 0.06);
					arm.rotation.set(0.5, 0, side * 0.25);
					const hand = new THREE.Mesh(new THREE.SphereGeometry(0.05, 12, 8), limbPorcelain);
					hand.position.set(side * 0.23, 0.38, 0.17);
					const leg = new THREE.Mesh(new THREE.CapsuleGeometry(0.06, 0.3, 4, 10), limbPorcelain);
					leg.position.set(side * 0.11, 0.08, 0.3);
					leg.rotation.set(Math.PI / 2 - 0.15, side * 0.12, 0);
					const shoe = new THREE.Mesh(new THREE.SphereGeometry(0.075, 12, 8).scale(1, 0.8, 1.3), new THREE.MeshStandardMaterial({ color: "#1c1714", roughness: 0.6 }));
					shoe.position.set(side * 0.13, 0.08, 0.52);
					doll.add(arm, hand, leg, shoe);
				}

				// Head on a neck pivot, so it can turn.
				const head = new THREE.Group();
				head.position.y = 0.8;
				const skullShape = displace(new THREE.SphereGeometry(1, 64, 48), (x, y, z) => {
					const p = { x, y, z };
					const k = 1 + 0.09 * (bump(p, 0.45, -0.3, 0.7, 0.3) + bump(p, -0.45, -0.3, 0.7, 0.3)) + 0.05 * bump(p, 0, -0.12, 0.98, 0.12) - 0.06 * (bump(p, 0.3, 0.05, 0.92, 0.16) + bump(p, -0.3, 0.05, 0.92, 0.16));
					return [x * k * 0.92, y * k * (y > 0 ? 1.04 : 0.95), z * k];
				});
				const face = new THREE.Mesh(skullShape, porcelain);
				face.scale.setScalar(0.3);
				face.position.y = 0.26;
				head.add(face);
				const eyes = [];
				const eyeMaterial = new THREE.MeshPhysicalMaterial({ map: eyeTexture(), roughness: 0.1, clearcoat: 1 });
				for (const side of [-1, 1]) {
					const eye = new THREE.Mesh(new THREE.SphereGeometry(0.048, 24, 16), eyeMaterial);
					eye.position.set(side * 0.1, 0.275, 0.225);
					eye.rotation.y = side === 1 ? 0.25 : 0; // one eye wanders
					// Upper lid: a porcelain cap that drops over the eye to blink.
					const lidCap = new THREE.Mesh(new THREE.SphereGeometry(0.052, 20, 10, 0, TAU, 0, Math.PI / 2), limbPorcelain);
					lidCap.position.copy(eye.position);
					lidCap.rotation.x = side === 1 ? -0.9 : -1.25; // one droops
					head.add(eye, lidCap);
					eyes.push(lidCap);
				}
				// A few stringy strands of hair left on the scalp.
				const hairMaterial = new THREE.MeshStandardMaterial({ color: "#6b5634", roughness: 0.8 });
				for (let i = 0; i < 26; i++) {
					const a = random(-2.4, 2.4);
					const startPoint = new THREE.Vector3(Math.sin(a) * 0.2, 0.5, Math.cos(a) * 0.2 - 0.05);
					const fall = random(0.15, 0.32);
					const points = [startPoint, startPoint.clone().add(new THREE.Vector3(Math.sin(a) * 0.12, -fall * 0.4, Math.cos(a) * 0.1)), startPoint.clone().add(new THREE.Vector3(Math.sin(a) * 0.16 + random(-0.03, 0.03), -fall, Math.cos(a) * 0.12))];
					head.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(points), 8, 0.004, 4), hairMaterial));
				}
				// A yellowed lace bonnet around the back of the head, ruffled at the brim.
				const bonnet = new THREE.Mesh(
					displace(new THREE.SphereGeometry(0.34, 32, 16, Math.PI * 0.95, Math.PI * 1.1, 0, Math.PI * 0.72), (x, y, z) => {
						const k = 1 + 0.04 * Math.sin(Math.atan2(y, x) * 22) * smoothstep(-0.1, 0.25, z);
						return [x * k, y * k, z];
					}),
					cloth,
				);
				bonnet.position.set(0, 0.27, -0.03);
				head.add(bonnet);
				doll.add(head);
				doll.userData = { head, eyes, blink: 0 };
				return doll;
			}

			const doll = buildDoll();

			function buildCandyCorn() {
				const geometry = new THREE.ConeGeometry(0.06, 0.16, 16, 6).scale(1, 1, 0.55);
				const colors = [];
				const position = geometry.attributes.position;
				const yellow = new THREE.Color("#f2ad1d");
				const orange = new THREE.Color("#ec6614");
				const white = new THREE.Color("#f3ede0");
				for (let i = 0; i < position.count; i++) {
					const y = position.getY(i) / 0.16 + 0.5;
					const c = y < 0.38 ? yellow : y < 0.72 ? orange : white;
					colors.push(c.r, c.g, c.b);

				geometry.setAttribute("color", new THREE.Float32BufferAttribute(colors, 3));
				return new THREE.Mesh(geometry, new THREE.MeshPhysicalMaterial({ vertexColors: true, roughness: 0.4, clearcoat: 0.3 }));
			}

			function buildWrappedCandy(color) {
				const candy = new THREE.Group();
				const wrapper = new THREE.MeshPhysicalMaterial({ color, roughness: 0.25, clearcoat: 1, metalness: 0.2 });
				candy.add(new THREE.Mesh(new THREE.SphereGeometry(1, 16, 12).scale(0.08, 0.05, 0.05), wrapper));

					twist.rotation.z = (side * Math.PI) / 2;
					twist.position.x = side * 0.1;
					candy.add(twist);

				return candy;
			}

			interactives.push({ object: jarLid, body: jarLidBody });

			// Eyeballs: wet, yellowed whites with red veins creeping toward the iris
			// (the iris sits at u = 0.25, the front of a sphere).
			function eyeballTexture([inner, outer]) {
				const [canvas, ctx] = makeCanvas(256, 128);
				ctx.fillStyle = "#ece2cf";
				ctx.fillRect(0, 0, 256, 128);
				ctx.filter = "blur(10px)";
				ctx.fillStyle = "rgba(205, 120, 105, 0.45)";
				ctx.fillRect(140, 0, 104, 128); // pinker toward the back
				ctx.filter = "none";
				for (let i = 0; i < 30; i++) {
					const dir = rand() < 0.5 ? -1 : 1;
					let x = 192 + random(-50, 50);
					let y = random(12, 116);
					const path = [[x, y]];
					for (let step = 0; step < 14; step++) {
						x += dir * random(4, 9);
						y += random(-5, 5);
						path.push([x, y]);
						const toIris = Math.min(Math.abs(x - 64), Math.abs(x - 320), Math.abs(x + 192));
						if (Math.hypot(toIris, y - 64) < 28) break;
					}
					ctx.strokeStyle = `rgba(${randInt(150, 205)}, 28, 28, ${random(0.35, 0.8)})`;
					ctx.lineWidth = random(0.6, 1.6);
					for (const shift of [-256, 0, 256]) {
						ctx.beginPath();
						path.forEach(([px, py]) => ctx.lineTo(px + shift, py));
						ctx.stroke();
					}
				}
				const iris = ctx.createRadialGradient(64, 64, 0, 64, 64, 23);
				iris.addColorStop(0, "#050505");
				iris.addColorStop(0.3, "#050505");
				iris.addColorStop(0.36, inner);
				iris.addColorStop(0.85, outer);
				iris.addColorStop(0.95, "#1d1612");
				iris.addColorStop(1, "rgba(40, 30, 25, 0)");
				ctx.fillStyle = iris;
				ctx.beginPath();
				ctx.arc(64, 64, 23, 0, TAU);
				ctx.fill();
				ctx.strokeStyle = "rgba(255, 255, 255, 0.12)";
				for (let a = 0; a < TAU; a += 0.12) {
					ctx.beginPath();
					ctx.moveTo(64 + Math.cos(a) * 8, 64 + Math.sin(a) * 8);
					ctx.lineTo(64 + Math.cos(a) * 19, 64 + Math.sin(a) * 19);
					ctx.stroke();
				}
				return colorTexture(canvas);
			}

			rand = mulberry32(13);
			const eyeMaterials = [
				["#7a9fb8", "#3e5a6e"],
				["#7f8f4e", "#4a5530"],
				["#8a5a32", "#4a2e18"],
				["#9aa7ad", "#56636b"],
			].map((iris) => new THREE.MeshPhysicalMaterial({ map: eyeballTexture(iris), roughness: 0.12, clearcoat: 1, clearcoatRoughness: 0.05 }));
			const nerveMaterial = new THREE.MeshStandardMaterial({ color: "#8c4a46", roughness: 0.5 });
			const EYE_RADIUS = 0.075;
			const eyeGeometry = new THREE.SphereGeometry(EYE_RADIUS, 32, 20);
			const nerveGeometry = new THREE.CylinderGeometry(0.012, 0.02, 0.08, 8).rotateX(Math.PI / 2).translate(0, 0, -EYE_RADIUS - 0.03);

			// Packed in layers: a ring of six around one in the middle.
			const eyeballs = [];
			for (let layer = 0, n = 0; layer < 4; layer++) {
				for (let k = 0; k < 7 && n < 24; k++, n++) {
					const a = (k / 6) * TAU + layer * 0.5;
					const r = k === 6 ? 0 : 0.16;
					const eyeball = new THREE.Group();
					const look = new THREE.Group(); // turns inside the ball, which itself rolls with physics
					look.add(new THREE.Mesh(eyeGeometry, eyeMaterials[randInt(0, 3)]), new THREE.Mesh(nerveGeometry, nerveMaterial));
					look.rotation.set(random(-1.5, 1.5), random(0, TAU), 0);
					eyeball.add(look);
					eyeball.position.set(jar.position.x + Math.cos(a) * r + random(-0.01, 0.01), 0.09 + layer * 0.155, jar.position.z + Math.sin(a) * r + random(-0.01, 0.01));
					scene.add(shadowed(eyeball));
					const body = addDynamic(eyeball, [RAPIER.ColliderDesc.ball(EYE_RADIUS)], { density: 1.05, friction: 0.4, restitution: 0.25 });
					interactives.push({ object: eyeball, body });
					eyeballs.push({ look, watches: rand() < 0.75, rate: random(0.4, 1.2) });
				}
			}
			const eyeAim = new THREE.Object3D();

			// =====================================================================
			// Cobwebs
			// =====================================================================

			// A fan web in a corner: spokes from `corner` spread between dirA and
			// dirB, with sagging spiral threads and a couple of loose strands.
			function buildCobweb(corner, dirA, dirB, size) {
				const points = [];
				const spokes = randInt(7, 10);
				const rings = randInt(6, 9);
				const sag = new THREE.Vector3(0, -1, 0);
				const ends = [];
				for (let s = 0; s < spokes; s++) {
					const dir = dirA.clone().lerp(dirB, s / (spokes - 1)).normalize();
					ends.push({ dir, length: size * random(0.8, 1.1) });
					points.push(corner.clone(), corner.clone().addScaledVector(dir, ends[s].length));
				}
				for (let r = 1; r <= rings; r++) {
					for (let s = 0; s < spokes - 1; s++) {
						if (rand() < 0.08) continue; // broken
						const d = (r / (rings + 1)) * size * random(0.95, 1.05);
						const a = corner.clone().addScaledVector(ends[s].dir, Math.min(d, ends[s].length));
						const b = corner.clone().addScaledVector(ends[s + 1].dir, Math.min(d, ends[s + 1].length));
						const mid = a.clone().lerp(b, 0.5).addScaledVector(sag, 0.02 * d);
						points.push(a, mid, mid.clone(), b);
					}
				}
				for (let i = 0; i < 3; i++) {
					const start = corner.clone().addScaledVector(ends[randInt(0, spokes - 1)].dir, size * random(0.3, 0.9));
					points.push(start, start.clone().add(new THREE.Vector3(random(-0.05, 0.05), -random(0.15, 0.45), random(-0.05, 0.05))));
				}
				return new THREE.LineSegments(
					new THREE.BufferGeometry().setFromPoints(points),
					new THREE.LineBasicMaterial({ color: "#d4d6da", transparent: true, opacity: 0.3, depthWrite: false }),
				);
			}

			// A strand sagging between two points.
			function strand(a, b, sagAmount) {
				const points = [];
				for (let i = 0; i <= 16; i++) {
					const t = i / 16;
					points.push(a.clone().lerp(b, t).add(new THREE.Vector3(0, -sagAmount * 4 * t * (1 - t), 0)));
				}
				return new THREE.Line(new THREE.BufferGeometry().setFromPoints(points), new THREE.LineBasicMaterial({ color: "#d4d6da", transparent: true, opacity: 0.28, depthWrite: false }));
			}

			rand = mulberry32(404);
			const tableBack = table.position.z - tableDepth / 2;
			const tableFront = table.position.z + tableDepth / 2;
			scene.add(
				buildCobweb(new THREE.Vector3(-2.0, 0.01, tableBack + 0.02), new THREE.Vector3(0.55, 1, 0.3), new THREE.Vector3(1, 0.05, 0.02), 1.0),
				buildCobweb(new THREE.Vector3(-1.62, 1.85, -0.72), new THREE.Vector3(-0.2, -0.4, 1), new THREE.Vector3(-0.9, -0.6, 0.6), 0.7),
				buildCobweb(new THREE.Vector3(legX - 0.02, -0.45, table.position.z + legZ - 0.02), new THREE.Vector3(-1, 0, 0), new THREE.Vector3(0, -1, 0), 0.9),
				buildCobweb(new THREE.Vector3(2.0, 0.01, tableBack + 0.03), new THREE.Vector3(-0.6, 1, 0.4), new THREE.Vector3(-1, 0.1, 0.05), 0.8),
				strand(new THREE.Vector3(0.82, 1.7, -1.02), new THREE.Vector3(1.5, 1.05, -0.78), 0.12),
				strand(new THREE.Vector3(0.84, 1.55, -1.0), new THREE.Vector3(1.62, 0.9, -0.66), 0.08),
				strand(new THREE.Vector3(-0.88, 1.5, -1.05), new THREE.Vector3(-1.45, 1.95, -0.88), 0.1),
			);

			// =====================================================================
			// Smoke
			// One draw call for every wisp: particles carry their own size and fade.
			// A wick that's just gone out puffs for a couple of seconds, then keeps
			// giving off a thin, wavering thread.
			// =====================================================================

			const pointScale = { value: 1 }; // set in resize()
			const SMOKE_MAX = 500;
			const smokeGeometry = new THREE.BufferGeometry();
			const smokePositions = new Float32Array(SMOKE_MAX * 3);
			const smokeSize = new Float32Array(SMOKE_MAX);
			const smokeAlpha = new Float32Array(SMOKE_MAX);
			smokeGeometry.setAttribute("position", new THREE.BufferAttribute(smokePositions, 3));
			smokeGeometry.setAttribute("aSize", new THREE.BufferAttribute(smokeSize, 1));
			smokeGeometry.setAttribute("aAlpha", new THREE.BufferAttribute(smokeAlpha, 1));
			const smokePoints = new THREE.Points(
				smokeGeometry,
				new THREE.ShaderMaterial({
					uniforms: { uScale: pointScale },
					transparent: true,
					depthWrite: false,
					vertexShader: `
						attribute float aSize;
						attribute float aAlpha;
						uniform float uScale;
						varying float vAlpha;
						void main() {
							vAlpha = aAlpha;
							vec4 mv = modelViewMatrix * vec4(position, 1.0);
							gl_PointSize = aSize * uScale / -mv.z;
							gl_Position = projectionMatrix * mv;
						}
					`,
					fragmentShader: `
						varying float vAlpha;
						void main() {
							float d = length(gl_PointCoord - 0.5);
							gl_FragColor = vec4(0.78, 0.75, 0.71, smoothstep(0.5, 0.1, d) * vAlpha);
						}
					`,
				}),
			);
			smokePoints.frustumCulled = false;
			scene.add(smokePoints);
			const smoke = Array.from({ length: SMOKE_MAX }, () => ({ age: 1, life: 0, burst: false, phase: 0 }));
			const smokeEmitters = [];
			let smokeNext = 0;

			function updateSmoke(dt, t) {
				for (const emitter of smokeEmitters) {
					emitter.age += dt;
					const burst = emitter.age < 2;
					emitter.carry += (burst ? 30 * (1 - emitter.age / 2) + 16 : 16) * dt;
					while (emitter.carry >= 1) {
						emitter.carry -= 1;
						const i = smokeNext;
						smokeNext = (smokeNext + 1) % SMOKE_MAX;
						Object.assign(smoke[i], { age: 0, life: burst ? 4.5 : 5.5, burst, phase: Math.random() * TAU });
						emitter.flame.mesh.getWorldPosition(_v);
						smokePositions.set([_v.x, _v.y + 0.01, _v.z], i * 3);
					}
				}
				for (let i = 0; i < SMOKE_MAX; i++) {
					const puff = smoke[i];
					if (puff.age >= puff.life) {
						smokeAlpha[i] = 0;
						continue;
					}
					puff.age += dt;
					const k = Math.min(1, puff.age / puff.life);
					const wave = Math.sin(t * 1.7 + puff.phase + puff.age * 1.3);
					smokePositions[i * 3] += wave * 0.05 * (1 + k * 2) * dt;
					smokePositions[i * 3 + 1] += (puff.burst ? 0.35 : 0.28) * (1 - 0.4 * k) * dt;
					smokePositions[i * 3 + 2] += Math.cos(t * 1.3 + puff.phase) * 0.03 * (1 + k) * dt;
					smokeSize[i] = puff.burst ? 0.05 + 0.3 * k : 0.03 + 0.14 * k;
					smokeAlpha[i] = (puff.burst ? 0.32 : 0.22) * (1 - k) * Math.min(1, puff.age * 4);
				}
				smokeGeometry.attributes.position.needsUpdate = true;
				smokeGeometry.attributes.aSize.needsUpdate = true;
				smokeGeometry.attributes.aAlpha.needsUpdate = true;
			}

			// =====================================================================
			// Picking up and clicking
			// A press on something interactive takes the pointer away from the
			// camera controls. Small movement + release = click; otherwise it's a
			// drag: the body is pulled toward the pointer on a plane facing the
			// camera, still colliding with everything, and falls when let go.
			// =====================================================================

			const raycaster = new THREE.Raycaster();
			const pointerNDC = new THREE.Vector2();
			// Things that block picking: you can't grab what's hidden behind the pumpkin.
			const occluders = pumpkin.children.filter((child) => child.isMesh && child.material !== wireMaterial);
			const pickables = [...interactives.map((entry) => entry.object), lidRoot, ...occluders];
			interactives.push({ object: lidRoot, body: lidBody });

			function pick(event) {
				pointerNDC.set((event.clientX / innerWidth) * 2 - 1, -(event.clientY / innerHeight) * 2 + 1);
				raycaster.setFromCamera(pointerNDC, camera);
				for (const hit of raycaster.intersectObjects(pickables, true)) {
					if (hit.object.material === wireMaterial || !hit.object.visible) continue;
					for (let object = hit.object; object; object = object.parent) {
						const entry = interactives.find((e) => e.object === object);
						if (entry) return { entry, point: hit.point };
					}
					return null; // something else is in the way
				}
				return null;
			}

			let press = null; // { entry, point, x, y, dragging }
			const dragPlane = new THREE.Plane();
			const dragOffset = new THREE.Vector3();
			const dragTarget = new THREE.Vector3();

			addEventListener(
				"pointerdown",
				(event) => {
					if (!event.isPrimary || event.button !== 0 || event.target !== renderer.domElement) return;
					const hit = pick(event);
					if (!hit) return;
					controls.enabled = false; // the controls' own listener runs after this one
					press = { ...hit, x: event.clientX, y: event.clientY, dragging: false };
					dragTarget.copy(hit.point);
				},
				{ capture: true },
			);

			addEventListener(
				"pointermove",
				(event) => {
					if (!press || !event.isPrimary) return;
					if (!press.dragging && press.entry.body && Math.hypot(event.clientX - press.x, event.clientY - press.y) > 6) {
						const body = press.entry.body;
						body.wakeUp();
						body.setGravityScale(0, true);
						camera.getWorldDirection(_v);
						dragPlane.setFromNormalAndCoplanarPoint(_v, press.point);
						const t = body.translation();
						dragOffset.set(press.point.x - t.x, press.point.y - t.y, press.point.z - t.z);
						press.dragging = true;
						renderer.domElement.style.cursor = "grabbing";
					}
					if (press.dragging) {
						pointerNDC.set((event.clientX / innerWidth) * 2 - 1, -(event.clientY / innerHeight) * 2 + 1);
						raycaster.setFromCamera(pointerNDC, camera);
						raycaster.ray.intersectPlane(dragPlane, dragTarget);
					}
				},
				{ capture: true },
			);

			function release(event) {
				if (!press || !event.isPrimary) return;
				if (press.dragging) {
					press.entry.body.setGravityScale(1, true);
					renderer.domElement.style.cursor = "";
				} else if (Math.hypot(event.clientX - press.x, event.clientY - press.y) <= 6) {
					press.entry.onClick?.();
				}
				press = null;
				controls.enabled = true;
				sweep.idle = 0;
			}
			addEventListener("pointerup", release, { capture: true });
			addEventListener("pointercancel", release, { capture: true });

			function updateDrag() {
				if (!press?.dragging) return;
				const body = press.entry.body;
				const t = body.translation();
				_v.set(dragTarget.x - dragOffset.x - t.x, dragTarget.y - dragOffset.y - t.y, dragTarget.z - dragOffset.z - t.z).multiplyScalar(14);
				if (_v.length() > 30) _v.setLength(30);
				body.setLinvel({ x: _v.x, y: _v.y, z: _v.z }, true);
				const w = body.angvel();
				body.setAngvel({ x: w.x * 0.85, y: w.y * 0.85, z: w.z * 0.85 }, true);
			}

			let physicsTime = 0;
			function stepPhysics(dt) {
				physicsTime += dt;
				while (physicsTime >= PHYSICS_STEP) {
					updateDrag();
					world.step();
					physicsTime -= PHYSICS_STEP;
				}
				for (const { body, object } of dynamicBodies) {
					const t = body.translation();
					const r = body.rotation();
					object.position.set(t.x, t.y, t.z);
					object.quaternion.set(r.x, r.y, r.z, r.w);
				}
			}

			for (let i = 0; i < 120; i++) world.step(); // settle before the first frame

			// =====================================================================
			// Little lives of things on the table
			// =====================================================================

			const dollHeadWorld = new THREE.Vector3();
			function updateProps(dt, t) {
				// Candles: ease each flame in or out; the cluster light follows them.
				let clusterLit = 0;
				for (const entry of flames) {
					entry.lit += ((entry.on ? 1 : 0) - entry.lit) * Math.min(1, dt * 6);
					if (entry === pumpkinFlame) continue;
					const level = entry.lit * (0.92 + 0.06 * Math.sin(t * 7 + entry.material.uniforms.uPhase.value) + 0.04 * flicker);
					entry.material.uniforms.uTime.value = t;
					entry.material.uniforms.uSway.value = 0.1 * Math.sin(t * 1.1 + entry.material.uniforms.uPhase.value) + gust * gustSide;
					entry.mesh.visible = entry.lit > 0.01;
					entry.mesh.scale.set(entry.lit, (0.85 + 0.2 * level) * entry.lit, entry.lit);
					entry.mesh.getWorldPosition(_v);
					entry.mesh.rotation.y = Math.atan2(camera.position.x - _v.x, camera.position.z - _v.z);
					entry.wax.userData.level.value = level;
					clusterLit += level;
				}
				clusterLight.intensity = (CLUSTER_INTENSITY * clusterLit) / clusterFlames.length;

				// Skull jaw.
				jawChatter = Math.max(0, jawChatter - dt);
				skull.userData.jaw.rotation.x = jawChatter > 0 ? 0.28 * Math.abs(Math.sin(t * 26)) * Math.min(1, jawChatter * 2) : 0;

				// Doll: the head turns, slowly, to follow you; a click makes her blink.
				const { head, eyes } = doll.userData;
				head.getWorldPosition(dollHeadWorld);
				const facing = Math.atan2(camera.position.x - dollHeadWorld.x, camera.position.z - dollHeadWorld.z) - doll.rotation.y;
				const want = clamp(wrapAngle(facing), -1.1, 1.1);
				head.rotation.y += clamp(want - head.rotation.y, -0.35 * dt, 0.35 * dt);
				head.rotation.z = 0.18 + 0.03 * Math.sin(t * 0.4);
				doll.userData.blink = Math.max(0, doll.userData.blink - dt * 2.5);
				const close = Math.sin(Math.PI * doll.userData.blink);
				eyes[0].rotation.x = -1.25 + 1.2 * close;
				eyes[1].rotation.x = -0.9 + 0.85 * close;

				// Most of the eyeballs turn, each at its own pace, to watch you.
				for (const eye of eyeballs) {
					if (!eye.watches) continue;
					eye.look.getWorldPosition(eyeAim.position);
					eyeAim.lookAt(camera.position);
					eye.look.parent.getWorldQuaternion(_q).invert().multiply(eyeAim.quaternion);
					eye.look.quaternion.slerp(_q, Math.min(1, dt * eye.rate));
				}

				updateSmoke(dt, t);
			}

			// =====================================================================
			// Surroundings
			// Fog, a churchyard of crooked trees and leaning stones, a huge low moon
			// and a cauldron bubbling in the mist. All of it is seen through fog, so
			// it's built for silhouette more than close-up detail.
			// =====================================================================

			rand = mulberry32(1337);
			const envTime = { value: 0 };
			scene.fog = new THREE.FogExp2("#1c2230", 0.026);

			// Fog sheets: wide horizontal layers of drifting noise, thick near the
			// ground and kept clear right around the table.
			function fogTexture() {
				const octave = (period) => {
					const lattice = Float32Array.from({ length: period * period }, rand);
					const at = (x, y) => lattice[(((y % period) + period) % period) * period + (((x % period) + period) % period)];
					return (u, v) => {
						const x = u * period;
						const y = v * period;
						const xi = Math.floor(x);
						const yi = Math.floor(y);
						const sx = smoothstep(0, 1, x - xi);
						const sy = smoothstep(0, 1, y - yi);
						const top = at(xi, yi) + (at(xi + 1, yi) - at(xi, yi)) * sx;
						const bottom = at(xi, yi + 1) + (at(xi + 1, yi + 1) - at(xi, yi + 1)) * sx;
						return top + (bottom - top) * sy;
					};
				};
				const octaves = [octave(4), octave(8), octave(16)];
				const [[canvas]] = paintCanvases(256, 256, 1, (x, y, out) => {
					const u = x / 256;
					const v = y / 256;
					const n = 0.55 * octaves[0](u, v) + 0.3 * octaves[1](u, v) + 0.15 * octaves[2](u, v);
					out[0][0] = out[0][1] = out[0][2] = 255 * smoothstep(0.3, 0.8, n);
				});
				const texture = dataTexture(canvas);
				texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
				return texture;
			}

			const fogMap = fogTexture();
			function fogSheet(y, opacity, clearRadius) {
				const sheet = new THREE.Mesh(
					new THREE.PlaneGeometry(240, 240).rotateX(-Math.PI / 2),
					new THREE.ShaderMaterial({
						uniforms: { uMap: { value: fogMap }, uTime: envTime, uOpacity: { value: opacity }, uClear: { value: clearRadius }, uSeed: { value: random(0, 10) } },
						transparent: true,
						depthWrite: false,
						vertexShader: `
							varying vec3 vWorld;
							void main() {
								vec4 world = modelMatrix * vec4(position, 1.0);
								vWorld = world.xyz;
								gl_Position = projectionMatrix * viewMatrix * world;
							}
						`,
						fragmentShader: `
							uniform sampler2D uMap;
							uniform float uTime;
							uniform float uOpacity;
							uniform float uClear;
							uniform float uSeed;
							varying vec3 vWorld;
							void main() {
								vec2 p = vWorld.xz;
								float a = texture2D(uMap, p * 0.03 + vec2(uTime * 0.004 + uSeed, uTime * 0.002)).r;
								float b = texture2D(uMap, p * 0.08 - vec2(uTime * 0.006, uSeed - uTime * 0.003)).r;
								float d = length(p);
								float fade = smoothstep(uClear, uClear + 5.0, d) * (1.0 - smoothstep(70.0, 115.0, d));
								gl_FragColor = vec4(0.36, 0.4, 0.48, a * (0.55 + 0.6 * b) * uOpacity * fade);
							}
						`,
					}),
				);
				sheet.position.y = y;
				sheet.renderOrder = 2;
				scene.add(sheet);
			}
			for (const [height, opacity] of [
				[0.15, 0.45],
				[0.45, 0.4],
				[0.85, 0.34],
				[1.4, 0.28],
				[2.1, 0.22],
				[3.0, 0.16],
			]) {
				fogSheet(groundY + height, opacity, 0);
			}
			for (const y of [-1.4, -0.5, 0.5, 1.6]) fogSheet(y, 0.16, 7);

			// --- Bare, crooked trees whose thin branches curl at the tips --------

			const barkMaterial = new THREE.MeshStandardMaterial({ color: "#1e1915", roughness: 1 });

			function buildTree(height, crooked, perch) {
				const parts = [];
				const grow = (start, direction, length, radius, depth) => {
					const points = [start.clone()];
					const d = direction.clone();
					const curlAxis = new THREE.Vector3(random(-1, 1), random(-0.3, 0.3), random(-1, 1)).normalize();
					const curl = depth >= 2 ? random(0.3, 0.7) * (rand() < 0.5 ? -1 : 1) : 0;
					let p = start.clone();
					for (let i = 1; i <= 6; i++) {
						d.add(new THREE.Vector3(random(-1, 1), random(-0.4, 0.6), random(-1, 1)).multiplyScalar(crooked)).normalize();
						if (curl) d.applyAxisAngle(curlAxis, curl * (i / 6) * 1.5); // tips curl round on themselves
						p = p.clone().addScaledVector(d, length / 6);
						points.push(p);
					}
					parts.push(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(points), 18, radius, 7, false));
					if (depth >= 4 || radius < 0.05) return;
					for (let c = 0, count = depth === 0 ? randInt(3, 4) : randInt(2, 3); c < count; c++) {
						const at = points[randInt(2, 6)];
						const branch = d.clone().add(new THREE.Vector3(random(-1.3, 1.3), random(-0.2, 0.7), random(-1.3, 1.3))).normalize();
						grow(at, branch, length * random(0.5, 0.75), radius * random(0.45, 0.62), depth + 1);
					}
				};
				grow(new THREE.Vector3(0, -0.5, 0), new THREE.Vector3(random(-0.15, 0.15), 1, random(-0.15, 0.15)).normalize(), height * 0.45, height * 0.032, 0);
				for (let r = 0; r < 5; r++) {
					const a = (r / 5) * TAU + random(-0.3, 0.3);
					const out = new THREE.Vector3(Math.cos(a), 0, Math.sin(a));
					const root = [new THREE.Vector3(0, height * 0.05, 0), out.clone().multiplyScalar(height * 0.04).setY(height * 0.01), out.clone().multiplyScalar(height * 0.08).setY(-0.4)];
					parts.push(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(root), 10, height * 0.014, 6, false));
				}
				if (perch) {
					const points = [perch.from, perch.from.clone().lerp(perch.to, 0.5).add(new THREE.Vector3(0, 0.6, 0)), perch.to];
					parts.push(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(points), 16, 0.35, 7, false));
				}
				return mergeGeometries(parts);
			}

			// The big gnarled tree stands in front of the moon, with a bare branch
			// for the vulture.
			const perch = { from: new THREE.Vector3(0, 13, 0), to: new THREE.Vector3(8, 15.5, 2) };
			const trees = [
				[-11, -34, 46, 0.35, perch],
				[13, -29, 38, 0.3],
				[-25, -19, 34, 0.32],
				[24, -42, 44, 0.28],
				[-3, -56, 52, 0.3],
				[8, -72, 46, 0.3],
				[-33, -48, 40, 0.3],
				[30, -16, 30, 0.34],
			];
			const bigTree = new THREE.Vector3(trees[0][0], groundY, trees[0][1]);
			for (const [x, z, height, crooked, branch] of trees) {
				const tree = new THREE.Mesh(buildTree(height, crooked, branch), barkMaterial);
				tree.position.set(x, groundY, z);
				scene.add(tree);
			}

			// --- Gravestones ------------------------------------------------------

			function stoneTextures() {
				const [[colorCanvas], [bumpCanvas]] = paintCanvases(512, 512, 2, (x, y, out) => {
					const n = woodNoise(x * 0.02 + 5000, y * 0.02) * 0.5 + woodNoise(x * 0.08 + 5100, y * 0.08) * 0.3 + woodNoise(x * 0.4 + 5200, y * 0.4) * 0.2;
					const moss = smoothstep(0.55, 0.75, woodNoise(x * 0.015 + 5300, y * 0.015)) * smoothstep(150, 512, y);
					const lichen = smoothstep(0.78, 0.86, woodNoise(x * 0.06 + 5400, y * 0.06));
					out[0][0] = 70 + 50 * n - 30 * moss + 60 * lichen;
					out[0][1] = 72 + 48 * n - 5 * moss + 55 * lichen;
					out[0][2] = 70 + 42 * n - 35 * moss + 35 * lichen;
					out[1][0] = out[1][1] = out[1][2] = 255 * n;
				});
				const map = colorTexture(colorCanvas);
				const bumpMap = dataTexture(bumpCanvas);
				for (const texture of [map, bumpMap]) {
					texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
					texture.repeat.set(0.25, 0.25);
				}
				return new THREE.MeshStandardMaterial({ map, bumpMap, bumpScale: 3, roughness: 0.95 });
			}
			const stoneMaterial = stoneTextures();

			function buildGravestone(kind) {
				const width = random(2.6, 3.6);
				const height = random(4.2, 6.2);
				const depth = random(0.5, 0.7);
				const shape = new THREE.Shape();
				shape.moveTo(-width / 2, 0);
				if (kind === 0) {
					shape.lineTo(-width / 2, height - width / 2);
					shape.absarc(0, height - width / 2, width / 2, Math.PI, 0, true);
				} else {
					shape.lineTo(-width / 2, height - width * 0.6);
					shape.quadraticCurveTo(-width / 2, height - width * 0.15, 0, height);
					shape.quadraticCurveTo(width / 2, height - width * 0.15, width / 2, height - width * 0.6);
				}
				shape.lineTo(width / 2, 0);
				shape.closePath();
				const geometry = new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled: true, bevelThickness: 0.08, bevelSize: 0.08, bevelSegments: 2, curveSegments: 20 });
				geometry.translate(0, 0, -depth / 2);
				// Weathered: chipped, uneven edges.
				const offset = random(0, 100);
				return displace(geometry, (x, y, z) => {
					const k = 1 + 0.04 * (woodNoise(x * 1.5 + offset, y * 1.5) - 0.5);
					return [x * k, y + 0.12 * (woodNoise(x * 2 + offset, z * 3) - 0.5) * smoothstep(height * 0.7, height, y), z * k];
				});
			}

			function buildCross() {
				const parts = [new THREE.BoxGeometry(0.7, 6, 0.6).translate(0, 3, 0), new THREE.BoxGeometry(3, 0.7, 0.6).translate(0, 4.2, 0)];
				return mergeGeometries(parts.map((part) => part.toNonIndexed()));
			}

			for (const [x, z] of [
				[-9, -10],
				[-13, -17],
				[-6, -25],
				[-1.5, -28],
				[4.5, -26],
				[10, -23],
				[14, -13],
				[11, -9],
				[-16, -29],
				[18, -31],
				[-4, -38],
				[8, -39],
				[-21, -11],
				[22, -24],
			]) {
				const stone = new THREE.Mesh(rand() < 0.18 ? buildCross() : buildGravestone(rand() < 0.6 ? 0 : 1), stoneMaterial);
				stone.position.set(x, groundY - random(0.2, 0.6), z);
				stone.rotation.set(random(-0.14, 0.14), Math.atan2(-x, 5 - z) + random(-0.4, 0.4), random(-0.12, 0.12));
				stone.castShadow = true;
				stone.receiveShadow = true;
				scene.add(stone);
			}

			// --- The moon: huge, low, and a little too detailed --------------------

			function moonTexture() {
				const w = 2048;
				const h = 1024;
				// The near side faces +z, which is u = 0.25. Its dark plains are
				// arranged, faintly, like a face.
				const plain = (u, v, cu, cv, ru, rv) => Math.exp(-(((u - cu) / ru) ** 2 + ((v - cv) / rv) ** 2));
				const [[canvas, ctx]] = paintCanvases(w, h, 1, (x, y, out) => {
					const u = x / w;
					const v = y / h;
					const n = woodNoise(u * 14 + 7000, v * 7, 14) * 0.5 + woodNoise(u * 48 + 7100, v * 24, 48) * 0.3 + woodNoise(u * 180 + 7200, v * 90, 180) * 0.2;
					const maria = Math.max(
						plain(u, v, 0.215, 0.41, 0.03, 0.065),
						plain(u, v, 0.29, 0.4, 0.034, 0.07),
						plain(u, v, 0.255, 0.6, 0.075, 0.035) * 0.9,
						smoothstep(0.58, 0.75, woodNoise(u * 6 + 7300, v * 3, 6)) * 0.8,
					);
					const g = 196 + 50 * (n - 0.5) - 92 * maria * (0.7 + 0.3 * n);
					out[0][0] = g;
					out[0][1] = g * 0.97;
					out[0][2] = g * 0.92;
				});

				// Craters: shadowed floor, a lit rim toward the upper left, a dark rim
				// opposite, and bright rays from a few young ones.
				const crater = (x, y, r) => {
					const floor = ctx.createRadialGradient(x, y, 0, x, y, r);
					floor.addColorStop(0, "rgba(40, 38, 36, 0.35)");
					floor.addColorStop(0.8, "rgba(60, 58, 55, 0.2)");
					floor.addColorStop(1, "rgba(60, 58, 55, 0)");
					ctx.fillStyle = floor;
					ctx.beginPath();
					ctx.arc(x, y, r, 0, TAU);
					ctx.fill();
					ctx.lineWidth = Math.max(1, r * 0.18);
					ctx.strokeStyle = "rgba(255, 250, 240, 0.35)";
					ctx.beginPath();
					ctx.arc(x, y, r, Math.PI * 0.95, Math.PI * 1.7);
					ctx.stroke();
					ctx.strokeStyle = "rgba(20, 18, 16, 0.4)";
					ctx.beginPath();
					ctx.arc(x, y, r, Math.PI * 1.95, Math.PI * 2.7);
					ctx.stroke();
				};
				for (let i = 0; i < 1400; i++) crater(random(0.03, 0.47) * w, random(0.1, 0.9) * h, random(1.5, 5));
				for (let i = 0; i < 160; i++) crater(random(0.03, 0.47) * w, random(0.12, 0.88) * h, random(6, 22));
				for (let i = 0; i < 12; i++) {
					const x = random(0.06, 0.44) * w;
					const y = random(0.18, 0.82) * h;
					const r = random(26, 60);
					if (i < 3) {
						ctx.strokeStyle = "rgba(255, 252, 240, 0.07)";
						for (let ray = 0; ray < 26; ray++) {
							const a = random(0, TAU);
							const len = random(120, 420);
							ctx.lineWidth = random(1, 4);
							ctx.beginPath();
							ctx.moveTo(x, y);
							ctx.lineTo(x + Math.cos(a) * len, y + Math.sin(a) * len * 0.5);
							ctx.stroke();
						}
					}
					crater(x, y, r);
				}
				return colorTexture(canvas);
			}

			const MOON_DISTANCE = 250;
			const moonDirection = new THREE.Vector3(-0.36, 0.095, -1).normalize();
			const MOON_RADIUS = MOON_DISTANCE * Math.tan(THREE.MathUtils.degToRad(5));
			const moonDisc = new THREE.Mesh(
				new THREE.SphereGeometry(MOON_RADIUS, 64, 48),
				new THREE.ShaderMaterial({
					uniforms: { uMap: { value: moonTexture() } },
					vertexShader: `
						varying vec2 vUv;
						varying float vFacing;
						void main() {
							vUv = uv;
							vec3 n = normalize(normalMatrix * normal);
							vec4 mv = modelViewMatrix * vec4(position, 1.0);
							vFacing = max(dot(n, normalize(-mv.xyz)), 0.0);
							gl_Position = projectionMatrix * mv;
						}
					`,
					fragmentShader: `
						uniform sampler2D uMap;
						varying vec2 vUv;
						varying float vFacing;
						void main() {
							vec3 color = texture2D(uMap, vUv).rgb * vec3(1.0, 0.86, 0.68);
							gl_FragColor = vec4(color * (0.55 + 0.45 * pow(vFacing, 0.6)), 1.0);
						}
					`,
				}),
			);
			moonDisc.position.copy(moonDirection).multiplyScalar(MOON_DISTANCE);
			moonDisc.rotation.y = Math.atan2(-moonDirection.x, -moonDirection.z); // near side toward us
			scene.add(moonDisc);

			const [haloCanvas, haloCtx] = makeCanvas(256, 256);
			const haloGradient = haloCtx.createRadialGradient(128, 128, 20, 128, 128, 128);
			haloGradient.addColorStop(0, "rgba(255, 210, 160, 0.55)");
			haloGradient.addColorStop(0.35, "rgba(200, 160, 130, 0.18)");
			haloGradient.addColorStop(1, "rgba(120, 110, 120, 0)");
			haloCtx.fillStyle = haloGradient;
			haloCtx.fillRect(0, 0, 256, 256);
			const moonHalo = new THREE.Sprite(
				new THREE.SpriteMaterial({ map: colorTexture(haloCanvas), blending: THREE.AdditiveBlending, depthWrite: false, fog: false, opacity: 0.6 }),
			);
			moonHalo.position.copy(moonDirection).multiplyScalar(MOON_DISTANCE + MOON_RADIUS * 2);
			moonHalo.scale.setScalar(MOON_RADIUS * 9);
			scene.add(moonHalo);

			// --- The cauldron, out in the fog to the right ----------------------

			const cauldron = new THREE.Group();
			const ironMaterial = new THREE.MeshStandardMaterial({ color: "#1b1a19", metalness: 0.7, roughness: 0.6 });
			cauldron.add(
				new THREE.Mesh(
					lathe([
						[0.001, 0.25],
						[0.9, 0.2],
						[1.4, 0.5],
						[1.65, 1.1],
						[1.6, 1.7],
						[1.35, 2.05],
						[1.42, 2.15],
						[1.48, 2.26],
						[1.32, 2.28],
						[1.26, 2.1],
						[1.3, 1.8],
					]),
					ironMaterial,
				),
			);
			for (let i = 0; i < 3; i++) {
				const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.18, 0.5, 8), ironMaterial);
				leg.position.set(Math.cos((i / 3) * TAU) * 0.9, 0.2, Math.sin((i / 3) * TAU) * 0.9);
				cauldron.add(leg);
			}
			// Embers under the pot.
			const emberGlow = new THREE.MeshStandardMaterial({ color: "#000", emissive: "#ff5a14", emissiveIntensity: 1.2 });
			for (let i = 0; i < 4; i++) {
				const log = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.14, 1.4, 8), i % 2 ? emberGlow : barkMaterial);
				log.rotation.set(Math.PI / 2, 0, (i / 4) * Math.PI + random(-0.2, 0.2));
				log.position.y = 0.12;
				cauldron.add(log);
			}
			const potionMaterial = new THREE.ShaderMaterial({
				uniforms: { ...THREE.UniformsUtils.clone(THREE.UniformsLib.fog), uTime: envTime, uSurge: { value: 0 } },
				fog: true,
				vertexShader: `
					#include <fog_pars_vertex>
					varying vec2 vUv;
					void main() {
						vUv = uv;
						vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
						gl_Position = projectionMatrix * mvPosition;
						#include <fog_vertex>
					}
				`,
				fragmentShader: `
					#include <fog_pars_fragment>
					uniform float uTime;
					uniform float uSurge;
					varying vec2 vUv;
					void main() {
						vec2 p = vUv * 2.0 - 1.0;
						float r = length(p);
						float a = atan(p.y, p.x);
						float swirl = sin(a * 3.0 + r * 8.0 - uTime * 1.2) * 0.5 + 0.5;
						float n = sin(p.x * 9.0 + uTime * 1.3) * sin(p.y * 8.0 - uTime * 1.1) * 0.5 + 0.5;
						float glow = 0.35 + 0.35 * swirl * n + 0.3 * uSurge;
						vec3 color = mix(vec3(0.04, 0.3, 0.05), vec3(0.5, 1.0, 0.35), glow);
						gl_FragColor = vec4(color * smoothstep(1.0, 0.8, r), 1.0);
						#include <fog_fragment>
					}
				`,
			});
			const potion = new THREE.Mesh(new THREE.CircleGeometry(1.3, 40).rotateX(-Math.PI / 2), potionMaterial);
			potion.position.y = 1.95;
			cauldron.add(potion);
			const bubbleMaterial = new THREE.MeshBasicMaterial({ color: "#8dff6e" });
			const bubbles = Array.from({ length: 10 }, () => {
				const bubble = new THREE.Mesh(new THREE.SphereGeometry(1, 10, 8), bubbleMaterial);
				cauldron.add(bubble);
				return { mesh: bubble, age: random(0, 1), size: random(0.08, 0.22), x: 0, z: 0 };
			});
			const vaporMaterial = new THREE.SpriteMaterial({ map: colorTexture(glowCanvas), color: "#5dff70", blending: THREE.AdditiveBlending, depthWrite: false, opacity: 0 });
			const vapors = Array.from({ length: 12 }, (_, i) => {
				const sprite = new THREE.Sprite(vaporMaterial.clone());
				cauldron.add(sprite);
				return { sprite, age: i / 12 };
			});
			const CAULDRON_INTENSITY = 4;
			const cauldronLight = new THREE.PointLight("#4dff5e", CAULDRON_INTENSITY, 11, 1.6);
			cauldronLight.position.y = 3.2;
			cauldron.add(cauldronLight);
			cauldron.position.set(8, groundY, -10); // out to the right, clear of the table from most angles
			scene.add(cauldron);
			let cauldronSurge = 0;
			interactives.push({ object: cauldron, onClick: () => (cauldronSurge = 2.5) });
			pickables.push(cauldron);

			// --- A broom, bristles up, leaning against the table -----------------

			function buildBroom() {
				const broom = new THREE.Group();
				const handle = [0, 0.25, 0.5, 0.75, 1].map((t) => new THREE.Vector3(0.06 * Math.sin(t * 7), t * 7.4, 0.05 * Math.cos(t * 5)));
				broom.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(handle), 30, 0.075, 8), new THREE.MeshStandardMaterial({ color: "#3d2b1c", roughness: 0.9 })));
				const straws = [];
				for (let i = 0; i < 140; i++) {
					const a = random(0, TAU);
					const spread = random(0.05, 0.55);
					const length = random(1.6, 2.2);
					const start = new THREE.Vector3(Math.cos(a) * 0.1, 7.1, Math.sin(a) * 0.1);
					const end = new THREE.Vector3(Math.cos(a) * spread, 7.1 + length, Math.sin(a) * spread);
					straws.push(new THREE.TubeGeometry(new THREE.LineCurve3(start, end), 1, random(0.008, 0.016), 3, false));
				}
				broom.add(new THREE.Mesh(mergeGeometries(straws), new THREE.MeshStandardMaterial({ color: "#7d6638", roughness: 0.95 })));
				const band = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.15, 0.35, 12), new THREE.MeshStandardMaterial({ color: "#2a1f16", roughness: 1 }));
				band.position.y = 7.25;
				broom.add(band);
				return broom;
			}
			const broom = buildBroom();
			broom.position.set(2.65, groundY, -1.45); // against the back corner, out of the camera's way
			broom.rotation.set(-0.02, 0.3, 0.07);
			scene.add(shadowed(broom));

			// =====================================================================
			// Creatures
			// They come and go on their own timers, so there's usually one thing
			// moving out there, rarely all of them at once.
			// =====================================================================

			// --- Bats ------------------------------------------------------------

			const batMaterial = new THREE.MeshStandardMaterial({ color: "#151112", roughness: 0.9, side: THREE.DoubleSide });
			const wingShape = new THREE.Shape();
			[
				[0, 0.06],
				[0.35, 0.2],
				[0.7, 0.24],
				[1.0, 0.13],
				[0.86, -0.04],
				[0.76, -0.26],
				[0.56, -0.12],
				[0.43, -0.3],
				[0.26, -0.13],
				[0.1, -0.22],
				[0, -0.1],
			].forEach(([x, y], i) => (i ? wingShape.lineTo(x, y) : wingShape.moveTo(x, y)));
			const wingGeometry = new THREE.ShapeGeometry(wingShape).rotateX(-Math.PI / 2);

			function buildBat() {
				const bat = new THREE.Group();
				const body = new THREE.Mesh(new THREE.SphereGeometry(1, 10, 8).scale(0.1, 0.09, 0.2), batMaterial);
				const head = new THREE.Mesh(new THREE.SphereGeometry(0.075, 8, 6), batMaterial);
				head.position.z = 0.2;
				bat.add(body, head);
				for (const side of [-1, 1]) {
					const ear = new THREE.Mesh(new THREE.ConeGeometry(0.03, 0.09, 4), batMaterial);
					ear.position.set(side * 0.035, 0.08, 0.2);
					bat.add(ear);
				}
				const wings = [-1, 1].map((side) => {
					const pivot = new THREE.Group();
					pivot.position.x = side * 0.06;
					const wing = new THREE.Mesh(wingGeometry, batMaterial);
					wing.scale.x = side;
					pivot.add(wing);
					bat.add(pivot);
					return pivot;
				});
				bat.userData = { wings, phase: random(0, TAU), speed: random(14, 19) };
				bat.visible = false;
				scene.add(bat);
				return bat;
			}

			const flockBats = Array.from({ length: 14 }, buildBat);
			const treeBats = Array.from({ length: 2 }, buildBat);
			treeBats.forEach((bat) => (bat.visible = true));
			let flock = null;
			let nextFlock = random(6, 12);

			function flap(bat, t) {
				const angle = Math.sin(t * bat.userData.speed + bat.userData.phase) * 0.95;
				bat.userData.wings[0].rotation.z = -angle;
				bat.userData.wings[1].rotation.z = angle;
			}

			function startFlock() {
				const fromLeft = rand() < 0.5 ? -1 : 1;
				const path = new THREE.CatmullRomCurve3([
					new THREE.Vector3(fromLeft * 30, random(8, 14), random(-30, -15)),
					new THREE.Vector3(fromLeft * 8, random(4, 7), random(-8, -3)),
					new THREE.Vector3(random(-2, 2), random(2.5, 4.5), random(-1, 2)),
					new THREE.Vector3(-fromLeft * 10, random(5, 9), random(4, 10)),
					new THREE.Vector3(-fromLeft * 30, random(10, 16), random(10, 20)),
				]);
				const count = randInt(5, 14);
				flock = {
					path,
					time: 0,
					duration: random(6.5, 9),
					bats: flockBats.slice(0, count).map((bat) => ({ bat, offset: new THREE.Vector3(random(-2, 2), random(-1, 1.2), random(-2, 2)), lag: random(0, 0.12), wobble: random(0, TAU) })),
				};
			}

			// --- The witch, now and then, across the moon --------------------------

			function buildWitch() {
				const black = new THREE.MeshBasicMaterial({ color: "#040405" });
				const witch = new THREE.Group();
				const stick = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.08, 5, 6).rotateZ(Math.PI / 2), black);
				const bristles = new THREE.Mesh(new THREE.ConeGeometry(0.5, 1.5, 10, 1, true).rotateZ(Math.PI / 2), black);
				bristles.position.x = -3;
				const robe = new THREE.Mesh(new THREE.ConeGeometry(0.75, 1.9, 10), black);
				robe.position.set(0.1, 0.8, 0);
				robe.rotation.z = -0.35;
				const head = new THREE.Mesh(new THREE.SphereGeometry(0.28, 10, 8), black);
				head.position.set(0.55, 1.78, 0);
				const brim = new THREE.Mesh(new THREE.CylinderGeometry(0.62, 0.62, 0.04, 16), black);
				brim.position.set(0.5, 1.98, 0);
				const hat = new THREE.Mesh(new THREE.ConeGeometry(0.32, 1.2, 10), black);
				hat.position.set(0.3, 2.5, 0);
				hat.rotation.z = 0.55;
				const arm = new THREE.Mesh(new THREE.CapsuleGeometry(0.08, 0.7, 4, 6), black);
				arm.position.set(0.85, 1.05, 0.15);
				arm.rotation.z = -1.0;
				const cape = new THREE.Mesh(new THREE.PlaneGeometry(2, 1.3, 10, 4), new THREE.MeshBasicMaterial({ color: "#040405", side: THREE.DoubleSide }));
				cape.position.set(-1, 1.3, 0);
				witch.add(stick, bristles, robe, head, brim, hat, arm, cape);
				witch.userData = { cape, base: cape.geometry.attributes.position.array.slice() };
				witch.scale.setScalar(2.2);
				witch.visible = false;
				scene.add(witch);
				return witch;
			}
			const witch = buildWitch();
			let witchFlight = null;
			let nextWitch = random(14, 24);

			// --- The vulture on the big tree --------------------------------------

			function buildVulture() {
				const dark = new THREE.MeshStandardMaterial({ color: "#1a1512", roughness: 0.95 });
				const skin = new THREE.MeshStandardMaterial({ color: "#8a4e46", roughness: 0.7 });
				const vulture = new THREE.Group();
				const body = new THREE.Mesh(new THREE.SphereGeometry(1, 16, 12).scale(0.9, 1.1, 1.3), dark);
				body.position.y = 1.4;
				body.rotation.x = 0.5; // hunched
				const tail = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.12, 1.1), dark);
				tail.position.set(0, 0.6, -1.3);
				tail.rotation.x = 0.9;
				const wings = [-1, 1].map((side) => {
					const pivot = new THREE.Group();
					pivot.position.set(side * 0.55, 2.0, 0.2);
					const wing = new THREE.Mesh(new THREE.SphereGeometry(1, 12, 8).scale(0.3, 0.9, 1.7), dark);
					wing.position.set(side * 0.15, -0.45, -0.6);
					wing.rotation.x = 0.45;
					pivot.add(wing);
					return pivot;
				});
				const ruff = new THREE.Mesh(new THREE.TorusGeometry(0.36, 0.15, 8, 16), new THREE.MeshStandardMaterial({ color: "#58524d", roughness: 1 }));
				ruff.position.set(0, 2.3, 0.55);
				ruff.rotation.x = Math.PI / 2 - 0.4;
				const neckPivot = new THREE.Group();
				neckPivot.position.set(0, 2.3, 0.6);
				const neck = new THREE.Mesh(
					new THREE.TubeGeometry(new THREE.CatmullRomCurve3([new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, 0.35, 0.2), new THREE.Vector3(0, 0.45, 0.5)]), 8, 0.1, 6),
					skin,
				);
				const head = new THREE.Mesh(new THREE.SphereGeometry(0.22, 10, 8), skin);
				head.position.set(0, 0.5, 0.6);
				const beak = new THREE.Mesh(new THREE.ConeGeometry(0.07, 0.32, 6), new THREE.MeshStandardMaterial({ color: "#cdbb98", roughness: 0.5 }));
				beak.position.set(0, 0.42, 0.85);
				beak.rotation.x = Math.PI / 2 + 0.5;
				neckPivot.add(neck, head, beak);
				vulture.add(body, tail, ...wings, ruff, neckPivot);
				vulture.userData = { wings, neck: neckPivot, look: 0, nextLook: 2, spread: 0, nextSpread: random(20, 35) };
				return vulture;
			}
			const vulture = buildVulture();
			vulture.scale.setScalar(1.5);
			vulture.position.copy(bigTree).add(perch.from.clone().lerp(perch.to, 0.7)).add(new THREE.Vector3(0, 0.75, 0));
			vulture.rotation.y = Math.atan2(-vulture.position.x, 5 - vulture.position.z) * 0.6;
			scene.add(vulture);

			// --- Spiders: they roam the table, and some go in and out of the face --

			const spiderMaterial = new THREE.MeshStandardMaterial({ color: "#17110d", roughness: 0.5 });

			// A thin cylinder from a to b.
			function segment(a, b, radius, material) {
				const length = a.distanceTo(b);
				const mesh = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius * 0.7, length, 5), material);
				mesh.position.copy(a).lerp(b, 0.5);
				mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), b.clone().sub(a).normalize());
				return mesh;
			}

			function buildSpider() {
				const spider = new THREE.Group();
				const abdomen = new THREE.Mesh(new THREE.SphereGeometry(1, 14, 10).scale(0.055, 0.045, 0.07), spiderMaterial);
				abdomen.position.set(0, 0.055, -0.075);
				const head = new THREE.Mesh(new THREE.SphereGeometry(1, 12, 8).scale(0.038, 0.03, 0.045), spiderMaterial);
				head.position.set(0, 0.048, 0.02);
				spider.add(abdomen, head);
				const legs = [];
				[0.6, 1.2, 1.9, 2.5].forEach((angle, i) => {
					for (const side of [-1, 1]) {
						const hip = new THREE.Group();
						hip.position.set(side * 0.022, 0.048, 0.03 - i * 0.02);
						const out = new THREE.Vector3(side * Math.sin(angle), 0, Math.cos(angle));
						const knee = out.clone().multiplyScalar(0.075).setY(0.05);
						const foot = out.clone().multiplyScalar(0.15).setY(-0.048);
						hip.add(segment(new THREE.Vector3(), knee, 0.006, spiderMaterial), segment(knee, foot, 0.005, spiderMaterial));
						spider.add(hip);
						legs.push({ hip, group: (i + (side > 0 ? 1 : 0)) % 2 });
					}
				});
				spider.userData.legs = legs;
				scene.add(shadowed(spider));
				return spider;
			}

			// Where holes start and end on the surface: the mouth is the lowest hole.
			const holeBottoms = holes.map((hole) => hole.reduce((best, p) => (p[1] > best[1] ? p : best)));
			const mouthIndex = holeBottoms.reduce((best, p, i) => (p[1] > holeBottoms[best][1] ? i : best), 0);
			const mouthSpan = [Math.min(...holes[mouthIndex].map((p) => p[0])), Math.max(...holes[mouthIndex].map((p) => p[0]))];
			const BASE_V = 0.9;

			const spiderZones = [
				[-1.75, 1.75, 1.0, 1.4],
				[1.2, 1.9, -0.1, 1.3],
				[-1.9, -1.15, -0.1, 0.1],
			];
			function tablePoint() {
				const [x0, x1, z0, z1] = spiderZones[randInt(0, spiderZones.length - 1)];
				return new THREE.Vector3(random(x0, x1), 0.005, random(z0, z1));
			}

			const _up = new THREE.Vector3();
			const _forward = new THREE.Vector3();
			const _right = new THREE.Vector3();
			const _basis = new THREE.Matrix4();
			const _surface = new THREE.Vector3();
			const _normal = new THREE.Vector3();

			// Point and outward normal on the pumpkin's skin, in world space.
			function onPumpkin(u, v) {
				surfacePoint(u, v, _surface);
				surfaceNormal(u, v, _normal);
				pumpkin.localToWorld(_surface);
				_normal.transformDirection(pumpkin.matrixWorld);
			}

			function faceAlong(object, up, forward) {
				_up.copy(up).normalize();
				_forward.copy(forward).addScaledVector(_up, -_forward.dot(_up)).normalize();
				_right.crossVectors(_up, _forward);
				object.quaternion.setFromRotationMatrix(_basis.makeBasis(_right, _up, _forward));
			}

			const spiders = [0, 1, 2].map((i) => ({
				object: buildSpider(),
				mode: i === 0 ? "inside" : "walk",
				timer: i === 0 ? random(3, 7) : 0,
				target: tablePoint(),
				path: null, // surface waypoints in (u, v)
				leg: 0,
				gait: random(0, TAU),
			}));
			spiders.forEach((spider) => {
				spider.object.position.copy(tablePoint());
				spider.object.visible = spider.mode !== "inside";
			});
			let spiderInPumpkin = false;

			// Move along a list of (u, v) waypoints on the skin at a steady pace.
			function crawlSurface(spider, dt) {
				const [[u0, v0], [u1, v1]] = spider.path;
				const s = Math.sin(Math.PI * v0);
				const length = Math.hypot((u1 - u0) * TAU * W * s, (v1 - v0) * Math.PI * H) || 1e-6;
				spider.leg = Math.min(1, spider.leg + (0.16 * dt) / length);
				const u = u0 + (u1 - u0) * spider.leg;
				const v = v0 + (v1 - v0) * spider.leg;
				onPumpkin(u, v);
				spider.object.position.copy(_surface);
				onPumpkin(u0 + (u1 - u0) * Math.min(1, spider.leg + 0.02), v0 + (v1 - v0) * Math.min(1, spider.leg + 0.02));
				const ahead = _surface.clone().sub(spider.object.position);
				onPumpkin(u, v);
				if (ahead.lengthSq() > 1e-10) faceAlong(spider.object, _normal, ahead);
				if (spider.leg >= 1) {
					spider.path.shift();
					spider.leg = 0;
				}
				return spider.path.length < 2;
			}

			function updateSpiders(dt) {
				for (const spider of spiders) {
					const object = spider.object;
					let moving = false;
					if (spider.mode === "walk" || spider.mode === "toPumpkin") {
						const to = spider.target.clone().sub(object.position).setY(0);
						const distance = to.length();
						if (spider.timer > 0) {
							spider.timer -= dt;
						} else if (distance > 0.02) {
							object.position.addScaledVector(to.normalize(), Math.min(distance, 0.2 * dt));
							object.position.y = 0.005;
							faceAlong(object, new THREE.Vector3(0, 1, 0), to);
							moving = true;
						} else if (spider.mode === "toPumpkin") {
							const [u, v] = holeBottoms[mouthIndex];
							spider.path = [
								[u, BASE_V],
								[u, v + 0.012],
							];
							spider.mode = "climbIn";
						} else if (!spiderInPumpkin && rand() < 0.35) {
							spiderInPumpkin = true;
							spider.mode = "toPumpkin";
							onPumpkin(holeBottoms[mouthIndex][0], BASE_V);
							spider.target.set(_surface.x, 0.005, _surface.z);
						} else {
							spider.target = tablePoint();
							spider.timer = random(0.5, 3.5); // stop, then dart off
						}
					} else if (spider.mode === "climbIn" || spider.mode === "climbOut") {
						moving = true;
						if (crawlSurface(spider, dt)) {
							if (spider.mode === "climbIn") {
								spider.mode = "inside";
								spider.object.visible = false;
								spider.timer = random(6, 14);
								spiderInPumpkin = false;
							} else {
								spider.mode = "walk";
								spider.target = tablePoint();
								spider.object.position.y = 0.005;
							}
						}
					} else if (spider.mode === "inside") {
						spider.timer -= dt;
						if (spider.timer <= 0) {
							// Out through an eye (or whatever isn't the mouth), sideways
							// past the mouth, then down to the table.
							const exits = holeBottoms.filter((_, i) => i !== mouthIndex);
							const [u, v] = exits[randInt(0, exits.length - 1)];
							const side = u < 0.5 ? mouthSpan[0] - 0.02 : mouthSpan[1] + 0.02;
							spider.path = [
								[u, v + 0.012],
								[side, v + 0.012],
								[side, BASE_V],
							];
							spider.mode = "climbOut";
							spider.object.visible = true;
						}
					}
					// Legs: two alternating sets, swinging as it moves.
					if (moving) spider.gait += dt * 22;
					for (const { hip, group } of object.userData.legs) {
						hip.rotation.y = moving ? 0.28 * Math.sin(spider.gait + group * Math.PI) : 0;
						hip.position.y = 0.048 + (moving ? 0.012 * Math.max(0, Math.sin(spider.gait + group * Math.PI)) : 0);
					}
				}
			}

			// --- The black cat, prowling between the far gravestones --------------

			function buildCat() {
				const fur = new THREE.MeshStandardMaterial({ color: "#09090b", roughness: 0.85 });
				const cat = new THREE.Group();
				const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.4, 1.3, 6, 12), fur);
				body.rotation.x = Math.PI / 2;
				body.position.y = 1.3;
				body.scale.set(1, 1, 0.9);
				const head = new THREE.Group();
				head.position.set(0, 1.75, 1.2);
				head.add(new THREE.Mesh(new THREE.SphereGeometry(0.36, 14, 10).scale(1, 0.9, 1), fur));
				const muzzle = new THREE.Mesh(new THREE.SphereGeometry(0.16, 10, 8), fur);
				muzzle.position.set(0, -0.1, 0.3);
				head.add(muzzle);
				for (const side of [-1, 1]) {
					const ear = new THREE.Mesh(new THREE.ConeGeometry(0.13, 0.32, 4), fur);
					ear.position.set(side * 0.2, 0.33, -0.02);
					ear.rotation.z = -side * 0.25;
					const eye = new THREE.Mesh(new THREE.SphereGeometry(0.055, 8, 6), new THREE.MeshBasicMaterial({ color: "#c9f25a" }));
					eye.position.set(side * 0.13, 0.04, 0.31);
					head.add(ear, eye);
				}
				const legs = [
					[0.22, 0.75],
					[-0.22, 0.75],
					[0.22, -0.65],
					[-0.22, -0.65],
				].map(([x, z], i) => {
					const hip = new THREE.Group();
					hip.position.set(x, 1.15, z);
					const leg = new THREE.Mesh(new THREE.CapsuleGeometry(0.1, 0.85, 4, 8), fur);
					leg.position.y = -0.55;
					hip.add(leg);
					cat.add(hip);
					return { hip, phase: i === 0 || i === 3 ? 0 : Math.PI };
				});
				const tail = Array.from({ length: 9 }, (_, i) => {
					const piece = new THREE.Mesh(new THREE.SphereGeometry(0.1 - i * 0.006, 8, 6), fur);
					cat.add(piece);
					return piece;
				});
				cat.add(body, head);
				cat.userData = { head, legs, tail };
				return cat;
			}

			const cat = buildCat();
			scene.add(cat);
			const catRoute = [
				[-15, -24],
				[-8, -23],
				[-2, -25.5],
				[5, -24],
				[11, -26],
				[16, -21],
				[9, -30],
				[0, -31],
				[-10, -29],
			].map(([x, z]) => new THREE.Vector3(x, groundY, z));
			const catState = { leg: 0, from: 0, pause: 2, gait: 0 };
			cat.position.copy(catRoute[0]);

			function updateCat(dt, t) {
				const { head, legs, tail } = cat.userData;
				let walking = false;
				if (catState.pause > 0) {
					catState.pause -= dt;
				} else {
					const from = catRoute[catState.from];
					const to = catRoute[(catState.from + 1) % catRoute.length];
					const length = from.distanceTo(to);
					catState.leg += (1.6 * dt) / length;
					cat.position.lerpVectors(from, to, Math.min(1, catState.leg));
					cat.rotation.y = Math.atan2(to.x - from.x, to.z - from.z);
					walking = true;
					if (catState.leg >= 1) {
						catState.leg = 0;
						catState.from = (catState.from + 1) % catRoute.length;
						if (rand() < 0.45) catState.pause = random(3, 7); // stop and stare
					}
				}
				if (walking) catState.gait += dt * 7;
				for (const { hip, phase } of legs) hip.rotation.x = walking ? 0.45 * Math.sin(catState.gait + phase) : 0;
				// When it stops, it turns its head to look at you.
				const toCamera = wrapAngle(Math.atan2(camera.position.x - cat.position.x, camera.position.z - cat.position.z) - cat.rotation.y);
				head.rotation.y += ((walking ? 0 : clamp(toCamera, -1.3, 1.3)) - head.rotation.y) * Math.min(1, dt * 2);
				tail.forEach((piece, i) => {
					const k = i / (tail.length - 1);
					piece.position.set(Math.sin(t * 1.7 + k * 2.5) * 0.35 * k, 1.45 + Math.sin(k * 1.8) * 1.3, -1.05 - Math.cos(k * 1.4) * 0.55 * k - 0.15);
				});
			}

			// --- Everything out there, per frame ----------------------------------

			function updateSurroundings(dt, t) {
				envTime.value = t;

				// Cauldron: bubbles rise, swell and pop; green vapor drifts up; a click
				// makes it surge.
				cauldronSurge = Math.max(0, cauldronSurge - dt);
				const surge = Math.min(1, cauldronSurge);
				potionMaterial.uniforms.uSurge.value = surge;
				cauldronLight.intensity = CAULDRON_INTENSITY * (0.85 + 0.1 * Math.sin(t * 2.3) + 0.05 * Math.sin(t * 5.1) + 0.8 * surge);
				for (const bubble of bubbles) {
					bubble.age += dt * (0.5 + 1.5 * surge);
					if (bubble.age >= 1) {
						bubble.age = 0;
						const a = random(0, TAU);
						const r = Math.sqrt(rand()) * 1.0;
						bubble.x = Math.cos(a) * r;
						bubble.z = Math.sin(a) * r;
					}
					const grow = Math.sin(Math.PI * bubble.age);
					bubble.mesh.position.set(bubble.x, 1.95, bubble.z);
					bubble.mesh.scale.set(bubble.size * grow, bubble.size * grow * 0.7, bubble.size * grow);
				}
				for (const vapor of vapors) {
					vapor.age = (vapor.age + dt * (0.15 + 0.2 * surge)) % 1;
					vapor.sprite.position.set(Math.sin(vapor.age * 5 + vapor.sprite.id) * 0.4, 2.1 + vapor.age * 3.5, Math.cos(vapor.age * 4 + vapor.sprite.id) * 0.4);
					vapor.sprite.scale.setScalar(1 + vapor.age * 3);
					vapor.sprite.material.opacity = (0.16 + 0.15 * surge) * Math.sin(Math.PI * vapor.age);
				}

				// A flock of bats now and then; two more always circling the big tree.
				nextFlock -= dt;
				if (!flock && nextFlock <= 0) startFlock();
				if (flock) {
					flock.time += dt;
					for (const { bat, offset, lag, wobble } of flock.bats) {
						const k = clamp(flock.time / flock.duration - lag, 0, 1);
						bat.visible = k > 0 && k < 1;
						flock.path.getPointAt(k, bat.position).add(offset).add(new THREE.Vector3(0, Math.sin(t * 6 + wobble) * 0.3, Math.cos(t * 5 + wobble) * 0.3));
						bat.lookAt(flock.path.getPointAt(Math.min(1, k + 0.01), _v).add(offset));
						flap(bat, t);
					}
					if (flock.time > flock.duration * 1.2) {
						flock.bats.forEach(({ bat }) => (bat.visible = false));
						flock = null;
						nextFlock = random(15, 32);
					}
				}
				treeBats.forEach((bat, i) => {
					const a = t * (0.5 + i * 0.17) + i * 2;
					const radius = 7 + 2 * Math.sin(t * 0.7 + i);
					bat.position.set(bigTree.x + Math.cos(a) * radius, groundY + 14 + 3 * Math.sin(t * 1.3 + i * 3), bigTree.z + Math.sin(a) * radius);
					bat.lookAt(bigTree.x + Math.cos(a + 0.1) * radius, bat.position.y, bigTree.z + Math.sin(a + 0.1) * radius);
					flap(bat, t);
				});

				// The witch: across the face of the moon every minute or so.
				nextWitch -= dt;
				if (!witchFlight && nextWitch <= 0) {
					witchFlight = { time: 0, duration: random(11, 15), rise: random(0.02, 0.07), height: random(0.04, 0.1) };
					witch.visible = true;
				}
				if (witchFlight) {
					witchFlight.time += dt;
					const k = witchFlight.time / witchFlight.duration;
					const azimuth = THREE.MathUtils.lerp(0.75, -1.25, k);
					const direction = new THREE.Vector3(Math.sin(azimuth), witchFlight.height + witchFlight.rise * k + 0.01 * Math.sin(t * 2.2), -Math.cos(azimuth)).normalize();
					witch.position.copy(direction).multiplyScalar(140);
					witch.rotation.set(0.05 * Math.sin(t * 1.7), azimuth + Math.PI / 2 + Math.PI, 0.05 * Math.sin(t * 2.3));
					const { cape, base } = witch.userData;
					const position = cape.geometry.attributes.position;
					for (let i = 0; i < position.count; i++) {
						const x = base[i * 3];
						position.setZ(i, Math.sin(t * 9 + x * 3) * 0.18 * (1 - x));
					}
					position.needsUpdate = true;
					if (k >= 1) {
						witch.visible = false;
						witchFlight = null;
						nextWitch = random(40, 75);
					}
				}

				// The vulture: looks around, and now and then half-opens its wings.
				const vultureState = vulture.userData;
				vultureState.nextLook -= dt;
				if (vultureState.nextLook <= 0) {
					vultureState.look = random(-1.1, 1.1);
					vultureState.nextLook = random(2, 7);
				}
				vultureState.neck.rotation.y += (vultureState.look - vultureState.neck.rotation.y) * Math.min(1, dt * 3);
				vultureState.nextSpread -= dt;
				if (vultureState.nextSpread <= 0) {
					vultureState.spread = 3;
					vultureState.nextSpread = random(25, 45);
				}
				vultureState.spread = Math.max(0, vultureState.spread - dt);
				const open = Math.sin((Math.PI * vultureState.spread) / 3) * 0.9;
				vultureState.wings[0].rotation.z = open;
				vultureState.wings[1].rotation.z = -open;

				updateSpiders(dt);
				updateCat(dt, t);
			}

			// =====================================================================
			// Night lighting
			// =====================================================================

			scene.add(new THREE.HemisphereLight("#4f5672", "#1a120c", 1.5));

			const moon = new THREE.DirectionalLight("#c3ccef", 1.5);
			moon.position.set(-3.6, 7.5, -10); // same side as the moon in the sky, but higher
			moon.castShadow = true;
			moon.shadow.mapSize.set(2048, 2048);
			Object.assign(moon.shadow.camera, { left: -4, right: 4, top: 4, bottom: -4, near: 0.5, far: 25 });
			moon.shadow.bias = -0.0005;
			moon.shadow.normalBias = 0.02;
			scene.add(moon);

			// =====================================================================
			// Camera
			// Front-facing only. When left alone, the camera drifts slowly from
			// side to side and turns back well before it gets around the pumpkin.
			// =====================================================================

			const SWING = 1.1; // how far you can orbit to either side (radians)
			const SWEEP = 0.33; // how far the idle drift goes
			controls.minAzimuthAngle = turn - SWING;
			controls.maxAzimuthAngle = turn + SWING;
			controls.target.copy(pumpkinCenter).y *= 0.95;
			camera.position.set(Math.sin(turn) * 5 + 0.3, 1.5, Math.cos(turn) * 5);

			const sweep = { idle: 0, velocity: 0, direction: 1, dragging: false };
			controls.addEventListener("start", () => {
				sweep.dragging = true;
				sweep.velocity = 0;
			});
			controls.addEventListener("end", () => {
				sweep.dragging = false;
				sweep.idle = 0;
			});

			const _offset = new THREE.Vector3();
			const _spherical = new THREE.Spherical();
			function updateSweep(dt) {
				if (sweep.dragging || press) return;
				sweep.idle += dt;
				_offset.subVectors(camera.position, controls.target);
				// Wait a moment after the user lets go, and stay still up close.
				if (sweep.idle < 3 || _offset.length() < 2.2) return;
				_spherical.setFromVector3(_offset);
				const angle = wrapAngle(_spherical.theta - turn);
				if (angle > SWEEP) sweep.direction = -1;
				if (angle < -SWEEP) sweep.direction = 1;
				sweep.velocity += (sweep.direction * 0.09 - sweep.velocity) * Math.min(1, dt * 0.6);
				_spherical.theta += sweep.velocity * dt;
				camera.position.copy(controls.target).add(_offset.setFromSpherical(_spherical));
			}

			// =====================================================================
			// Hint
			// =====================================================================

			const hint = document.createElement("div");
			hint.textContent = "drag to look around · scroll or pinch to move in · drag things on the table · click or tap a flame";
			Object.assign(hint.style, {
				position: "fixed",
				bottom: "14px",
				left: "0",
				right: "0",
				textAlign: "center",
				pointerEvents: "none",
				color: "#c9b9a0",
				font: "13px system-ui, sans-serif",
				opacity: "0.6",
				transition: "opacity 2s",
			});
			document.body.appendChild(hint);
			setTimeout(() => (hint.style.opacity = "0"), 7000);

			// =====================================================================
			// Animation
			// =====================================================================

			// Flicker: a slow random walk, two quick wobbles, and the odd gust that
			// dips the light and bends the flame. Kept within ~15%.
			let flicker = 1;
			let flickerTarget = 1;
			let gust = 0;
			let gustSide = 1;
			let lit = 1; // eases between 0 and 1 when the candle goes out
			let ember = 1; // the wick keeps glowing a moment after the flame goes

			const clock = new THREE.Clock();
			const flameWorld = new THREE.Vector3();

			function animate() {
				const dt = Math.min(clock.getDelta(), 0.05);
				const t = clock.elapsedTime;

				if (Math.random() < dt * 0.25) {
					gust = 0.08 + Math.random() * 0.1;
					gustSide = Math.random() < 0.5 ? -1 : 1;
				}
				gust *= Math.exp(-dt * 3);
				flickerTarget += (Math.random() - 0.5) * dt * 2 + (1 - flickerTarget) * dt * 1.5;
				flicker += (flickerTarget - flicker) * Math.min(1, dt * 12);
				const on = settings.candleLit ? 1 : 0;
				lit += (on - lit) * Math.min(1, dt * 6);
				ember += (on - ember) * Math.min(1, dt * 1.2);

				const level = flicker * (1 - gust) * (1 + 0.03 * Math.sin(t * 9.1) + 0.02 * Math.sin(t * 15.7 + 1.3)) * lit;
				const sway = 0.15 * Math.sin(t * 1.3) * Math.sin(t * 0.7 + 1) + gust * gustSide * 2.5;
				candleLight.intensity = CANDLE_INTENSITY * level;
				bounceLight.intensity = BOUNCE_INTENSITY * level;
				candleLight.position.set(lightHome.x + sway * 0.008, lightHome.y, lightHome.z + sway * 0.005);
				waxMaterial.emissiveIntensity = 0.25 * level;
				cutMaterial.emissiveIntensity = 0.45 * level;
				emberMaterial.emissiveIntensity = 3 * ember;
				flameMaterial.uniforms.uTime.value = t;
				flameMaterial.uniforms.uSway.value = sway;
				flame.visible = glow.visible = lit > 0.01;
				flame.scale.set(lit, (0.85 + 0.25 * level) * lit, lit);
				glow.material.opacity = 0.5 * level;

				// Turn the flame to face the camera, staying upright.
				flame.getWorldPosition(flameWorld);
				flame.rotation.y = Math.atan2(camera.position.x - flameWorld.x, camera.position.z - flameWorld.z) - pumpkin.rotation.y;

				stepPhysics(dt);
				updateProps(dt, t);
				updateSurroundings(dt, t);
				updateSweep(dt);
				controls.update();

				// Cutaway follows the camera; wireframes only draw when it's close.
				cutaway.center.value.copy(camera.position);
				const near = camera.position.distanceTo(pumpkinCenter) < pumpkinReach;
				wires.forEach((wire) => (wire.visible = near));
				// Keep the near plane tight inside the pumpkin, looser outside.
				camera.near = clamp(camera.position.distanceTo(controls.target) * 0.02, 0.004, 0.05);
				camera.updateProjectionMatrix();

				starMaterial.uniforms.uTime.value = t;
				renderer.render(scene, camera);
			}

			// =====================================================================
			// Resize
			// =====================================================================

			function resize() {
				const { clientWidth: width, clientHeight: height } = renderer.domElement;
				const aspect = width / height;
				camera.aspect = aspect;
				// On tall screens, widen the vertical view so the pumpkin still fits.
				camera.fov = aspect < 1 ? Math.min(75, THREE.MathUtils.radToDeg(2 * Math.atan(Math.tan(THREE.MathUtils.degToRad(19)) / aspect))) : 38;
				camera.updateProjectionMatrix();
				renderer.setSize(width, height, false);
				// Smoke particles size themselves in world units.
				pointScale.value = (height * renderer.getPixelRatio()) / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)));
			}

			addEventListener("resize", resize);
			resize();
			renderer.setAnimationLoop(animate);
		</script>
	</body>
</html>
