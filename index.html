			}

			// =====================================================================
			// Surroundings
			// Fog, a churchyard of crooked trees and leaning stones, a huge low moon
			// and a cauldron bubbling in the mist. All of it is seen through fog, so
			// it's built for silhouette more than close-up detail.
			// =====================================================================

			rand = mulberry32(1337);
			const envTime = { value: 0 };
			scene.fog = new THREE.FogExp2("#1d1a2c", 0.026);

			// Fog sheets: wide horizontal layers of drifting noise, thick near the
			// ground and kept clear right around the table.
			function fogTexture() {
				const octave = (period) => {
					const lattice = Float32Array.from({ length: period * period }, rand);
					const at = (x, y) => lattice[(((y % period) + period) % period) * period + (((x % period) + period) % period)];
					return (u, v) => {
						const x = u * period;
						const y = v * period;
						const xi = Math.floor(x);
						const yi = Math.floor(y);
						const sx = smoothstep(0, 1, x - xi);
						const sy = smoothstep(0, 1, y - yi);
						const top = at(xi, yi) + (at(xi + 1, yi) - at(xi, yi)) * sx;
						const bottom = at(xi, yi + 1) + (at(xi + 1, yi + 1) - at(xi, yi + 1)) * sx;
						return top + (bottom - top) * sy;
					};
				};
				const octaves = [octave(4), octave(8), octave(16)];
				const [[canvas]] = paintCanvases(256, 256, 1, (x, y, out) => {
					const u = x / 256;
					const v = y / 256;
					const n = 0.55 * octaves[0](u, v) + 0.3 * octaves[1](u, v) + 0.15 * octaves[2](u, v);
					out[0][0] = out[0][1] = out[0][2] = 255 * smoothstep(0.3, 0.8, n);
				});
				const texture = dataTexture(canvas);
				texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
				return texture;
			}

			const fogMap = fogTexture();
			function fogSheet(y, opacity, clearRadius) {
				const sheet = new THREE.Mesh(
					new THREE.PlaneGeometry(240, 240).rotateX(-Math.PI / 2),
					new THREE.ShaderMaterial({
						uniforms: { uMap: { value: fogMap }, uTime: envTime, uOpacity: { value: opacity }, uClear: { value: clearRadius }, uSeed: { value: random(0, 10) } },
						transparent: true,
						depthWrite: false,
						vertexShader: `
							varying vec3 vWorld;
							void main() {
								vec4 world = modelMatrix * vec4(position, 1.0);
								vWorld = world.xyz;
								gl_Position = projectionMatrix * viewMatrix * world;
							}
						`,
						fragmentShader: `
							uniform sampler2D uMap;
							uniform float uTime;
							uniform float uOpacity;
							uniform float uClear;
							uniform float uSeed;
							varying vec3 vWorld;
							void main() {
								vec2 p = vWorld.xz;
								float a = texture2D(uMap, p * 0.03 + vec2(uTime * 0.004 + uSeed, uTime * 0.002)).r;
								float b = texture2D(uMap, p * 0.08 - vec2(uTime * 0.006, uSeed - uTime * 0.003)).r;
								float d = length(p);
								float fade = smoothstep(uClear, uClear + 5.0, d) * (1.0 - smoothstep(70.0, 115.0, d));
								gl_FragColor = vec4(0.12, 0.11, 0.2, a * (0.55 + 0.6 * b) * uOpacity * fade);
							}
						`,
					}),
				);
				sheet.position.y = y;
				sheet.renderOrder = 2;
				scene.add(sheet);
			}
			for (const [height, opacity] of [
				[0.15, 0.45],
				[0.45, 0.4],
				[0.85, 0.34],
				[1.4, 0.28],
				[2.1, 0.22],
				[3.0, 0.16],
			]) {
				fogSheet(groundY + height, opacity, 0);
			}
			for (const y of [-1.4, -0.5, 0.5, 1.6]) fogSheet(y, 0.16, 7);

			// --- Bare, crooked trees whose thin branches curl at the tips --------

			const barkMaterial = new THREE.MeshStandardMaterial({ color: "#1e1915", roughness: 1 });

			// `hangs` collects points under the smaller branches where a bat could roost.
			function buildTree(height, crooked, perch, hangs) {
				const parts = [];
				const grow = (start, direction, length, radius, depth) => {
					const points = [start.clone()];
					const d = direction.clone();
					const curlAxis = new THREE.Vector3(random(-1, 1), random(-0.3, 0.3), random(-1, 1)).normalize();
					const curl = depth >= 2 ? random(0.3, 0.7) * (rand() < 0.5 ? -1 : 1) : 0;
					let p = start.clone();
					for (let i = 1; i <= 6; i++) {
						d.add(new THREE.Vector3(random(-1, 1), random(-0.4, 0.6), random(-1, 1)).multiplyScalar(crooked)).normalize();
						if (curl) d.applyAxisAngle(curlAxis, curl * (i / 6) * 1.5); // tips curl round on themselves
						p = p.clone().addScaledVector(d, length / 6);
						points.push(p);
					}
					parts.push(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(points), 18, radius, 7, false));
					if (depth >= 2 && Math.abs(d.y) < 0.75) hangs.push(points[3].clone().setY(points[3].y - radius), points[5].clone().setY(points[5].y - radius));
					if (depth >= 4 || radius < 0.05) return;
					for (let c = 0, count = depth === 0 ? randInt(3, 4) : randInt(2, 3); c < count; c++) {
						const at = points[randInt(2, 6)];
						const branch = d.clone().add(new THREE.Vector3(random(-1.3, 1.3), random(-0.2, 0.7), random(-1.3, 1.3))).normalize();
						grow(at, branch, length * random(0.5, 0.75), radius * random(0.45, 0.62), depth + 1);
					}
				};
				grow(new THREE.Vector3(0, -0.5, 0), new THREE.Vector3(random(-0.15, 0.15), 1, random(-0.15, 0.15)).normalize(), height * 0.45, height * 0.032, 0);
				for (let r = 0; r < 5; r++) {
					const a = (r / 5) * TAU + random(-0.3, 0.3);
					const out = new THREE.Vector3(Math.cos(a), 0, Math.sin(a));
					const root = [new THREE.Vector3(0, height * 0.05, 0), out.clone().multiplyScalar(height * 0.04).setY(height * 0.01), out.clone().multiplyScalar(height * 0.08).setY(-0.4)];
					parts.push(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(root), 10, height * 0.014, 6, false));
				}
				if (perch) {
					const points = [perch.from, perch.from.clone().lerp(perch.to, 0.5).add(new THREE.Vector3(0, 0.6, 0)), perch.to];
					parts.push(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(points), 16, 0.35, 7, false));
				}
				return mergeGeometries(parts);
			}

			// The big gnarled tree stands in front of the moon, with a bare branch
			// for the vulture.
			const perch = { from: new THREE.Vector3(0, 13, 0), to: new THREE.Vector3(8, 15.5, 2) };
			const trees = [
				[-11, -34, 46, 0.35, perch],
				[13, -29, 38, 0.3],
				[-25, -19, 34, 0.32],
				[24, -42, 44, 0.28],
				[-3, -56, 52, 0.3],
				[8, -72, 46, 0.3],
				[-33, -48, 40, 0.3],
				[30, -16, 30, 0.34],
			];
			const bigTree = new THREE.Vector3(trees[0][0], groundY, trees[0][1]);
			const roostPoints = [];
			for (const [x, z, height, crooked, branch] of trees) {
				const hangs = [];
				const tree = new THREE.Mesh(buildTree(height, crooked, branch, hangs), barkMaterial);
				tree.position.set(x, groundY, z);
				scene.add(tree);
				// Only branches low enough to see under the fog and treetops.
				for (const point of hangs) if (point.y > 5 && point.y < 17 && z > -45) roostPoints.push(point.add(tree.position));
			}

			// --- Gravestones ------------------------------------------------------

			function stoneTextures() {
				const [[colorCanvas], [bumpCanvas]] = paintCanvases(512, 512, 2, (x, y, out) => {
					const n = woodNoise(x * 0.02 + 5000, y * 0.02) * 0.5 + woodNoise(x * 0.08 + 5100, y * 0.08) * 0.3 + woodNoise(x * 0.4 + 5200, y * 0.4) * 0.2;
					const moss = smoothstep(0.55, 0.75, woodNoise(x * 0.015 + 5300, y * 0.015)) * smoothstep(150, 512, y);
					const lichen = smoothstep(0.78, 0.86, woodNoise(x * 0.06 + 5400, y * 0.06));
					out[0][0] = 70 + 50 * n - 30 * moss + 60 * lichen;
					out[0][1] = 72 + 48 * n - 5 * moss + 55 * lichen;
					out[0][2] = 70 + 42 * n - 35 * moss + 35 * lichen;
					out[1][0] = out[1][1] = out[1][2] = 255 * n;
				});
				const map = colorTexture(colorCanvas);
				const bumpMap = dataTexture(bumpCanvas);
				for (const texture of [map, bumpMap]) {
					texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
					texture.repeat.set(0.25, 0.25);
				}
				return new THREE.MeshStandardMaterial({ map, bumpMap, bumpScale: 3, roughness: 0.95 });
			}
			const stoneMaterial = stoneTextures();

			function buildGravestone(kind) {
				const width = random(2.6, 3.6);
				const height = random(4.2, 6.2);
				const depth = random(0.5, 0.7);
				const shape = new THREE.Shape();
				shape.moveTo(-width / 2, 0);
				if (kind === 0) {
					shape.lineTo(-width / 2, height - width / 2);
					shape.absarc(0, height - width / 2, width / 2, Math.PI, 0, true);
				} else {
					shape.lineTo(-width / 2, height - width * 0.6);
					shape.quadraticCurveTo(-width / 2, height - width * 0.15, 0, height);
					shape.quadraticCurveTo(width / 2, height - width * 0.15, width / 2, height - width * 0.6);
				}
				shape.lineTo(width / 2, 0);
				shape.closePath();
				const geometry = new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled: true, bevelThickness: 0.08, bevelSize: 0.08, bevelSegments: 2, curveSegments: 20 });
				geometry.translate(0, 0, -depth / 2);
				// Weathered: chipped, uneven edges.
				const offset = random(0, 100);
				return displace(geometry, (x, y, z) => {
					const k = 1 + 0.04 * (woodNoise(x * 1.5 + offset, y * 1.5) - 0.5);
					return [x * k, y + 0.12 * (woodNoise(x * 2 + offset, z * 3) - 0.5) * smoothstep(height * 0.7, height, y), z * k];
				});
			}

			function buildCross() {
				const parts = [new THREE.BoxGeometry(0.7, 6, 0.6).translate(0, 3, 0), new THREE.BoxGeometry(3, 0.7, 0.6).translate(0, 4.2, 0)];
				return mergeGeometries(parts.map((part) => part.toNonIndexed()));
			}

			for (const [x, z] of [
				[-9, -10],
				[-13, -17],
				[-6, -25],
				[-1.5, -28],
				[4.5, -26],
				[10, -23],
				[14, -13],
				[11, -9],
				[-16, -29],
				[18, -31],
				[-4, -38],
				[8, -39],
				[27, -13], // by the tree on the right, so that side isn't empty
				[22, -24],
			]) {
				const stone = new THREE.Mesh(rand() < 0.18 ? buildCross() : buildGravestone(rand() < 0.6 ? 0 : 1), stoneMaterial);
				stone.position.set(x, groundY - random(0.2, 0.6), z);
				stone.rotation.set(random(-0.14, 0.14), Math.atan2(-x, 5 - z) + random(-0.4, 0.4), random(-0.12, 0.12));
				stone.castShadow = true;
				stone.receiveShadow = true;
				scene.add(stone);
			}

			// --- The moon: huge, low, and a little too detailed --------------------

			function moonTexture() {
				const w = 2048;
				const h = 1024;
				// The near side faces +z, which is u = 0.25. Its dark plains are
				// arranged, faintly, like a face.
				const plain = (u, v, cu, cv, ru, rv) => Math.exp(-(((u - cu) / ru) ** 2 + ((v - cv) / rv) ** 2));
				const [[canvas, ctx]] = paintCanvases(w, h, 1, (x, y, out) => {
					const u = x / w;
					const v = y / h;
					const n = woodNoise(u * 14 + 7000, v * 7, 14) * 0.5 + woodNoise(u * 48 + 7100, v * 24, 48) * 0.3 + woodNoise(u * 180 + 7200, v * 90, 180) * 0.2;
					const maria = Math.max(
						plain(u, v, 0.215, 0.41, 0.03, 0.065),
						plain(u, v, 0.29, 0.4, 0.034, 0.07),
						plain(u, v, 0.255, 0.6, 0.075, 0.035) * 0.9,
						smoothstep(0.58, 0.75, woodNoise(u * 6 + 7300, v * 3, 6)) * 0.8,
					);
					const g = 196 + 50 * (n - 0.5) - 92 * maria * (0.7 + 0.3 * n);
					out[0][0] = g;
					out[0][1] = g * 0.97;
					out[0][2] = g * 0.92;
				});

				// Craters: shadowed floor, a lit rim toward the upper left, a dark rim
				// opposite, and bright rays from a few young ones.
				const crater = (x, y, r) => {
					const floor = ctx.createRadialGradient(x, y, 0, x, y, r);
					floor.addColorStop(0, "rgba(40, 38, 36, 0.35)");
					floor.addColorStop(0.8, "rgba(60, 58, 55, 0.2)");
					floor.addColorStop(1, "rgba(60, 58, 55, 0)");
					ctx.fillStyle = floor;
					ctx.beginPath();
					ctx.arc(x, y, r, 0, TAU);
					ctx.fill();
					ctx.lineWidth = Math.max(1, r * 0.18);
					ctx.strokeStyle = "rgba(255, 250, 240, 0.35)";
					ctx.beginPath();
					ctx.arc(x, y, r, Math.PI * 0.95, Math.PI * 1.7);
					ctx.stroke();
					ctx.strokeStyle = "rgba(20, 18, 16, 0.4)";
					ctx.beginPath();
					ctx.arc(x, y, r, Math.PI * 1.95, Math.PI * 2.7);
					ctx.stroke();
				};
				for (let i = 0; i < 1400; i++) crater(random(0.03, 0.47) * w, random(0.1, 0.9) * h, random(1.5, 5));
				for (let i = 0; i < 160; i++) crater(random(0.03, 0.47) * w, random(0.12, 0.88) * h, random(6, 22));
				for (let i = 0; i < 12; i++) {
					const x = random(0.06, 0.44) * w;
					const y = random(0.18, 0.82) * h;
					const r = random(26, 60);
					if (i < 3) {
						ctx.strokeStyle = "rgba(255, 252, 240, 0.07)";
						for (let ray = 0; ray < 26; ray++) {
							const a = random(0, TAU);
							const len = random(120, 420);
							ctx.lineWidth = random(1, 4);
							ctx.beginPath();
							ctx.moveTo(x, y);
							ctx.lineTo(x + Math.cos(a) * len, y + Math.sin(a) * len * 0.5);
							ctx.stroke();
						}
					}
					crater(x, y, r);
				}
				return colorTexture(canvas);
			}

			const MOON_DISTANCE = 250;
			const moonDirection = new THREE.Vector3(-0.36, 0.095, -1).normalize();
			const MOON_RADIUS = MOON_DISTANCE * Math.tan(THREE.MathUtils.degToRad(5));
			const moonDisc = new THREE.Mesh(
				new THREE.SphereGeometry(MOON_RADIUS, 64, 48),
				new THREE.ShaderMaterial({
					uniforms: { uMap: { value: moonTexture() } },
					vertexShader: `
						varying vec2 vUv;
						varying float vFacing;
						void main() {
							vUv = uv;
							vec3 n = normalize(normalMatrix * normal);
							vec4 mv = modelViewMatrix * vec4(position, 1.0);
							vFacing = max(dot(n, normalize(-mv.xyz)), 0.0);
							gl_Position = projectionMatrix * mv;
						}
					`,
					fragmentShader: `
						uniform sampler2D uMap;
						varying vec2 vUv;
						varying float vFacing;
						void main() {
							// The texture is already decoded to linear; the tint is a warm, sickly yellow.
							vec3 color = texture2D(uMap, vUv).rgb * vec3(1.0, 0.71, 0.42);
							// max(): pow() of a hair below zero is NaN, and bloom smears a NaN pixel into a black block.
							gl_FragColor = vec4(color * pow(0.55 + 0.45 * pow(max(vFacing, 1e-4), 0.6), 2.2) * 1.3, 1.0);
						}
					`,
				}),
			);
			moonDisc.position.copy(moonDirection).multiplyScalar(MOON_DISTANCE);
			moonDisc.rotation.y = Math.atan2(-moonDirection.x, -moonDirection.z); // near side toward us
			scene.add(moonDisc);

			const [haloCanvas, haloCtx] = makeCanvas(256, 256);
			const haloGradient = haloCtx.createRadialGradient(128, 128, 20, 128, 128, 128);
			haloGradient.addColorStop(0, "rgba(255, 210, 160, 0.55)");
			haloGradient.addColorStop(0.35, "rgba(200, 160, 130, 0.18)");
			haloGradient.addColorStop(1, "rgba(120, 110, 120, 0)");
			haloCtx.fillStyle = haloGradient;
			haloCtx.fillRect(0, 0, 256, 256);
			// Fade it out before the far edge of the ground, about 3° below level,
			// or the ground cuts it off in a hard line along the horizon. The halo
			// spans about 18.5° either side of the moon, which is 5° up, so the
			// canvas has about 7 pixels to a degree.
			const horizonFade = haloCtx.createLinearGradient(0, 146, 0, 180);
			horizonFade.addColorStop(0, "#fff");
			horizonFade.addColorStop(1, "rgba(255, 255, 255, 0)");
			haloCtx.globalCompositeOperation = "destination-in";
			haloCtx.fillStyle = horizonFade;
			haloCtx.fillRect(0, 0, 256, 256);
			const moonHalo = new THREE.Sprite(
				new THREE.SpriteMaterial({ map: colorTexture(haloCanvas), blending: THREE.AdditiveBlending, depthWrite: false, fog: false, opacity: 0.6 }),
			);
			moonHalo.position.copy(moonDirection).multiplyScalar(MOON_DISTANCE + MOON_RADIUS * 2);
			moonHalo.scale.setScalar(MOON_RADIUS * 9);
			scene.add(moonHalo);

			// --- The cauldron, out in the fog to the right ----------------------

			const cauldron = new THREE.Group();
			const ironMaterial = new THREE.MeshStandardMaterial({ color: "#1b1a19", metalness: 0.7, roughness: 0.6 });
			cauldron.add(
				new THREE.Mesh(
					lathe([
						[0.001, 0.25],
						[0.9, 0.2],
						[1.4, 0.5],
						[1.65, 1.1],
						[1.6, 1.7],
						[1.35, 2.05],
						[1.42, 2.15],
						[1.48, 2.26],
						[1.32, 2.28],
						[1.26, 2.1],
						[1.3, 1.8],
					]),
					ironMaterial,
				),
			);
			for (let i = 0; i < 3; i++) {
				const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.18, 0.5, 8), ironMaterial);
				leg.position.set(Math.cos((i / 3) * TAU) * 0.9, 0.2, Math.sin((i / 3) * TAU) * 0.9);
				cauldron.add(leg);
			}
			// Embers under the pot.
			const emberGlow = new THREE.MeshStandardMaterial({ color: "#000", emissive: "#ff5a14", emissiveIntensity: 1.2 });
			for (let i = 0; i < 4; i++) {
				const log = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.14, 1.4, 8), i % 2 ? emberGlow : barkMaterial);
				log.rotation.set(Math.PI / 2, 0, (i / 4) * Math.PI + random(-0.2, 0.2));
				log.position.y = 0.12;
				cauldron.add(log);
			}
			const potionMaterial = new THREE.ShaderMaterial({
				uniforms: { ...THREE.UniformsUtils.clone(THREE.UniformsLib.fog), uTime: envTime, uSurge: { value: 0 } },
				fog: true,
				vertexShader: `
					#include <fog_pars_vertex>
					varying vec2 vUv;
					void main() {
						vUv = uv;
						vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
						gl_Position = projectionMatrix * mvPosition;
						#include <fog_vertex>
					}
				`,
				fragmentShader: `
					#include <fog_pars_fragment>
					uniform float uTime;
					uniform float uSurge;
					varying vec2 vUv;
					void main() {
						vec2 p = vUv * 2.0 - 1.0;
						float r = length(p);
						float a = atan(p.y, p.x);
						float swirl = sin(a * 3.0 + r * 8.0 - uTime * 1.2) * 0.5 + 0.5;
						float n = sin(p.x * 9.0 + uTime * 1.3) * sin(p.y * 8.0 - uTime * 1.1) * 0.5 + 0.5;
						float glow = 0.35 + 0.35 * swirl * n + 0.3 * uSurge;
						vec3 color = mix(vec3(0.04, 0.3, 0.05), vec3(0.5, 1.0, 0.35), glow);
						gl_FragColor = vec4(pow(color, vec3(2.2)) * 1.6 * smoothstep(1.0, 0.8, r), 1.0);
						#include <fog_fragment>
					}
				`,
			});
			const potion = new THREE.Mesh(new THREE.CircleGeometry(1.3, 40).rotateX(-Math.PI / 2), potionMaterial);
			potion.position.y = 1.95;
			cauldron.add(potion);
			const bubbleMaterial = new THREE.MeshBasicMaterial({ color: "#8dff6e" });
			const bubbles = Array.from({ length: 10 }, () => {
				const bubble = new THREE.Mesh(new THREE.SphereGeometry(1, 10, 8), bubbleMaterial);
				cauldron.add(bubble);
				return { mesh: bubble, age: random(0, 1), size: random(0.08, 0.22), x: 0, z: 0 };
			});
			const vaporMaterial = new THREE.SpriteMaterial({ map: colorTexture(glowCanvas), color: "#5dff70", blending: THREE.AdditiveBlending, depthWrite: false, opacity: 0 });
			const vapors = Array.from({ length: 12 }, (_, i) => {
				const sprite = new THREE.Sprite(vaporMaterial.clone());
				cauldron.add(sprite);
				return { sprite, age: i / 12 };
			});
			const CAULDRON_INTENSITY = 4;
			const cauldronLight = new THREE.PointLight("#4dff5e", CAULDRON_INTENSITY, 11, 1.6);
			cauldronLight.position.y = 3.2;
			cauldron.add(cauldronLight);
			cauldron.position.set(8, groundY, -10); // out to the right, clear of the table from most angles
			scene.add(cauldron);
			let cauldronSurge = 0;
			interactives.push({ object: cauldron, onClick: () => boilOver() });
			pickables.push(cauldron);

			// --- A broom, bristles up, leaning against the table -----------------

			function buildBroom() {
				const broom = new THREE.Group();
				const handle = [0, 0.25, 0.5, 0.75, 1].map((t) => new THREE.Vector3(0.06 * Math.sin(t * 7), t * 7.4, 0.05 * Math.cos(t * 5)));
				broom.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(handle), 30, 0.075, 8), new THREE.MeshStandardMaterial({ color: "#3d2b1c", roughness: 0.9 })));
				const straws = [];
				for (let i = 0; i < 140; i++) {
					const a = random(0, TAU);
					const spread = random(0.05, 0.55);
					const length = random(1.6, 2.2);
					const start = new THREE.Vector3(Math.cos(a) * 0.1, 7.1, Math.sin(a) * 0.1);
					const end = new THREE.Vector3(Math.cos(a) * spread, 7.1 + length, Math.sin(a) * spread);
					straws.push(new THREE.TubeGeometry(new THREE.LineCurve3(start, end), 1, random(0.008, 0.016), 3, false));
				}
				broom.add(new THREE.Mesh(mergeGeometries(straws), new THREE.MeshStandardMaterial({ color: "#7d6638", roughness: 0.95 })));
				const band = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.15, 0.35, 12), new THREE.MeshStandardMaterial({ color: "#2a1f16", roughness: 1 }));
				band.position.y = 7.25;
				broom.add(band);
				return broom;
			}
			const broom = buildBroom();
			broom.position.set(2.65, groundY, -1.45); // against the back corner, out of the camera's way
			broom.rotation.set(-0.02, 0.3, 0.07);
			scene.add(shadowed(broom));

			// --- An old upright piano, off to the far left ------------------------
			// Turn as far left as you can and it's there, half in view at the edge
			// of the screen. Where it stands depends on the screen's shape, so
			// that's true on any screen (see placePiano). A candle on top lights
			// the music on the stand, which is upside down. Click it and it plays.

			function sheetMusic() {
				const [canvas, ctx] = makeCanvas(256, 340);
				ctx.fillStyle = "#cbb993";
				ctx.fillRect(0, 0, 256, 340);
				for (let i = 0; i < 50; i++) {
					ctx.fillStyle = `rgba(110, 70, 30, ${random(0.05, 0.2)})`;
					ctx.beginPath();
					ctx.arc(random(0, 256), random(0, 340), random(1, 7), 0, TAU);
					ctx.fill();
				}
				ctx.fillStyle = ctx.strokeStyle = "#2a2018";
				ctx.font = "italic 17px Georgia, serif";
				ctx.textAlign = "center";
				ctx.fillText("Marche funèbre", 128, 30);
				for (let staff = 0; staff < 8; staff++) {
					const top = 52 + staff * 35;
					ctx.lineWidth = 0.8;
					for (let line = 0; line < 5; line++) {
						ctx.beginPath();
						ctx.moveTo(16, top + line * 4);
						ctx.lineTo(240, top + line * 4);
						ctx.stroke();
					}
					for (let x = 34; x < 236; x += random(9, 16)) {
						const y = top + randInt(-2, 10) * 2;
						ctx.beginPath();
						ctx.ellipse(x, y, 3, 2.2, -0.4, 0, TAU);
						ctx.fill();
						ctx.beginPath();
						ctx.moveTo(x + 2.6, y);
						ctx.lineTo(x + 2.6, y - 13);
						ctx.stroke();
					}
				}
				return colorTexture(canvas);
			}

			function buildPiano() {
				const piano = new THREE.Group();
				const wood = woodMaterial(4, 1);
				wood.color.set("#8a5c44"); // old, darkened varnish
				wood.roughness = 0.6;
				const panel = wood.clone();
				panel.color.set("#5e3c2c");
				const brass = new THREE.MeshStandardMaterial({ color: "#8a6a3a", metalness: 0.8, roughness: 0.45 });
				const box = (w, h, d, x, y, z, material = wood) => {
					const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), material);
					mesh.position.set(x, y, z);
					piano.add(mesh);
					return mesh;
				};
				// The case, about 145 cm wide and 130 tall; the keys face +z.
				box(9.7, 0.25, 2.8, 0, 0.125, -0.5); // plinth
				box(9.0, 4.15, 2.55, 0, 2.3, -0.575); // below the keys
				box(9.0, 3.5, 2.15, 0, 6.75, -0.775); // above the keys
				box(9.9, 0.18, 2.7, 0, 8.59, -0.6); // top
				box(7.6, 3.2, 0.06, 0, 2.3, 0.72, panel);
				box(7.4, 2.0, 0.06, 0, 7.4, 0.32, panel);
				for (const side of [-1, 1]) {
					box(0.32, 8.4, 2.55, side * 4.66, 4.2, -0.575); // cheek
					box(0.32, 0.6, 1.5, side * 4.66, 4.65, 1.45); // arm
					const leg = new THREE.Mesh(
						lathe([
							[0.17, 0],
							[0.21, 0.15],
							[0.13, 0.45],
							[0.23, 1.3],
							[0.15, 2.5],
							[0.22, 3.6],
							[0.14, 3.95],
							[0.21, 4.35],
						], 16),
						wood,
					);
					leg.position.set(side * 4.66, 0, 1.9);
					piano.add(leg);
				}
				box(9.0, 0.3, 2.0, 0, 4.45, 1.0); // keybed

					const { bat } = roost;

					if (roost.state === "hanging") {
						hang(bat, roost.point, t, roost.phase);
						if (Math.random() < dt * 0.05) bat.userData.wings[1].rotation.y = -1.1; // a twitch
						if (roost.timer <= 0) startle(roost);
					} else if (roost.state === "leaving") {
						// Drop, then flap away up and out.
						const k = roost.timer;
						bat.position.copy(roost.from).addScaledVector(roost.away, k * k * 4 + k * 3);
						bat.position.y -= Math.max(0, 0.6 - k) * k * 2;

			function onPumpkin(u, v) {

			// Move along a list of (u, v) waypoints on the skin at a steady pace.
			function crawlSurface(spider, dt) {

				if (ahead.lengthSq() > 1e-10) faceAlong(spider.object, _normal, ahead);
				if (spider.leg >= 1) {
					spider.path.shift();
					spider.leg = 0;
				}
				return spider.path.length < 2;
			}

			function updateSpiders(dt) {
				for (const spider of spiders) {
					const object = spider.object;
					let moving = false;
					if (spider.mode === "walk" || spider.mode === "toPumpkin") {
						const to = spider.target.clone().sub(object.position).setY(0);
						const distance = to.length();
						if (spider.timer > 0) {
							spider.timer -= dt;
						} else if (distance > 0.02) {
							object.position.addScaledVector(to.normalize(), Math.min(distance, 0.2 * dt));
							object.position.y = 0.005;
							faceAlong(object, new THREE.Vector3(0, 1, 0), to);
							moving = true;
						} else if (spider.mode === "toPumpkin") {
							const [u, v] = holeBottoms[mouthIndex];
							spider.path = [
								[u, BASE_V],
								[u, v + 0.012],
							];
							spider.mode = "climbIn";
						} else if (!spiderInPumpkin && rand() < 0.35) {
							spiderInPumpkin = true;
							spider.mode = "toPumpkin";
							onPumpkin(holeBottoms[mouthIndex][0], BASE_V);
							spider.target.set(_surface.x, 0.005, _surface.z);
						} else {
							spider.target = tablePoint();
							spider.timer = random(0.5, 3.5); // stop, then dart off
						}
					} else if (spider.mode === "climbIn" || spider.mode === "climbOut") {
						moving = true;
						if (crawlSurface(spider, dt)) {
							if (spider.mode === "climbIn") {
								spider.mode = "inside";
								spider.object.visible = false;
								spider.timer = random(6, 14);
								spiderInPumpkin = false;
							} else {
								spider.mode = "walk";
								spider.target = tablePoint();
								spider.object.position.y = 0.005;
							}
						}
					} else if (spider.mode === "inside") {
						spider.timer -= dt;
						if (spider.timer <= 0) {
							// Out through an eye (or whatever isn't the mouth), sideways
							// past the mouth, then down to the table.
							const exits = holeBottoms.filter((_, i) => i !== mouthIndex);
							const [u, v] = exits[randInt(0, exits.length - 1)];
							const side = u < 0.5 ? mouthSpan[0] - 0.02 : mouthSpan[1] + 0.02;
							spider.path = [
								[u, v + 0.012],
								[side, v + 0.012],
								[side, BASE_V],
							];
							spider.mode = "climbOut";
							spider.object.visible = true;
						}
					}
					// Legs: two alternating sets, swinging as it moves.
					if (moving) spider.gait += dt * 22;
					for (const { hip, group } of object.userData.legs) {
						hip.rotation.y = moving ? 0.28 * Math.sin(spider.gait + group * Math.PI) : 0;
						hip.position.y = 0.048 + (moving ? 0.012 * Math.max(0, Math.sin(spider.gait + group * Math.PI)) : 0);
					}
				}
			}

			// --- The black cat, prowling between the far gravestones --------------
			// Built like a real one: a long body, deep in the chest and narrow at
			// the waist; a small head with big ears; jointed legs, the hind ones
			// standing on their toes; a tail that curves and sways. It walks the
			// way cats do, one leg at a time, hind leg then the front on the
			// same side. Its fur takes a soft sheen at the edges, and its eyes
			// catch the light.

			function buildCat() {
				const fur = new THREE.MeshPhysicalMaterial({ color: "#0b0b0d", roughness: 0.75, sheen: 1, sheenRoughness: 0.45, sheenColor: "#4b4b5a" });
				const cat = new THREE.Group();
				const piece = (geometry, parent, x, y, z) => {
					const mesh = new THREE.Mesh(geometry, fur);
					mesh.position.set(x, y, z);
					parent.add(mesh);
					return mesh;
				};
				// A tapered bone hanging down from a joint.
				const bone = (top, bottom, length, parent) => piece(new THREE.CylinderGeometry(top, bottom, length, 10).translate(0, -length / 2, 0), parent, 0, 0, 0);

				// Body: lathed along the spine (rump at -z, chest at +z), then
				// narrowed at the sides, deepened at the chest and tucked at the belly.
				const body = displace(
					lathe(
						[
							[0.001, -1.0],
							[0.22, -0.95],
							[0.33, -0.72],
							[0.35, -0.45],
							[0.3, -0.12],
							[0.33, 0.25],
							[0.37, 0.55],
							[0.32, 0.82],
							[0.18, 0.97],
							[0.001, 1.02],
						],
						24,
					).rotateX(Math.PI / 2),
					(x, y, z) => {
						const deep = 1 + 0.22 * smoothstep(0.1, 0.6, z);
						const tuck = y < 0 ? 1 - 0.25 * smoothstep(-0.5, 0.1, z) * smoothstep(0.6, -0.1, z) : 1;
						return [x * 0.82, y * deep * tuck + 0.05 * Math.sin(((z + 1) / 2) * Math.PI), z];
					},
				);
				piece(body, cat, 0, 1.25, -0.05);
				const neck = piece(new THREE.CylinderGeometry(0.17, 0.27, 0.62, 12), cat, 0, 1.6, 0.92);
				neck.rotation.x = 0.85;

				const head = new THREE.Group();
				head.position.set(0, 1.86, 1.18);
				piece(new THREE.SphereGeometry(0.25, 18, 14).scale(1, 0.86, 1.05), head, 0, 0, 0);
				for (const side of [-1, 1]) {
					piece(new THREE.SphereGeometry(0.15, 12, 10), head, side * 0.11, -0.07, 0.07); // cheek
					const ear = piece(new THREE.ConeGeometry(0.11, 0.27, 4, 1).scale(1, 1, 0.4), head, side * 0.14, 0.24, -0.03);
					ear.rotation.set(-0.1, side * 0.35, -side * 0.32);
					const eye = new THREE.Mesh(new THREE.SphereGeometry(0.042, 10, 8).scale(1.3, 0.72, 0.6), new THREE.MeshBasicMaterial({ color: "#a7cc45" }));
					eye.position.set(side * 0.095, 0.03, 0.205);
					eye.rotation.z = side * 0.28;
					const pupil = new THREE.Mesh(new THREE.BoxGeometry(0.01, 0.05, 0.01), new THREE.MeshBasicMaterial({ color: "#000" }));
					pupil.position.set(side * 0.095, 0.03, 0.232);
					head.add(eye, pupil);
				}
				piece(new THREE.SphereGeometry(0.095, 12, 10).scale(1.1, 0.75, 1), head, 0, -0.09, 0.2); // muzzle
				cat.add(head);

				// Legs: [x, y, z of the top joint, bones as [top radius, bottom radius,
				// length, resting angle], hind?]. Angles tip each bone's lower end
				// backward (+) or forward (-).
				const legs = [
					[-0.18, 1.3, -0.68, true, 0],
					[-0.16, 1.15, 0.72, false, 0.5],
					[0.18, 1.3, -0.68, true, 1],
					[0.16, 1.15, 0.72, false, 1.5],
				].map(([x, y, z, hind, step]) => {
					const bones = hind
						? [
								[0.19, 0.11, 0.56, -0.45],
								[0.095, 0.07, 0.5, 1.1],
								[0.065, 0.058, 0.38, -0.6],
							]
						: [
								[0.14, 0.095, 0.5, 0.35],
								[0.078, 0.064, 0.55, -0.35],
							];
					const joints = [];
					let parent = cat;
					let at = new THREE.Vector3(x, y, z);
					for (const [top, bottom, length, rest] of bones) {
						const joint = new THREE.Group();
						joint.position.copy(at);
						joint.rotation.x = rest;
						parent.add(joint);
						bone(top, bottom, length, joint);
						joints.push({ joint, rest });
						parent = joint;
						at = new THREE.Vector3(0, -length, 0);
					}
					piece(new THREE.SphereGeometry(0.07, 10, 8).scale(1, 0.6, 1.4), parent, 0, -bones[bones.length - 1][2], 0.03); // paw
					return { joints, hind, phase: step * Math.PI };
				});

				// Tail: a chain of short tapering pieces from the rump.
				const tail = [];
				let parent = cat;
				let at = new THREE.Vector3(0, 1.45, -1.0);
				for (let i = 0; i < 14; i++) {
					const joint = new THREE.Group();
					joint.position.copy(at);
					parent.add(joint);
					const r = 0.075 - i * 0.003;
					piece(new THREE.CylinderGeometry(r - 0.003, r, 0.14, 8).translate(0, 0.07, 0), joint, 0, 0, 0);
					tail.push(joint);
					parent = joint;
					at = new THREE.Vector3(0, 0.13, 0);
				}

				cat.userData = { head, legs, tail };
				return cat;
			}

			const cat = buildCat();
			scene.add(cat);
			const catRoute = [
				[-15, -24],
				[-8, -23],
				[-2, -25.5],
				[5, -24],
				[11, -26],
				[16, -21],
				[9, -30],
				[0, -31],
				[-10, -29],
			].map(([x, z]) => new THREE.Vector3(x, groundY, z));
			const catState = { leg: 0, from: 0, pause: 2, gait: 0, stride: 0 };
			cat.position.copy(catRoute[0]);

			function updateCat(dt, t) {
				const { head, legs, tail } = cat.userData;
				let walking = false;
				if (catState.pause > 0) {
					catState.pause -= dt;
				} else {
					const from = catRoute[catState.from];
					const to = catRoute[(catState.from + 1) % catRoute.length];
					const length = from.distanceTo(to);
					catState.leg += (1.6 * dt) / length;
					cat.position.lerpVectors(from, to, Math.min(1, catState.leg));
					cat.rotation.y = Math.atan2(to.x - from.x, to.z - from.z);
					walking = true;
					if (catState.leg >= 1) {
						catState.leg = 0;
						catState.from = (catState.from + 1) % catRoute.length;
						if (rand() < 0.45) catState.pause = random(3, 7); // stop and stare
					}
				}
				// Each leg swings through its step; on the way forward it lifts,
				// bending at the knee (hind) or folding back at the wrist (front).
				catState.stride += ((walking ? 1 : 0) - catState.stride) * Math.min(1, dt * 4);
				if (walking) catState.gait += dt * 8;
				for (const { joints, hind, phase } of legs) {
					const p = catState.gait + phase;
					const lift = Math.max(0, -Math.cos(p)) * catState.stride;
					joints[0].joint.rotation.x = joints[0].rest + 0.38 * Math.sin(p) * catState.stride;
					joints[1].joint.rotation.x = joints[1].rest + (hind ? 0.55 : 0.9) * lift;
					if (hind) joints[2].joint.rotation.x = joints[2].rest - 0.4 * lift;
				}
				// When it stops, it turns its head to look at you.
				const toCamera = wrapAngle(Math.atan2(camera.position.x - cat.position.x, camera.position.z - cat.position.z) - cat.rotation.y);
				head.rotation.y += ((walking ? 0 : clamp(toCamera, -1.3, 1.3)) - head.rotation.y) * Math.min(1, dt * 2);
				head.position.y = 1.86 + 0.03 * Math.sin(catState.gait * 2) * catState.stride;
				// The tail hangs back, curves up at the end, and sways.
				tail.forEach((joint, i) => {
					joint.rotation.x = i === 0 ? -2.3 : 0.17 + 0.04 * Math.sin(t * 0.9 + i * 0.4);
					joint.rotation.z = 0.09 * Math.sin(t * 1.4 - i * 0.45);
				});
			}

			// --- A rat, now and then, across the front of the table --------------
			// It leaps up at one end, scurries along the front edge, stops once or
			// twice to sniff, and drops off the other end. It's solid, so it
			// shoves whatever's in its way.

			function buildRat() {
				const fur = new THREE.MeshStandardMaterial({ color: "#3a322b", roughness: 0.9 });
				const skin = new THREE.MeshStandardMaterial({ color: "#a37d74", roughness: 0.6 });
				const rat = new THREE.Group();
				rat.rotation.order = "YXZ"; // heading, then nose up or down
				const body = new THREE.Mesh(
					displace(new THREE.SphereGeometry(1, 18, 12), (x, y, z) => {
						const rump = 1 + 0.25 * smoothstep(0.2, -0.6, z); // heavier behind
						return [x * 0.2 * rump, y * 0.17 * rump + 0.04 * (1 - z * z), z * 0.5];
					}),
					fur,
				);
				body.position.set(0, 0.17, -0.05);
				const head = new THREE.Group();
				head.position.set(0, 0.19, 0.38);
				const snout = new THREE.Mesh(new THREE.ConeGeometry(0.14, 0.42, 14).rotateX(Math.PI / 2), fur);
				snout.position.z = 0.12;
				snout.scale.y = 0.85;
				head.add(snout);
				const nose = new THREE.Mesh(new THREE.SphereGeometry(0.022, 8, 6), skin);
				nose.position.z = 0.33;
				head.add(nose);
				for (const side of [-1, 1]) {
					const ear = new THREE.Mesh(new THREE.SphereGeometry(0.06, 10, 8).scale(1, 1, 0.25), skin);
					ear.position.set(side * 0.09, 0.1, -0.02);
					ear.rotation.y = side * 0.5;
					const eye = new THREE.Mesh(new THREE.SphereGeometry(0.02, 8, 6), new THREE.MeshStandardMaterial({ color: "#050403", roughness: 0.1 }));
					eye.position.set(side * 0.075, 0.05, 0.1);
					head.add(ear, eye);
				}
				const legs = [
					[-0.13, 0.25],
					[0.13, 0.25],
					[-0.15, -0.3],
					[0.15, -0.3],
				].map(([x, z], i) => {
					const hip = new THREE.Group();
					hip.position.set(x, 0.09, z);
					const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.024, 0.09, 6).translate(0, -0.045, 0), skin);
					hip.add(leg);
					rat.add(hip);
					return { hip, phase: i < 2 ? 0 : Math.PI }; // a bound: front pair, then back pair
				});
				const tail = [];
				let parent = rat;
				let at = new THREE.Vector3(0, 0.13, -0.52);
				for (let i = 0; i < 12; i++) {
					const joint = new THREE.Group();
					joint.position.copy(at);
					joint.rotation.x = i === 0 ? -1.75 : 0.02;
					parent.add(joint);
					const r = 0.032 - i * 0.002;
					joint.add(new THREE.Mesh(new THREE.CylinderGeometry(r - 0.002, r, 0.11, 6).translate(0, 0.055, 0), skin));
					tail.push(joint);
					parent = joint;
					at = new THREE.Vector3(0, 0.1, 0);
				}
				rat.add(body, head);
				rat.scale.setScalar(0.8);
				rat.userData = { head, legs, tail };
				return rat;
			}

			const rat = shadowed(buildRat());
			rat.visible = false;
			scene.add(rat);
			const ratBody = world.createRigidBody(RAPIER.RigidBodyDesc.kinematicPositionBased().setTranslation(0, -50, 0));
			world.createCollider(RAPIER.ColliderDesc.ball(0.09), ratBody);
			const RAT_Z = 1.36; // along the front edge of the table
			// It goes around behind the apple and the glass, wherever they are on
			// the table, rather than knocking them over: [thing, how far its middle
			// stays from the rat's].
			const ratAvoids = [
				[apple, 0.31],
				[wineGlass, 0.31],
			];
			function ratPathZ(x) {
				const base = RAT_Z + 0.05 * Math.sin(x * 2.7);
				let z = base;
				for (const [thing, gap] of ratAvoids) {
					const { x: tx, y: ty, z: tz } = thing.position;
					if (ty < -0.1 || ty > 0.6 || Math.abs(tz - base) > gap) continue; // off the table, or out of the way
					z = Math.min(z, THREE.MathUtils.lerp(base, tz - gap, smoothstep(gap * 3, gap * 1.2, Math.abs(x - tx))));
				}
				return z;
			}
			const ratState = { wait: random(20, 40), run: null, gait: 0, patter: 0 };

			function updateRat(dt, t) {
				const state = ratState;
				if (!state.run) {
					state.wait -= dt;
					if (state.wait > 0) return;
					const dir = rand() < 0.5 ? 1 : -1;
					state.run = { dir, x: -dir * 2.6, pause: 0, stops: [random(-1.5, -0.3), random(0.3, 1.5)].filter(() => rand() < 0.7) };
					rat.visible = true;
				}
				const run = state.run;
				const { head, legs, tail } = rat.userData;
				const moving = run.pause <= 0;
				if (moving) {
					const next = run.x + run.dir * 3.2 * dt;
					const stop = run.stops.findIndex((x) => (x - run.x) * (x - next) <= 0);
					run.x = next;
					if (stop >= 0) {
						run.stops.splice(stop, 1);
						run.pause = random(0.6, 1.6);
						sounds.squeak(rat.position);
					}
				} else {
					run.pause -= dt;
				}
				// Past either end of the table it's leaping up or dropping off.
				const over = Math.max(0, Math.abs(run.x) - 2.0);
				const leaving = Math.sign(run.x) === run.dir;
				const z = ratPathZ(run.x);
				rat.position.set(run.x, 0.005 - over * 2.4, z);
				rat.rotation.y = Math.atan2(run.dir * 0.05, ratPathZ(run.x + run.dir * 0.05) - z);
				rat.rotation.x = clamp(over * 4, 0, 1) * (leaving ? 1.2 : -1.2);
				if (over > 0.6 && leaving) {
					state.run = null;
					state.wait = random(25, 60);
					rat.visible = false;
					ratBody.setNextKinematicTranslation({ x: 0, y: -50, z: 0 });
					return;
				}
				ratBody.setNextKinematicTranslation({ x: rat.position.x, y: rat.position.y + 0.09, z: rat.position.z });

				if (moving) {
					state.gait += dt * 32;
					state.patter -= dt;
					if (state.patter < 0) {
						sounds.patter(rat.position);
						state.patter = 0.06;
					}
				}
				rat.position.y += moving ? 0.03 * Math.abs(Math.sin(state.gait)) : 0;
				for (const { hip, phase } of legs) hip.rotation.x = moving ? 0.7 * Math.sin(state.gait + phase) : 0;
				head.rotation.x = moving ? 0 : 0.15 * Math.sin(t * 22) - 0.1; // sniffing
				head.rotation.y = moving ? 0 : 0.4 * Math.sin(t * 2.5);
				tail.forEach((joint, i) => i && (joint.rotation.y = 0.22 * Math.sin(t * (moving ? 14 : 4) - i * 0.6)));
			}

			// --- Everything out there, per frame ----------------------------------

			function updateSurroundings(dt, t) {
				envTime.value = t;

				// Cauldron: bubbles rise, swell and pop; green vapor drifts up; a click
				// makes it surge.
				cauldronSurge = Math.max(0, cauldronSurge - dt);
				const surge = Math.min(1, cauldronSurge);
				potionMaterial.uniforms.uSurge.value = surge;
				cauldronLight.intensity = CAULDRON_INTENSITY * (0.85 + 0.1 * Math.sin(t * 2.3) + 0.05 * Math.sin(t * 5.1) + 0.8 * surge);
				for (const bubble of bubbles) {
					bubble.age += dt * (0.5 + 1.5 * surge);
					if (bubble.age >= 1) {
						bubble.age = 0;
						const a = random(0, TAU);
						const r = Math.sqrt(rand()) * 1.0;
						bubble.x = Math.cos(a) * r;
						bubble.z = Math.sin(a) * r;
					}
					const grow = Math.sin(Math.PI * bubble.age);
					bubble.mesh.position.set(bubble.x, 1.95, bubble.z);
					bubble.mesh.scale.set(bubble.size * grow, bubble.size * grow * 0.7, bubble.size * grow);
				}
				for (const vapor of vapors) {
					vapor.age = (vapor.age + dt * (0.15 + 0.2 * surge)) % 1;
					vapor.sprite.position.set(Math.sin(vapor.age * 5 + vapor.sprite.id) * 0.4, 2.1 + vapor.age * 3.5, Math.cos(vapor.age * 4 + vapor.sprite.id) * 0.4);
					vapor.sprite.scale.setScalar(1 + vapor.age * 3);
					vapor.sprite.material.opacity = (0.16 + 0.15 * surge) * Math.sin(Math.PI * vapor.age);
				}

				// A flock of bats now and then; two more always circling the big tree.
				nextFlock -= dt;
				if (!flock && nextFlock <= 0) startFlock();
				if (flock) {
					flock.time += dt;
					for (const { bat, offset, lag, wobble } of flock.bats) {
						const k = clamp(flock.time / flock.duration - lag, 0, 1);
						bat.visible = k > 0 && k < 1;
						flock.path.getPointAt(k, bat.position).add(offset).add(new THREE.Vector3(0, Math.sin(t * 6 + wobble) * 0.3, Math.cos(t * 5 + wobble) * 0.3));
						bat.lookAt(flock.path.getPointAt(Math.min(1, k + 0.01), _v).add(offset));
						flap(bat, t);
					}
					if (flock.time > flock.duration * 1.2) {
						flock.bats.forEach(({ bat }) => (bat.visible = false));
						flock = null;
						nextFlock = random(15, 32);
					}
				}
				updateRoosts(dt, t);
				treeBats.forEach((bat, i) => {
					const a = t * (0.5 + i * 0.17) + i * 2;
					const radius = 7 + 2 * Math.sin(t * 0.7 + i);
					bat.position.set(bigTree.x + Math.cos(a) * radius, groundY + 14 + 3 * Math.sin(t * 1.3 + i * 3), bigTree.z + Math.sin(a) * radius);
					bat.lookAt(bigTree.x + Math.cos(a + 0.1) * radius, bat.position.y, bigTree.z + Math.sin(a + 0.1) * radius);
					flap(bat, t);
				});

				// The witch: across the face of the moon every minute or so.
				nextWitch -= dt;
				if (!witchFlight && nextWitch <= 0) {
					witchFlight = { time: 0, duration: random(11, 15), rise: random(0.02, 0.07), height: random(0.04, 0.1) };
					witch.visible = true;
					sounds.witchPasses();
				}
				if (witchFlight) {
					witchFlight.time += dt;
					const k = witchFlight.time / witchFlight.duration;
					const azimuth = THREE.MathUtils.lerp(0.75, -1.25, k);
					const direction = new THREE.Vector3(Math.sin(azimuth), witchFlight.height + witchFlight.rise * k + 0.01 * Math.sin(t * 2.2), -Math.cos(azimuth)).normalize();
					witch.position.copy(direction).multiplyScalar(140);
					witch.rotation.set(0.05 * Math.sin(t * 1.7), azimuth + Math.PI / 2 + Math.PI, 0.05 * Math.sin(t * 2.3));
					const { cape, base } = witch.userData;
					const position = cape.geometry.attributes.position;
					for (let i = 0; i < position.count; i++) {
						const x = base[i * 3];
						position.setZ(i, Math.sin(t * 9 + x * 3) * 0.18 * (1 - x));
					}
					position.needsUpdate = true;
					if (k >= 1) {
						witch.visible = false;
						witchFlight = null;
						nextWitch = random(40, 75);
					}
				}

				// The vulture: looks around, and now and then half-opens its wings.
				const vultureState = vulture.userData;
				vultureState.nextLook -= dt;
				if (vultureState.nextLook <= 0) {
					vultureState.look = random(-1.1, 1.1);
					vultureState.nextLook = random(2, 7);
				}
				vultureState.neck.rotation.y += (vultureState.look - vultureState.neck.rotation.y) * Math.min(1, dt * 3);
				vultureState.nextSpread -= dt;
				if (vultureState.nextSpread <= 0) {
					vultureState.spread = 3;
					vultureState.nextSpread = random(25, 45);
				}
				vultureState.spread = Math.max(0, vultureState.spread - dt);
				const open = Math.sin((Math.PI * vultureState.spread) / 3) * 0.9;
				vultureState.wings[0].rotation.z = open;
				vultureState.wings[1].rotation.z = -open;

				updateSpiders(dt);
				updateCat(dt, t);
			}

			// =====================================================================
			// Night lighting
			// =====================================================================

			scene.add(new THREE.HemisphereLight("#565079", "#1a120c", 1.5));

			const moon = new THREE.DirectionalLight("#c3ccef", 1.5);
			moon.position.set(-3.6, 7.5, -10); // same side as the moon in the sky, but higher
			moon.castShadow = true;
			moon.shadow.mapSize.set(2048, 2048);
			Object.assign(moon.shadow.camera, { left: -4, right: 4, top: 4, bottom: -4, near: 0.5, far: 25 });
			moon.shadow.bias = -0.0005;
			moon.shadow.normalBias = 0.02;
			scene.add(moon);

			// =====================================================================
			// Camera
			// Front-facing only. When left alone, the camera drifts slowly from
			// side to side and turns back well before it gets around the pumpkin.
			// You can tip it down far enough to look up under the table.
			// =====================================================================

			const SWING = 0.9; // how far you can orbit to either side (radians)
			const SWEEP = 0.26; // how far the idle drift goes
			controls.minAzimuthAngle = turn - SWING;
			controls.maxAzimuthAngle = turn + SWING;
			// Everything turns around the candle flame inside the pumpkin. The camera
			// starts the same height above it as it used to sit above the middle.
			pumpkin.updateMatrixWorld(true);
			flame.getWorldPosition(controls.target).y += 0.05;
			const orbitHome = controls.target.clone();
			camera.position.set(Math.sin(turn) * 5 + 0.3, controls.target.y + 0.85, Math.cos(turn) * 5);
			const cameraHome = camera.position.clone();

			// Far enough out, you can tip down below the tabletop and look up at
			// its underside, but never through the ground. Once under, you can
			// move in until you're just below the table; to come back up, move
			// out first. Either way you never pass through the table.
			controls.minPolarAngle = 0.12 * Math.PI;
			controls.maxPolarAngle = 0.9 * Math.PI; // the same at any zoom
			// Under the table, zooming in also brings the carved mark to the middle
			// of the view, a little with every step, so it's centered just as you
			// reach the closest zoom: the camera keeps looking the same way and
			// goes in a straight line from wherever you start to just under the
			// mark, so it drifts sideways evenly the whole way in. Zooming out
			// undoes it the same way, back to the flame by the starting distance,
			// and zooming above the table heads back to the flame too. Nothing moves it unless
			// you zoom, and zooming never takes it into the table. (The controls
			// zoom as soon as you scroll or pinch; this sees how far since last
			// frame.)
			const _mark = new THREE.Vector3();
			const _shift = new THREE.Vector3();
			const CLOSEST = 0.35; // where the mark is centered
			const FARTHEST = 5; // where it's back to the flame
			const settled = { reach: 0, position: new THREE.Vector3(), target: new THREE.Vector3() }; // where the camera was at the end of last frame
			// Over the table, and inside the tabletop (or just under it).
			const overTable = (p) => Math.abs(p.x - table.position.x) < 2.15 && p.z > tableBack - 0.1 && p.z < tableFront + 0.1;
			const inTable = (p) => overTable(p) && p.y > -0.2 && p.y < 0.02;
			const throughTable = (a, b) => (overTable(a) || overTable(b)) && a.y < -0.1 !== b.y < -0.1;
			function zoomTowardMark() {
				const target = controls.target;
				const [before, after] = [settled.reach, camera.position.distanceTo(target)];
				if (before && Math.abs(after / before - 1) > 1e-4) {
					const zoomingIn = after < before;
					const aim = camera.position.y < -0.2 && zoomingIn ? markTarget.getWorldPosition(_mark) : orbitHome;
					// How much of the rest of the way this step covers.
					const share = zoomingIn ? (before - after) / (before - CLOSEST) : (after - before) / (FARTHEST - before);
					_shift.subVectors(aim, target).multiplyScalar(share > 0 && share < 1 ? share : 1);
					target.add(_shift);
					camera.position.add(_shift);
					// Never zoom into the table: a step that would go in doesn't happen.
					if ((inTable(camera.position) && !inTable(settled.position)) || throughTable(settled.position, camera.position)) {
						camera.position.copy(settled.position);
						target.copy(settled.target);
					}
				}
				settled.reach = camera.position.distanceTo(target);
				settled.position.copy(camera.position);
				settled.target.copy(target);
			}

			// Turning down past the ground slides the camera in toward the flame,
			// along its line of sight, instead of into the ground, and back out to
			// where it was as you turn up again.
			let groundHeld = 0; // how far out the camera wants to be while the ground holds it in
			let groundPulled = 0; // and how far out it was held, so zooming meanwhile still counts
			function releaseGround() {
				if (groundHeld) camera.position.sub(controls.target).multiplyScalar(groundHeld / groundPulled).add(controls.target);
				groundHeld = 0;
			}
			function holdAboveGround() {
				const floor = groundY + 0.3;
				if (camera.position.y >= floor) return;
				const offset = camera.position.clone().sub(controls.target);
				groundHeld = offset.length();
				camera.position.copy(controls.target).addScaledVector(offset, (controls.target.y - floor) / -offset.y);
				groundPulled = camera.position.distanceTo(controls.target);
			}

			const sweep = { idle: 0, velocity: 0, direction: 1, dragging: false };
			controls.addEventListener("start", () => {
				sweep.dragging = true;
				sweep.velocity = 0;
			});
			controls.addEventListener("end", () => {
				sweep.dragging = false;
				sweep.idle = 0;
			});

			const _offset = new THREE.Vector3();
			const _spherical = new THREE.Spherical();
			function updateSweep(dt) {
				if (sweep.dragging || press) return;
				sweep.idle += dt;
				_offset.subVectors(camera.position, controls.target);
				// Wait a moment after the user lets go, and stay still up close.
				if (sweep.idle < 3 || _offset.length() < 2.2) return;
				_spherical.setFromVector3(_offset);
				const angle = wrapAngle(_spherical.theta - turn);
				if (angle > SWEEP) sweep.direction = -1;
				if (angle < -SWEEP) sweep.direction = 1;
				sweep.velocity += (sweep.direction * 0.09 - sweep.velocity) * Math.min(1, dt * 0.6);
				_spherical.theta += sweep.velocity * dt;
				camera.position.copy(controls.target).add(_offset.setFromSpherical(_spherical));
			}

			// =====================================================================
			// Post-processing
			// The scene renders into a high-range buffer so flames, the moon and
			// the potion can be brighter than white and bloom. Then tone mapping,
			// and a final grade: cool shadows, warm highlights, a gentle contrast
			// curve, a vignette and a little film grain.
			// =====================================================================

			const composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType, samples: 4 }));
			composer.addPass(new RenderPass(scene, camera));

			const fullscreenVertex = `
				varying vec2 vUv;
				void main() {
					vUv = uv;
					gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
				}
			`;

			// Cap how bright any one pixel can be before bloom. A pinpoint glint on
			// glossy glass can be hundreds of times brighter than white, and bloom's
			// low-resolution layers smear a spike like that into a soft square.
			composer.addPass(
				new ShaderPass({
					uniforms: { tDiffuse: { value: null } },
					vertexShader: fullscreenVertex,
					fragmentShader: `
						uniform sampler2D tDiffuse;
						varying vec2 vUv;
						void main() {
							vec4 c = texture2D(tDiffuse, vUv);
							float peak = max(max(c.r, c.g), c.b);
							c.rgb *= min(1.0, 4.0 / max(peak, 1e-4));
							gl_FragColor = c;
						}
					`,
				}),
			);
			const bloom = new UnrealBloomPass(new THREE.Vector2(256, 256), 0.5, 0.3, 0.85);
			composer.addPass(bloom);
			composer.addPass(new OutputPass());

			// The old-film look: cool shadows and warm highlights on faded stock,
			// projector flicker, heavy grain, dust, the odd scratch, and a frame
			// that never sits quite still.
			const grade = new ShaderPass({
				uniforms: {
					tDiffuse: { value: null },
					uResolution: { value: new THREE.Vector2(1, 1) },
					uSeed: { value: 0 },
					uFlicker: { value: 1 },
					uScratch: { value: new THREE.Vector2(0.5, 0) }, // x position, strength (0 = none)
					uWeave: { value: new THREE.Vector2() },
					uPixelRatio: { value: 1 }, // render pixels per CSS pixel
				},
				vertexShader: fullscreenVertex,
				fragmentShader: `
					uniform sampler2D tDiffuse;
					uniform vec2 uResolution;
					uniform float uSeed;
					uniform float uFlicker;
					uniform vec2 uScratch;
					uniform vec2 uWeave;
					uniform float uPixelRatio;
					varying vec2 vUv;

					float hash(vec2 p) {
						return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453);
					}

					void main() {
						vec3 c = texture2D(tDiffuse, vUv + uWeave).rgb;
						float l = dot(c, vec3(0.299, 0.587, 0.114));
						// Cool shadows, warm highlights.
						c = mix(c, c * vec3(0.92, 1.0, 1.1), (1.0 - smoothstep(0.0, 0.45, l)) * 0.35);
						c = mix(c, c * vec3(1.06, 1.0, 0.92), smoothstep(0.5, 1.0, l) * 0.3);
						// A gentle S-curve.
						c = mix(c, c * c * (3.0 - 2.0 * c), 0.25);
						// Faded stock: a little less color, slightly lifted blacks.
						c = mix(vec3(l), c, 0.8);
						c = c * 0.95 + vec3(0.022, 0.02, 0.016);
						// Projector flicker.
						c *= uFlicker;
						// Vignette.
						vec2 q = vUv - 0.5;
						q.x *= uResolution.x / uResolution.y;
						c *= mix(0.45, 1.0, 1.0 - smoothstep(0.2, 0.95, length(q)));
						// Heavy grain, strongest in the mid-tones. Sized in CSS pixels (clumps
						// about 1.5 across) so it looks the same on every screen, whatever
						// resolution the scene is rendering at.
						vec2 css = gl_FragCoord.xy / uPixelRatio;
						float grain = (hash(floor(css / 1.5) + uSeed) - 0.5) + 0.5 * (hash(floor(css) + uSeed * 1.37) - 0.5);
						float mid = 1.0 - min(1.0, abs(l - 0.4) * 1.5);
						c += grain * 0.12 * (0.45 + 0.55 * mid);
						// Dust: a few specks, different every frame, dark and light.
						vec2 dustUv = vUv * vec2(uResolution.x / uResolution.y, 1.0) * 70.0;
						vec2 dustCell = floor(dustUv);
						if (hash(dustCell + uSeed * 3.1) > 0.9975) {
							vec2 local = fract(dustUv) - 0.5 - (vec2(hash(dustCell + 1.3), hash(dustCell + 7.1)) - 0.5) * 0.5;
							float speck = 1.0 - smoothstep(0.02, 0.12, length(local * vec2(1.0, 0.6 + hash(dustCell))));
							c = mix(c, vec3(hash(dustCell + uSeed) > 0.4 ? 0.02 : 0.85), speck * 0.75);
						}
						// A scratch running down the frame, broken in places.
						if (uScratch.y > 0.0) {
							float x = uScratch.x + 0.002 * sin(vUv.y * 23.0 + uSeed) + 0.001 * sin(vUv.y * 71.0);
							float line = 1.0 - smoothstep(0.0, 1.5 * uPixelRatio / uResolution.x, abs(vUv.x - x)); // 1.5 CSS pixels wide
							float unbroken = step(0.25, hash(vec2(floor(vUv.y * 90.0), uSeed)));
							c = mix(c, vec3(0.82, 0.8, 0.74), line * unbroken * uScratch.y * 0.55);
						}
						gl_FragColor = vec4(c, 1.0);
					}
				`,
			});
			composer.addPass(grade);

			// Old film runs at 24 frames a second, so the grain, dust and jitter
			// step at that rate even when the scene renders faster.
			const film = { frame: 0, flicker: 1, flickerTarget: 1, scratch: 0, scratchX: 0.5 };
			function updateFilm(dt) {
				film.frame += dt * 24;
				if (film.frame >= 1) {
					film.frame %= 1;
					grade.uniforms.uSeed.value = Math.random() * 100;
					film.flickerTarget = 0.96 + Math.random() * 0.06 - (Math.random() < 0.02 ? 0.08 : 0);
					grade.uniforms.uWeave.value.set((Math.random() - 0.5) * 0.0006, (Math.random() - 0.5) * 0.0009);
				}
				film.flicker += (film.flickerTarget - film.flicker) * Math.min(1, dt * 20);
				grade.uniforms.uFlicker.value = film.flicker;
				if (film.scratch <= 0 && Math.random() < dt * 0.25) {
					film.scratch = 0.2 + Math.random() * 0.8;
					film.scratchX = 0.1 + Math.random() * 0.8;
				}
				film.scratch -= dt;
				film.scratchX += (Math.random() - 0.5) * 0.002;
				grade.uniforms.uScratch.value.set(film.scratchX, film.scratch > 0 ? 0.6 + Math.random() * 0.4 : 0);
			}

			// If the frame rate can't keep up, step down: first full-resolution
			// rendering on high-density screens, then bloom and the candle
			// cluster's shadows. It only ever steps down, so it can't flicker.
			const quality = { level: 2, frameTime: 1 / 60, checkAt: 5 };
			function adaptQuality(rawDt, t) {
				if (rawDt < 0.2) quality.frameTime += (rawDt - quality.frameTime) * 0.05; // ignore stalls, like a hidden tab
				if (t < quality.checkAt || quality.level === 0) return;
				quality.checkAt = t + 3;
				if (quality.frameTime < 1 / 40) return;
				quality.level--;
				if (quality.level === 0) {
					bloom.enabled = false;
					clusterLight.castShadow = false;
				}
				resize();
			}

			// =====================================================================
			// Contact shadows
			// Soft dark patches where things meet the tabletop: the shadow maps are
			// too coarse to darken that last bit of contact. Things you can pick up
			// take their patch with them, and it fades as they're lifted.
			// =====================================================================

			const [contactCanvas, contactCtx] = makeCanvas(128, 128);
			const contactGradient = contactCtx.createRadialGradient(64, 64, 0, 64, 64, 64);
			contactGradient.addColorStop(0, "rgba(0, 0, 0, 0.8)");
			contactGradient.addColorStop(0.45, "rgba(0, 0, 0, 0.38)");
			contactGradient.addColorStop(1, "rgba(0, 0, 0, 0)");
			contactCtx.fillStyle = contactGradient;
			contactCtx.fillRect(0, 0, 128, 128);
			const contactTexture = new THREE.CanvasTexture(contactCanvas);
			const contactGeometry = new THREE.PlaneGeometry(1, 1).rotateX(-Math.PI / 2);
			const contactShadows = []; // { patch, object, strength, restY }

			function contactPatch(x, z, radius, strength) {
				const patch = new THREE.Mesh(
					contactGeometry,
					new THREE.MeshBasicMaterial({
						color: "#000",
						map: contactTexture,
						transparent: true,
						depthWrite: false,
						opacity: strength,
						polygonOffset: true,
						polygonOffsetFactor: -2,
					}),
				);
				patch.scale.setScalar(radius * 2);
				patch.position.set(x, 0.012, z);
				scene.add(patch);
				return patch;
			}

			function followingShadow(object, radius, strength, restY = object.position.y) {
				contactShadows.push({ patch: contactPatch(object.position.x, object.position.z, radius, strength), object, strength, restY });
			}

			contactPatch(0, 0, W * 0.92, 0.55);
			for (const candle of candleCluster.children) {
				if (!candle.material?.userData?.level) continue;
				candle.geometry.computeBoundingBox();
				contactPatch(candle.position.x, candle.position.z, candle.geometry.boundingBox.max.x * 1.1, 0.5);
			}
			contactPatch(jar.position.x, jar.position.z, 0.36, 0.45);
			contactPatch(bottle.position.x, bottle.position.z, 0.34, 0.5);
			contactPatch(doll.position.x, doll.position.z + 0.1, 0.42, 0.5);
			followingShadow(skull, 0.5, 0.55);
			followingShadow(apple, 0.24, 0.5);
			followingShadow(wineGlass, 0.18, 0.4);
			followingShadow(lidRoot, 0.6, 0.5, 0.06);
			followingShadow(jarLid, 0.28, 0.4, 0.04);
			for (const entry of interactives) {
				if (entry.body && !contactShadows.some((shadow) => shadow.object === entry.object) && entry.object !== jarLid) {
					const small = entry.object.children.length <= 2;
					followingShadow(entry.object, small ? 0.1 : 0.12, 0.4, small ? 0.08 : entry.object.position.y);
				}
			}

			function updateContactShadows() {
				for (const { patch, object, strength, restY } of contactShadows) {
					const { x, y, z } = object.position;
					const onTable = Math.abs(x) < 2 && z > tableBack && z < tableFront && y > -0.2;
					patch.visible = onTable;
					if (!onTable) continue;
					patch.position.set(x, 0.012, z);
					patch.material.opacity = strength * (1 - smoothstep(0, 0.8, y - restY));
				}
			}

			// =====================================================================
			// Sound
			// All synthesized with the Web Audio API, no files. Underneath, a low
			// beating drone; around it, wind that swells with the gusts that bend
			// the flames and sometimes moans, crickets and katydids that stop all
			// at once, an owl, a far-off bell, creaking wood, whispers just out of
			// view, laughter, a woman humming in the fog, the cat, footsteps in
			// the leaves behind you, and now and then a few soft notes from the
			// piano. Up close: candle crackle, the
			// cauldron, bats, the doll's music box, the rat, and knocks when
			// things land. Inside the pumpkin everything goes muffled and you can
			// hear a heartbeat.
			// Browsers only allow sound after an interaction, so it starts on the
			// first click, tap or key press. The button in the corner mutes.
			// =====================================================================

			const sounds = (() => {
				let ctx = null;
				let master;
				let reverb;
				let noise;
				let wind;
				let simmer;
				let muted = false;
				const crickets = [];
				let hushUntil = 0;
				let nextCrackle = 0;
				let nextBlup = 0;
				let nextOwl = 0;
				let nextSqueak = 0;
				let nextMusicBox = 0;
				let lastChatter = 0;
				let musicUntil = 0;
				let muffle;
				let drone;
				let nextMoan = 0;
				let nextWhisper = 0;
				let nextBell = 0;
				let nextCreak = 0;
				let nextBeat = 0;
				let nextSilence = 0;
				let nextLaugh = 0;
				let nextVoice = 0;
				let nextMeow = 0;
				let nextSteps = 0;
				let nextKatydid = 0;
				let katydidSide = 1;
				let nextPiano = 0;
				let songUntil = 0;
				let pianoWave;
				let pianoWarble; // a pitch wobble every piano string shares
				const pianoTuning = new Map(); // how far out of tune each key is, in cents
				const LULLABY = [69, 72, 76, 74, 72, 71, 69, 64, 69];
				const changed = []; // called when sound turns on or off
				const notify = () => changed.forEach((fn) => fn());
				const facing = new THREE.Vector3();
				const cauldronTop = cauldron.position.clone().setY(groundY + 2);

				// White, or brown (deep and rumbly, for wind and simmering).
				function noiseBuffer(seconds, brown) {
					const buffer = ctx.createBuffer(1, Math.floor(ctx.sampleRate * seconds), ctx.sampleRate);
					const data = buffer.getChannelData(0);
					let last = 0;
					for (let i = 0; i < data.length; i++) {
						const white = Math.random() * 2 - 1;
						last = (last + 0.02 * white) / 1.02;
						data[i] = brown ? last * 3.5 : white;
					}
					return buffer;
				}

				// Send a sound to the speakers (and some to the reverb), optionally
				// from a place in the scene so it pans and fades with distance.
				function route(node, { position = null, wet = 0.25, gain = 1, ref = 3 } = {}) {
					let tail = node.connect(ctx.createGain());
					tail.gain.value = gain;
					if (position) {
						const panner = new PannerNode(ctx, {
							panningModel: "HRTF",
							distanceModel: "inverse",
							refDistance: ref,
							rolloffFactor: 1.2,
							positionX: position.x,
							positionY: position.y,
							positionZ: position.z,
						});
						tail = tail.connect(panner);
					}
					tail.connect(master);
					if (wet) {
						const send = ctx.createGain();
						send.gain.value = wet;
						tail.connect(send);
						send.connect(reverb);
					}
					return tail;
				}

				function envelope(param, t, peak, attack, decay) {
					param.setValueAtTime(0.0001, t);
					param.exponentialRampToValueAtTime(peak, t + attack);
					param.exponentialRampToValueAtTime(0.0001, t + attack + decay);
				}

				// A short filtered noise burst: clicks, puffs, knocks.
				function burst({ position, filter, frequency, q = 1, peak, attack = 0.004, decay, wet = 0.2, ref = 3, delay = 0 }) {
					const t = ctx.currentTime + delay;
					const source = ctx.createBufferSource();
					source.buffer = noise;
					const shaped = ctx.createBiquadFilter();
					shaped.type = filter;
					shaped.frequency.value = frequency;
					shaped.Q.value = q;
					const level = ctx.createGain();
					envelope(level.gain, t, peak, attack, decay);
					source.connect(shaped).connect(level);
					route(level, { position, wet, ref });
					source.start(t, Math.random() * 1.5);
					source.stop(t + attack + decay + 0.05);
				}

				// A short tone, optionally gliding in pitch: blups, hoots, chimes.
				function tone({ position, type = "sine", from, to = from, glide = 0.1, peak, attack = 0.005, decay, wet = 0.3, ref = 3, delay = 0 }) {
					const t = ctx.currentTime + delay;
					const oscillator = ctx.createOscillator();
					oscillator.type = type;
					oscillator.frequency.setValueAtTime(from, t);
					if (to !== from) oscillator.frequency.exponentialRampToValueAtTime(to, t + glide);
					const level = ctx.createGain();
					envelope(level.gain, t, peak, attack, decay);
					oscillator.connect(level);
					route(level, { position, wet, ref });
					oscillator.start(t);
					oscillator.stop(t + attack + decay + 0.05);
				}

				function start() {
					if (ctx) {
						if (ctx.state === "suspended") ctx.resume();
						return;
					}
					ctx = new AudioContext();
					ctx.onstatechange = notify;
					const compressor = ctx.createDynamicsCompressor();
					compressor.connect(ctx.destination);
					// Everything passes through this; it closes down inside the pumpkin.
					muffle = ctx.createBiquadFilter();
					muffle.type = "lowpass";
					muffle.frequency.value = 18000;
					muffle.connect(compressor);
					master = ctx.createGain();
					master.gain.value = 0;
					master.gain.linearRampToValueAtTime(muted ? 0 : 0.9, ctx.currentTime + 4); // fade in
					master.connect(muffle);

					// A long, dark outdoor reverb from a decaying noise impulse.
					const length = Math.floor(ctx.sampleRate * 4.5);
					const impulse = ctx.createBuffer(2, length, ctx.sampleRate);
					for (let c = 0; c < 2; c++) {
						const data = impulse.getChannelData(c);
						for (let i = 0; i < length; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / length, 3);
					}
					reverb = ctx.createConvolver();
					reverb.buffer = impulse;
					const reverbReturn = ctx.createGain();
					reverbReturn.gain.value = 0.55;
					const darken = ctx.createBiquadFilter();
					darken.type = "lowpass";
					darken.frequency.value = 2200;
					reverb.connect(darken).connect(reverbReturn);
					reverbReturn.connect(master);
					noise = noiseBuffer(2, false);

					// Wind: brown noise through a band-pass that opens up in the gusts.
					const windSource = ctx.createBufferSource();
					windSource.buffer = noiseBuffer(8, true);
					windSource.loop = true;
					const band = ctx.createBiquadFilter();
					band.type = "bandpass";
					band.frequency.value = 350;
					band.Q.value = 0.7;
					const windLevel = ctx.createGain();
					windLevel.gain.value = 0.15;
					windSource.connect(band).connect(windLevel);
					route(windLevel, { wet: 0.15 });
					windSource.start();
					wind = { band, level: windLevel };

					// Crickets: three, off in the grass at different pitches.
					for (const [pan, pitch] of [
						[-0.75, 4300],
						[0.35, 4650],
						[0.85, 4050],
					]) {
						const oscillator = ctx.createOscillator();
						oscillator.frequency.value = pitch;
						const level = ctx.createGain();
						level.gain.value = 0;
						const panner = ctx.createStereoPanner();
						panner.pan.value = pan;
						oscillator.connect(level).connect(panner);
						route(panner, { wet: 0.5, gain: 0.01 });
						oscillator.start();
						crickets.push({ level, next: ctx.currentTime + Math.random() * 2, period: 0.55 + Math.random() * 0.35 });
					}

					// The cauldron simmers.
					const simmerSource = ctx.createBufferSource();
					simmerSource.buffer = noiseBuffer(4, true);
					simmerSource.loop = true;
					const low = ctx.createBiquadFilter();
					low.type = "lowpass";
					low.frequency.value = 260;
					simmer = ctx.createGain();
					simmer.gain.value = 0.4;
					simmerSource.connect(low).connect(simmer);
					route(simmer, { position: cauldronTop, wet: 0.3, ref: 4 });
					simmerSource.start();

					// Dread: two low tones a semitone apart, beating slowly against each
					// other, with a faint tritone above, breathing through a filter.
					const droneFilter = ctx.createBiquadFilter();
					droneFilter.type = "lowpass";
					droneFilter.frequency.value = 220;
					droneFilter.Q.value = 2;
					const droneLevel = ctx.createGain();
					droneLevel.gain.value = 0;
					for (const [frequency, type, level] of [
						[55, "sine", 1],
						[58.3, "sine", 0.8],
						[77.8, "triangle", 0.25],
						[155.6, "sine", 0.12],
					]) {
						const oscillator = ctx.createOscillator();
						oscillator.type = type;
						oscillator.frequency.value = frequency;
						const gain = ctx.createGain();
						gain.gain.value = level;
						oscillator.connect(gain).connect(droneFilter);
						oscillator.start();
					}
					droneFilter.connect(droneLevel);
					route(droneLevel, { wet: 0.5 });
					drone = { filter: droneFilter, level: droneLevel };

					const now = ctx.currentTime;
					nextOwl = now + 12 + Math.random() * 20;
					nextMusicBox = now + 60 + Math.random() * 60;
					nextMoan = now + 8 + Math.random() * 10;
					nextWhisper = now + 25 + Math.random() * 30;
					nextBell = now + 40 + Math.random() * 40;
					nextCreak = now + 10 + Math.random() * 20;
					nextSilence = now + 30 + Math.random() * 40;
					nextLaugh = now + 30 + Math.random() * 40;
					nextVoice = now + 50 + Math.random() * 50;
					nextMeow = now + 15 + Math.random() * 25;
					nextSteps = now + 60 + Math.random() * 60;
					nextKatydid = now + 3;
					nextPiano = now + 20 + Math.random() * 30;
					notify();
				}

				// A point a little way off, mostly behind you.
				function behind(distance) {
					camera.getWorldDirection(facing);
					const away = Math.atan2(-facing.x, -facing.z) + (Math.random() - 0.5) * 2.4;
					return camera.position.clone().add(new THREE.Vector3(Math.sin(away) * distance, Math.random() * 0.6 - 0.3, Math.cos(away) * distance));
				}

				// A voice: a buzzing throat (a sawtooth, with a little breath) through
				// three resonances of the mouth. pitch and vowels are [seconds,
				// value] steps to glide through; beats chops it into syllables
				// ([start, length] each), "ha-ha-ha".
				const VOWELS = { a: [800, 1150, 2900], o: [450, 800, 2830], u: [325, 700, 2530], i: [270, 2290, 3010], e: [400, 1700, 2600], m: [250, 1100, 2200] };
				function vocal({ at, ref = 4, wet = 0.5, gain = 0.3, length, pitch, vowels, beats = [[0, length]], vibrato = 5.5, breath = 0.2 }) {
					const t0 = ctx.currentTime + 0.02;
					const throat = ctx.createOscillator();
					throat.type = "sawtooth";
					throat.frequency.setValueAtTime(pitch[0][1], t0);
					for (const [t, f] of pitch) throat.frequency.linearRampToValueAtTime(f, t0 + t);
					const wobble = ctx.createOscillator();
					wobble.frequency.value = vibrato;
					const wobbleDepth = ctx.createGain();
					wobbleDepth.gain.value = 30; // cents
					wobble.connect(wobbleDepth).connect(throat.detune);
					const air = ctx.createBufferSource();
					air.buffer = noise;
					air.loop = true;
					const airLevel = ctx.createGain();
					airLevel.gain.value = breath;
					air.connect(airLevel);
					const mouth = ctx.createGain();
					mouth.gain.setValueAtTime(0, t0);
					[
						[1, 6],
						[0.5, 9],
						[0.25, 12],
					].forEach(([level, q], k) => {
						const formant = ctx.createBiquadFilter();
						formant.type = "bandpass";
						formant.Q.value = q;
						formant.frequency.setValueAtTime(VOWELS[vowels[0][1]][k], t0);
						for (const [t, v] of vowels) formant.frequency.linearRampToValueAtTime(VOWELS[v][k], t0 + t);
						const amount = ctx.createGain();
						amount.gain.value = level;
						throat.connect(formant);
						airLevel.connect(formant);
						formant.connect(amount).connect(mouth);
					});
					for (const [start, span] of beats) {
						mouth.gain.setValueAtTime(0, t0 + start);
						mouth.gain.linearRampToValueAtTime(1, t0 + start + Math.min(0.05, span * 0.3));
						mouth.gain.setTargetAtTime(0, t0 + start + span * 0.6, span * 0.15);
					}
					route(mouth, { position: at, ref, wet, gain });
					for (const node of [throat, wobble, air]) {
						node.start(t0, node === air ? Math.random() * 1.5 : 0);
						node.stop(t0 + length + 0.6);
					}
				}

				// Laughter: a witch's cackle far off in the trees, a low chuckle just
				// behind you, or a little girl's giggle from where the doll sits.
				function laugh() {
					const kind = Math.floor(Math.random() * 3);
					const count = [9, 5, 6][kind] + Math.floor(Math.random() * 4);
					const gap = [0.14, 0.22, 0.12][kind];
					const beats = Array.from({ length: count }, (_, i) => [i * gap * (1 + i * 0.04), gap * 0.75]);
					const length = beats[count - 1][0] + gap;
					const [high, low] = [
						[640, 380],
						[125, 82],
						[560, 720],
					][kind];
					const vowel = ["i", "o", "i"][kind];
					const at = [new THREE.Vector3(-30 + Math.random() * 60, 4, -25 - Math.random() * 15), behind(2.5), doll.userData.head.getWorldPosition(new THREE.Vector3())][kind];
					vocal({
						at,
						ref: [8, 1.5, 2][kind],
						wet: [0.8, 0.35, 0.55][kind],
						gain: [0.8, 0.4, 0.22][kind],
						length,
						pitch: [
							[0, high],
							[length, low],
						],
						vowels: [
							[0, vowel],
							[length, kind === 0 ? "a" : vowel],
						],
						beats,
						vibrato: [9, 4, 7][kind],
						breath: [0.35, 0.25, 0.4][kind],
					});
				}

				// Out in the fog: a woman humming the doll's lullaby, slow and low,
				// or a long wordless moan.
				function ghostVoice() {
					const at = new THREE.Vector3(-25 + Math.random() * 50, 2, -15 - Math.random() * 25);
					if (Math.random() < 0.5) {
						const notes = LULLABY.slice(0, 5 + Math.floor(Math.random() * 5));
						const step = 0.75;
						const length = notes.length * step;
						const pitch = notes.flatMap((note, i) => {
							const f = 440 * Math.pow(2, (note - 81) / 12);
							return [
								[i * step + 0.08, f],
								[(i + 0.85) * step, f],
							];
						});
						vocal({ at, ref: 8, wet: 0.85, gain: 0.55, length, pitch, vowels: [[0, "m"], [length * 0.6, "u"], [length, "m"]], vibrato: 5, breath: 0.3 });
					} else {
						vocal({
							at,
							ref: 8,
							wet: 0.85,
							gain: 0.5,
							length: 4.8,
							pitch: [
								[0, 170],
								[1.5, 235],
								[3, 205],
								[4.8, 140],
							],
							vowels: [
								[0, "u"],
								[1.5, "o"],
								[3, "a"],
								[4.8, "u"],
							],
							vibrato: 4.5,
							breath: 0.35,
						});
					}
				}

				// The cat, out among the stones: a meow, or the long yowl that
				// sounds like a baby crying. Startle it and it hisses.
				const catMouth = () => cat.userData.head.getWorldPosition(new THREE.Vector3());
				function meow() {
					const yowl = Math.random() < 0.4;
					const length = yowl ? 2.2 + Math.random() : 0.9 + Math.random() * 0.4;
					vocal({
						at: catMouth(),
						ref: 6,
						wet: 0.6,
						gain: 0.7,
						length,
						pitch: yowl
							? [
									[0, 520],
									[0.4, 820],
									[length * 0.6, 760],
									[length, 480],
								]
							: [
									[0, 600],
									[0.25, 820],
									[length, 500],
								],
						vowels: [
							[0, "m"],
							[0.15, "i"],
							[length * 0.45, "a"],
							[length * 0.8, "o"],
							[length, "u"],
						],
						vibrato: yowl ? 7 : 5,
						breath: 0.15,
					});
				}

				function hiss() {
					burst({ position: catMouth(), filter: "highpass", frequency: 3000, peak: 0.6, attack: 0.03, decay: 0.9, wet: 0.4, ref: 6 });
				}

				// Slow footsteps through dead leaves somewhere behind you, coming
				// closer... and then they stop.
				function footsteps() {
					camera.getWorldDirection(facing);
					const away = Math.atan2(-facing.x, -facing.z) + (Math.random() - 0.5) * 1.2;
					const steps = 5 + Math.floor(Math.random() * 4);
					for (let i = 0; i < steps; i++) {
						const distance = 10 - (i / steps) * 6;
						const at = camera.position.clone().add(new THREE.Vector3(Math.sin(away) * distance, -1.5, Math.cos(away) * distance));
						const delay = i * (0.62 + Math.random() * 0.12);
						burst({ position: at, filter: "lowpass", frequency: 300, peak: 0.5, attack: 0.005, decay: 0.09, wet: 0.3, ref: 2, delay });
						for (let k = 0; k < 6; k++) {
							burst({ position: at, filter: "bandpass", frequency: 2000 + Math.random() * 3000, q: 1.5, peak: 0.12 + Math.random() * 0.18, attack: 0.002, decay: 0.02 + Math.random() * 0.03, wet: 0.25, ref: 2, delay: delay + 0.02 + Math.random() * 0.15 });
						}
					}
				}

				// The old piano, a little out of tune: each note is two strings a few
				// cents apart, bright when struck and mellowing as it rings, with the
				// thump of the hammer.
				function pianoNote(midi, { delay = 0, velocity = 0.5, length = 4, ref = 6, spread = 3 } = {}) {
					if (!pianoWave) {
						const real = new Float32Array(24);
						const imag = real.map((_, n) => (n ? Math.pow(n, -1.1) * (n === 7 || n === 8 ? 0.3 : 1) : 0));
						pianoWave = ctx.createPeriodicWave(real, imag);
					}
					if (!pianoWarble) {
						// Everything it plays is flat and wobbles in pitch, slow swoops and
						// a faster flutter, like a record played too slow.
						pianoWarble = ctx.createGain();
						for (const [rate, cents] of [
							[0.09, 60],
							[0.31, 30],
							[4.5, 7],
						]) {
							const lfo = ctx.createOscillator();
							lfo.frequency.value = rate;
							const depth = ctx.createGain();
							depth.gain.value = cents;
							lfo.connect(depth).connect(pianoWarble);
							lfo.start();
						}
					}
					if (!pianoTuning.has(midi)) pianoTuning.set(midi, (Math.random() - 0.5) * 30);
					const t = ctx.currentTime + delay;
					const frequency = 440 * Math.pow(2, (midi - 69) / 12);
					const ring = Math.max(0.45, Math.min(length, 1.5 + 4 * Math.sqrt(220 / frequency)));
					const tone = ctx.createBiquadFilter();
					tone.type = "lowpass";
					tone.frequency.setValueAtTime(Math.min(16000, frequency * (3 + 10 * velocity)), t);
					tone.frequency.exponentialRampToValueAtTime(Math.max(250, frequency * 1.5), t + ring * 0.6);
					const level = ctx.createGain();
					level.gain.setValueAtTime(0.0001, t);
					level.gain.exponentialRampToValueAtTime(velocity * 0.22, t + 0.006);
					level.gain.exponentialRampToValueAtTime(velocity * 0.07, t + 0.35);
					level.gain.exponentialRampToValueAtTime(0.0001, t + ring);
					for (const side of [-1, 1]) {
						const string = ctx.createOscillator();
						string.setPeriodicWave(pianoWave);
						string.frequency.value = frequency;
						string.detune.value = pianoTuning.get(midi) + side * spread - 180;
						pianoWarble.connect(string.detune);
						string.onended = () => pianoWarble.disconnect(string.detune);
						string.connect(tone);
						string.start(t);
						string.stop(t + ring + 0.1);
