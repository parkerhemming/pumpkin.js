					}
					tone.connect(level);
					const at = piano.userData.soundAt;
					route(level, { position: at, wet: 0.45, ref });
					burst({ position: at, filter: "lowpass", frequency: frequency * 2 + 300, peak: velocity * 0.18, attack: 0.001, decay: 0.03, wet: 0.2, ref, delay });
				}

				// Click the piano: an old saloon rag, the first strain of Joplin's
				// "The Entertainer", jangly on strings long out of tune. The tune is
				// [note, sixteenths] (0 for a rest), starting two sixteenths before
				// the first bar. The left hand strides, a bass note then a chord on
				// each beat (two to a bar): the root, or the fifth when the chord
				// carries on from the beat before.
				const RAG_TUNE = [
					[74, 1], [75, 1],
					[76, 1], [84, 2], [76, 1], [84, 2], [76, 1], [84, 3],
					[84, 1], [86, 1], [87, 1], [88, 1], [84, 1], [86, 1],
					[88, 2], [83, 1], [86, 2], [84, 3],
					[0, 6], [74, 1], [75, 1],
					[76, 1], [84, 2], [76, 1], [84, 2], [76, 1], [84, 3],
					[81, 1], [79, 1], [78, 1], [81, 1], [84, 1], [88, 2],
					[86, 1], [84, 1], [81, 1], [86, 4],
					[0, 6], [74, 1], [75, 1],
					[76, 1], [84, 2], [76, 1], [84, 2], [76, 1], [84, 3],
					[84, 1], [86, 1], [87, 1], [88, 1], [84, 1], [86, 1],
					[88, 2], [83, 1], [86, 2], [84, 3],
				];
				const RAG_CHORDS = "C C C C G7 C C C C C C D7 D7 D7 G7 G7 C C C C G7 C".split(" ");
				const STRIDE = { C: [36, 43, [52, 55, 60]], G7: [43, 38, [53, 59, 62]], D7: [38, 45, [54, 57, 60]] }; // root, fifth, chord

				// Both hands as [time, note, velocity, length], at a given sixteenth.
				function ragNotes(sixteenth) {
					const tune = [];
					let at = -2;
					for (const [note, length] of RAG_TUNE) {
						if (note) tune.push([at * sixteenth, note, 0.34, length * sixteenth + 0.3]);
						at += length;
					}
					const left = [];
					RAG_CHORDS.forEach((name, beat) => {
						const [root, fifth, chord] = STRIDE[name];
						const t = beat * 4 * sixteenth;
						const bass = beat % 2 && RAG_CHORDS[beat - 1] === name ? fifth : root;
						left.push([t, bass, 0.26, 3.5 * sixteenth], [t, bass + 12, 0.13, 3.5 * sixteenth]);
						for (const note of chord) left.push([t + 2 * sixteenth, note, 0.13, 1.8 * sixteenth]);
					});
					return { tune, left, end: RAG_CHORDS.length * 4 * sixteenth };
				}

				function playRag(notes, start, spread) {
					for (const [time, note, velocity, length] of notes) {
						// Handed to the audio clock a moment ahead, so it isn't flooded all at once.
						setTimeout(() => pianoNote(note, { delay: Math.max(0, start + time - ctx.currentTime), velocity, length, spread }), Math.max(0, (start + time - ctx.currentTime - 0.6) * 1000));
					}
				}

				function pianoSong() {
					if (ctx.currentTime < songUntil) return;
					const { tune, left, end } = ragNotes(0.28); // slow, like a music box winding down
					const octaves = tune.map(([time, note, velocity, length]) => [time + 0.004, note + 12, velocity * 0.35, length]);
					const ending = [36, 48, 52, 55, 60, 72, 84].map((note) => [end, note, 0.3, 5]);
					const start = ctx.currentTime + 0.4;
					playRag([...tune, ...octaves, ...left, ...ending], start, 12);
					songUntil = start + end + 3;
				}

				// Now and then, softly and slower, a couple of bars of the tune, as
				// if someone were picking it out in the dark.
				function pianoDrift() {
					if (ctx.currentTime < songUntil) return;
					const sixteenth = 0.4;
					const from = Math.floor(Math.random() * 10) * 8 * sixteenth;
					const bars = ragNotes(sixteenth).tune.filter(([time]) => time >= from && time < from + 16 * sixteenth);
					const start = ctx.currentTime + 0.1 - from;
					playRag(bars.map(([time, note, , length]) => [time, note, 0.1 + Math.random() * 0.05, length]), start, 9);
				}

				// Both forearms brought down hard on the keys.
				function pianoSlam() {
					if (muted) return;
					for (let i = 0; i < 14; i++) pianoNote(24 + Math.floor(Math.random() * 30), { delay: Math.random() * 0.03, velocity: 0.9 + Math.random() * 0.1, length: 6, ref: 14 });
					burst({ position: piano.userData.soundAt, filter: "lowpass", frequency: 180, peak: 1, attack: 0.002, decay: 0.4, wet: 0.5, ref: 14 });
				}

				// A drawer dragged along dry runners: a rasp for each bit it moves,
				// and a knock when it hits a stop.
				function scrape(position) {
					burst({ position, filter: "bandpass", frequency: 550 + Math.random() * 200, q: 1.2, peak: 0.15 + Math.random() * 0.2, attack: 0.005, decay: 0.06, wet: 0.25, ref: 2 });
				}

				function knock(position) {
					burst({ position, filter: "bandpass", frequency: 700, q: 1.2, peak: 0.5, attack: 0.002, decay: 0.08, ref: 2 });
					tone({ position, from: 160, to: 120, glide: 0.08, peak: 0.4, attack: 0.002, decay: 0.12, ref: 2 });
				}

				// The rat: a squeak or two, and the patter of its claws on the boards.
				function squeak(position) {
					for (let i = 0, count = 1 + Math.floor(Math.random() * 3); i < count; i++) {
						tone({ position, from: 3200 + Math.random() * 1500, to: 2600 + Math.random() * 800, glide: 0.06, peak: 0.12, attack: 0.005, decay: 0.07, wet: 0.2, ref: 1.5, delay: i * 0.12 });
					}
				}

				function patter(position) {
					burst({ position, filter: "bandpass", frequency: 4000 + Math.random() * 2000, q: 3, peak: 0.1, attack: 0.001, decay: 0.012, wet: 0.1, ref: 1 });
				}

				// Wind that rises into a moan: noise through a narrow, gliding filter.
				function moan() {
					const t = ctx.currentTime;
					const length = 4 + Math.random() * 4;
					const pitch = 240 + Math.random() * 140;
					const source = ctx.createBufferSource();
					source.buffer = noise;
					source.loop = true;
					const band = ctx.createBiquadFilter();
					band.type = "bandpass";
					band.Q.value = 10 + Math.random() * 6;
					band.frequency.setValueAtTime(pitch, t);
					band.frequency.exponentialRampToValueAtTime(pitch * (1.5 + Math.random() * 0.6), t + length * 0.45);
					band.frequency.exponentialRampToValueAtTime(pitch * 0.8, t + length);
					const level = ctx.createGain();
					level.gain.setValueAtTime(0.0001, t);
					level.gain.exponentialRampToValueAtTime(0.5, t + length * 0.4);
					level.gain.exponentialRampToValueAtTime(0.0001, t + length);
					const pan = ctx.createStereoPanner();
					const side = Math.random() * 1.6 - 0.8;
					pan.pan.setValueAtTime(side, t);
					pan.pan.linearRampToValueAtTime(-side * 0.5, t + length);
					source.connect(band).connect(level).connect(pan);
					route(pan, { wet: 0.6 });
					source.start(t, Math.random() * 1.5);
					source.stop(t + length + 0.1);
				}

				// Whispering: breathy noise shaped into syllables by two moving
				// formant filters, from somewhere close behind or beside you.
				function whisper() {
					const t0 = ctx.currentTime;
					const source = ctx.createBufferSource();
					source.buffer = noise;
					source.loop = true;
					const high = ctx.createBiquadFilter();
					high.type = "highpass";
					high.frequency.value = 400;
					const formants = [ctx.createBiquadFilter(), ctx.createBiquadFilter()];
					const voice = ctx.createGain();
					source.connect(high);
					for (const formant of formants) {
						formant.type = "bandpass";
						formant.Q.value = 7;
						high.connect(formant).connect(voice);
					}
					let t = t0;
					voice.gain.setValueAtTime(0.0001, t);
					for (let i = 0, syllables = 6 + Math.floor(Math.random() * 10); i < syllables; i++) {
						const length = 0.07 + Math.random() * 0.13;
						formants[0].frequency.setValueAtTime(400 + Math.random() * 600, t);
						formants[1].frequency.setValueAtTime(1100 + Math.random() * 1500, t);
						voice.gain.exponentialRampToValueAtTime(0.5 + Math.random() * 0.5, t + 0.02);
						voice.gain.exponentialRampToValueAtTime(0.02, t + length);
						t += length + (Math.random() < 0.2 ? 0.15 + Math.random() * 0.25 : 0.01);
					}
					voice.gain.exponentialRampToValueAtTime(0.0001, t + 0.1);
					route(voice, { position: behind(2.5), wet: 0.5, gain: 0.3, ref: 1.5 });
					source.start(t0, Math.random() * 1.5);
					source.stop(t + 0.2);
				}

				// A church bell somewhere off in the fog, three slow tolls.
				function bell() {
					const at = new THREE.Vector3(-40, 10, -90);
					for (let toll = 0; toll < 3; toll++) {
						for (const [ratio, peak, decay] of [
							[0.5, 0.3, 7],
							[1, 0.25, 5],
							[1.183, 0.12, 3.5],
							[1.506, 0.1, 3],
							[2, 0.08, 2.5],
							[2.514, 0.05, 2],
							[2.662, 0.04, 1.8],
							[3.011, 0.03, 1.4],
						]) {
							tone({ position: at, from: 196 * ratio, peak, attack: 0.004, decay, wet: 0.8, ref: 20, delay: toll * 4.2 });
						}
					}
				}

				// Old wood under strain: a rough tone that sticks and slips.
				function creak(position) {
					const t = ctx.currentTime;
					const length = 0.5 + Math.random() * 0.9;
					const pitch = new Float32Array(24).map((_, i) => 70 + i * 1.5 + Math.random() * 25);
					const grip = new Float32Array(24).map(() => (Math.random() < 0.7 ? 0.05 + Math.random() * 0.3 : 0.001));
					grip[0] = grip[23] = 0.0001;
					const oscillator = ctx.createOscillator();
					oscillator.type = "sawtooth";
					oscillator.frequency.setValueCurveAtTime(pitch, t, length);
					const band = ctx.createBiquadFilter();
					band.type = "bandpass";
					band.frequency.value = 850;
					band.Q.value = 3;
					const level = ctx.createGain();
					level.gain.setValueCurveAtTime(grip, t, length);
					oscillator.connect(band).connect(level);
					route(level, { position, wet: 0.35, ref: 2.5 });
					oscillator.start(t);
					oscillator.stop(t + length + 0.05);
				}

				// The jump scare: a screeching cluster sliding upward, a blast of noise
				// and a deep hit, all at once.
				function scream() {
					if (!ctx || muted) return;
					const t = ctx.currentTime;
					for (const frequency of [520, 553, 741, 1046, 1480]) {
						const oscillator = ctx.createOscillator();
						oscillator.type = "sawtooth";
						oscillator.frequency.setValueAtTime(frequency, t);
						oscillator.frequency.exponentialRampToValueAtTime(frequency * 1.35, t + 0.7);
						const level = ctx.createGain();
						envelope(level.gain, t, 0.16, 0.01, 1.1);
						oscillator.connect(level);
						route(level, { wet: 0.4 });
						oscillator.start(t);
						oscillator.stop(t + 1.2);
					}
					burst({ filter: "highpass", frequency: 1500, peak: 0.9, attack: 0.003, decay: 0.5, wet: 0.4 });
					tone({ from: 90, to: 30, glide: 0.4, peak: 1, attack: 0.003, decay: 0.6, wet: 0.3 });
				}

				// The spider swarm: dozens of tiny legs clicking all around you, and a hiss.
				function skitter() {
					if (!ctx || muted) return;
					for (let i = 0; i < 90; i++) {
						const around = camera.position.clone().add(new THREE.Vector3(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5).multiplyScalar(1.2));
						burst({ position: around, filter: "bandpass", frequency: 2500 + Math.random() * 3500, q: 4, peak: 0.25 + Math.random() * 0.25, attack: 0.001, decay: 0.012, wet: 0.05, ref: 0.5, delay: Math.random() * 2.2 });
					}
					burst({ filter: "highpass", frequency: 4000, peak: 0.4, attack: 0.01, decay: 0.7, wet: 0.3 });
				}

				// The cauldron boiling over: a heavy gush and a run of big bubbles.
				function pour() {
					if (!ctx) return;
					const t = ctx.currentTime;
					const source = ctx.createBufferSource();
					source.buffer = noise;
					source.loop = true;
					const low = ctx.createBiquadFilter();
					low.type = "lowpass";
					low.frequency.setValueAtTime(250, t);
					low.frequency.exponentialRampToValueAtTime(700, t + 1);
					low.frequency.exponentialRampToValueAtTime(220, t + 4);
					const level = ctx.createGain();
					level.gain.setValueAtTime(0.0001, t);
					level.gain.exponentialRampToValueAtTime(0.7, t + 0.4);
					level.gain.exponentialRampToValueAtTime(0.0001, t + 4.5);
					source.connect(low).connect(level);
					route(level, { position: cauldronTop, wet: 0.4, ref: 4 });
					source.start(t, Math.random());
					source.stop(t + 4.6);
					for (let i = 0; i < 12; i++) {
						const frequency = 80 + Math.random() * 80;
						tone({ position: cauldronTop, from: frequency, to: frequency * (2.5 + Math.random()), glide: 0.09, peak: 0.6, attack: 0.01, decay: 0.16, wet: 0.4, ref: 4, delay: i * 0.12 + Math.random() * 0.1 });
					}
				}

				// Lub-dub, felt more than heard.
				function heartbeat() {
					tone({ from: 62, to: 38, glide: 0.1, peak: 0.7, attack: 0.008, decay: 0.18, wet: 0.05 });
					tone({ from: 55, to: 34, glide: 0.1, peak: 0.45, attack: 0.008, decay: 0.2, wet: 0.05, delay: 0.22 });
				}

				// A slightly out-of-tune lullaby from the doll, slowing down as if
				// the spring were running out.
				function musicBox() {
					if (!ctx || ctx.currentTime < musicUntil) return;
					musicUntil = ctx.currentTime + 8;
					const at = doll.userData.head.getWorldPosition(new THREE.Vector3());
					let delay = 0;
					LULLABY.forEach((note, i) => {
						const wobble = 1 + 0.015 * Math.sin(i * 1.7); // the drum turning unevenly
						const frequency = 880 * wobble * Math.pow(2, (note - 69 + (Math.random() - 0.5) * 0.7 - i * 0.04) / 12);
						for (const [ratio, peak] of [
							[1, 0.12],
							[3.01, 0.04],
							[5.4, 0.015],
						]) {
							tone({ position: at, from: frequency * ratio, peak, attack: 0.003, decay: 1.4 / ratio, wet: 0.55, ref: 2.5, delay });
						}
						delay += 0.4 * Math.pow(1.16, i);
					});
				}

				function puff(position) {
					if (!ctx) return;
					burst({ position, filter: "bandpass", frequency: 1100, q: 0.8, peak: 0.6, attack: 0.02, decay: 0.35, wet: 0.2, ref: 2 });
					burst({ position, filter: "highpass", frequency: 3500, peak: 0.12, attack: 0.05, decay: 0.8, wet: 0.3, ref: 2 });
				}

				// The crickets fall silent while the witch goes over, and a gust
				// sweeps across.
				function witchPasses() {
					if (!ctx) return;
					const t = ctx.currentTime;
					hushUntil = t + 10 + Math.random() * 6;
					const source = ctx.createBufferSource();
					source.buffer = noise;
					source.loop = true;
					const band = ctx.createBiquadFilter();
					band.type = "bandpass";
					band.Q.value = 1.2;
					band.frequency.setValueAtTime(250, t);
					band.frequency.exponentialRampToValueAtTime(1100, t + 5);
					band.frequency.exponentialRampToValueAtTime(250, t + 11);
					const level = ctx.createGain();
					level.gain.setValueAtTime(0.0001, t);
					level.gain.exponentialRampToValueAtTime(0.12, t + 5);
					level.gain.exponentialRampToValueAtTime(0.0001, t + 12);
					const pan = ctx.createStereoPanner();
					pan.pan.setValueAtTime(0.9, t);
					pan.pan.linearRampToValueAtTime(-0.9, t + 12);
					source.connect(band).connect(level).connect(pan);
					route(pan, { wet: 0.4 });
					source.start(t);
					source.stop(t + 12.5);
				}

				// Landing sounds, by what landed.
				const knocks = {
					wood: (p, s) => {
						burst({ position: p, filter: "bandpass", frequency: 700, q: 1.2, peak: s, attack: 0.002, decay: 0.08, ref: 2 });
						tone({ position: p, from: 160, to: 120, glide: 0.08, peak: s * 0.8, attack: 0.002, decay: 0.12, ref: 2 });
					},
					pumpkin: (p, s) => {
						tone({ position: p, from: 95, to: 70, glide: 0.15, peak: s, attack: 0.003, decay: 0.22, ref: 2 });
						burst({ position: p, filter: "lowpass", frequency: 320, peak: s * 0.8, attack: 0.002, decay: 0.1, ref: 2 });
					},
					thud: (p, s) => {
						burst({ position: p, filter: "lowpass", frequency: 420, peak: s, attack: 0.002, decay: 0.07, ref: 2 });
						tone({ position: p, from: 140, to: 100, glide: 0.05, peak: s * 0.6, attack: 0.002, decay: 0.07, ref: 2 });
					},
					bone: (p, s) => {
						burst({ position: p, filter: "bandpass", frequency: 1500, q: 2, peak: s, attack: 0.001, decay: 0.05, ref: 2 });
						tone({ position: p, from: 420, to: 380, glide: 0.05, peak: s * 0.5, attack: 0.002, decay: 0.08, ref: 2 });
					},
					glass: (p, s) => {
						tone({ position: p, from: 2350, peak: s * 0.25, attack: 0.001, decay: 0.6, ref: 2, wet: 0.4 });
						tone({ position: p, from: 3720, peak: s * 0.15, attack: 0.001, decay: 0.4, ref: 2, wet: 0.4 });
					},
					metal: (p, s) => {
						for (const frequency of [1150, 1730, 2610]) tone({ position: p, from: frequency, peak: s * 0.2, attack: 0.001, decay: 0.35, ref: 2, wet: 0.35 });
						burst({ position: p, filter: "bandpass", frequency: 900, peak: s * 0.5, attack: 0.001, decay: 0.04, ref: 2 });
					},
					squish: (p, s) => {
						burst({ position: p, filter: "lowpass", frequency: 600, peak: s * 0.8, attack: 0.003, decay: 0.06, ref: 2 });
						tone({ position: p, from: 300, to: 170, glide: 0.05, peak: s * 0.4, attack: 0.002, decay: 0.05, ref: 2 });
					},
					tick: (p, s) => burst({ position: p, filter: "bandpass", frequency: 3200, q: 2, peak: s * 0.7, attack: 0.001, decay: 0.025, ref: 2 }),
				};

				function impact(object, speed, kind) {
					if (!ctx || ctx.state !== "running") return;
					knocks[kind](object.position.clone(), clamp((speed - 1.5) / 10, 0.05, 0.9));
				}

				function setMuted(value) {
					muted = value;
					if (ctx) master.gain.setTargetAtTime(muted ? 0 : 0.9, ctx.currentTime, 0.2);
					notify();
				}

				const playing = () => !!ctx && ctx.state === "running" && !muted;

				function update() {
					if (!ctx || ctx.state !== "running") return;
					const now = ctx.currentTime;

					// The listener is the camera.
					camera.getWorldDirection(facing);
					const listener = ctx.listener;
					if (listener.positionX) {
						listener.positionX.value = camera.position.x;
						listener.positionY.value = camera.position.y;
						listener.positionZ.value = camera.position.z;
						listener.forwardX.value = facing.x;
						listener.forwardY.value = facing.y;
						listener.forwardZ.value = facing.z;
						listener.upX.value = 0;
						listener.upY.value = 1;
						listener.upZ.value = 0;
					} else {
						listener.setPosition(camera.position.x, camera.position.y, camera.position.z);
						listener.setOrientation(facing.x, facing.y, facing.z, 0, 1, 0);
					}

					// Wind swells with the same gusts that bend the flames.
					const windLevel = 0.1 + 0.05 * Math.sin(now * 0.13) + 0.04 * Math.sin(now * 0.37 + 1) + gust * 2.2;
					wind.level.gain.setTargetAtTime(windLevel, now, 0.4);
					wind.band.frequency.setTargetAtTime(280 + windLevel * 900, now, 0.5);

					// Crickets: three-pulse chirps, scheduled a little ahead.
					for (const cricket of crickets) {
						cricket.next = Math.max(cricket.next, now);
						while (cricket.next < now + 0.25) {
							if (cricket.next > hushUntil) {
								for (let pulse = 0; pulse < 3; pulse++) {
									const t = cricket.next + pulse * 0.045;
									cricket.level.gain.setValueAtTime(0, t);
									cricket.level.gain.linearRampToValueAtTime(1, t + 0.008);
									cricket.level.gain.linearRampToValueAtTime(0, t + 0.032);
								}
							}
							cricket.next += cricket.period * (0.85 + Math.random() * 0.3) + (Math.random() < 0.05 ? 2 + Math.random() * 3 : 0);
						}
					}

					// Lit wicks crackle now and then; you hear the near ones.
					const litFlames = flames.filter((entry) => entry.on);
					if (litFlames.length && now > nextCrackle) {
						const position = litFlames[Math.floor(Math.random() * litFlames.length)].mesh.getWorldPosition(new THREE.Vector3());
						burst({ position, filter: "highpass", frequency: 2200, peak: 0.15 + Math.random() * 0.35, attack: 0.002, decay: 0.012 + Math.random() * 0.03, wet: 0.08, ref: 1.5 });
						nextCrackle = now + 0.15 + Math.random() * (2.5 / litFlames.length);
					}

					// The cauldron bubbles, faster when stirred up.
					simmer.gain.setTargetAtTime(0.4 + cauldronSurge * 0.4, now, 0.3);
					if (now > nextBlup) {
						const frequency = 120 + Math.random() * 160;
						tone({ position: cauldronTop, from: frequency, to: frequency * (2 + Math.random()), glide: 0.07, peak: 0.5, attack: 0.008, decay: 0.12, wet: 0.35, ref: 4 });
						nextBlup = now + (0.15 + Math.random() * 0.5) / (1 + cauldronSurge * 2);
					}

					// An owl in the big tree.
					if (now > nextOwl) {
						const at = bigTree.clone().setY(groundY + 15);
						for (const [delay, length] of [
							[0, 0.45],
							[0.75, 0.22],
							[1.05, 0.5],
						]) {
							tone({ position: at, from: 360, to: 330, glide: length, peak: 0.25, attack: 0.06, decay: length, wet: 0.7, ref: 10, delay });
						}
						nextOwl = now + 25 + Math.random() * 35;
					}

					// Bats squeak as they pass.
					if (flock && now > nextSqueak) {
						const passing = flock.bats.filter(({ bat }) => bat.visible);
						if (passing.length) {
							const { bat } = passing[Math.floor(Math.random() * passing.length)];
							tone({ position: bat.position.clone(), from: 9000 + Math.random() * 2500, to: 5500, glide: 0.03, peak: 0.12, attack: 0.003, decay: 0.04, wet: 0.2, ref: 3 });
						}
						nextSqueak = now + 0.05 + Math.random() * 0.2;
					}

					// The skull's teeth clatter while its jaw chatters.
					if (jawChatter > 0 && now - lastChatter > 0.075) {
						lastChatter = now;
						burst({ position: skull.position.clone(), filter: "bandpass", frequency: 2600, q: 3, peak: 0.6, attack: 0.001, decay: 0.03, wet: 0.15, ref: 2 });
					}

					// Every so often, unprompted, the music box.
					if (now > nextMusicBox) {
						musicBox();
						nextMusicBox = now + 80 + Math.random() * 60;
					}

					// The drone breathes: slowly louder and softer, darker and brighter.
					drone.level.gain.setTargetAtTime(0.05 + 0.035 * (0.5 + 0.5 * Math.sin(now * 0.07)), now, 2);
					drone.filter.frequency.setTargetAtTime(150 + 90 * (0.5 + 0.5 * Math.sin(now * 0.05)) + 40 * Math.sin(now * 0.13), now, 2);

					if (now > nextMoan) {
						moan();
						nextMoan = now + 12 + Math.random() * 20;
					}
					if (now > nextWhisper) {
						whisper();
						nextWhisper = now + 45 + Math.random() * 60;
					}
					if (now > nextBell) {
						bell();
						nextBell = now + 90 + Math.random() * 90;
					}
					if (now > nextCreak) {
						const fromTable = Math.random() < 0.6;
						creak(fromTable ? new THREE.Vector3(Math.random() * 4 - 2, -0.3, 0) : bigTree.clone().setY(groundY + 12));
						nextCreak = now + 15 + Math.random() * 30;
					}
					// Now and then the crickets all stop at once.
					if (now > nextSilence) {
						hushUntil = Math.max(hushUntil, now + 5 + Math.random() * 5);
						nextSilence = now + 40 + Math.random() * 50;
					}
					// Katydids rasp back and forth across the dark, and hush with the crickets.
					if (now > nextKatydid) {
						if (now > hushUntil) {
							katydidSide = -katydidSide;
							const at = new THREE.Vector3(katydidSide * (8 + Math.random() * 6), groundY + 1, -6 - Math.random() * 8);
							for (let i = 0, count = 2 + Math.floor(Math.random() * 2); i < count; i++) {
								burst({ position: at, filter: "bandpass", frequency: 5500 + Math.random() * 800, q: 2.5, peak: 0.08, attack: 0.01, decay: 0.07, wet: 0.35, ref: 3, delay: i * 0.16 });
							}
						}
						nextKatydid = now + (Math.random() < 0.75 ? 0.9 + Math.random() * 0.6 : 6 + Math.random() * 10);
					}
					if (now > nextLaugh) {
						laugh();
						nextLaugh = now + 70 + Math.random() * 80;
					}
					if (now > nextVoice) {
						ghostVoice();
						nextVoice = now + 80 + Math.random() * 90;
					}
					if (now > nextMeow) {
						meow();
						nextMeow = now + 35 + Math.random() * 60;
					}
					if (now > nextSteps) {
						footsteps();
						nextSteps = now + 90 + Math.random() * 120;
					}
					if (now > nextPiano) {
						pianoDrift();
						nextPiano = now + 35 + Math.random() * 60;
					}

					// Inside the pumpkin: muffled, and a heartbeat.
					const inside = camera.position.distanceTo(pumpkinCenter) < Math.min(W, H) * 0.95;
					muffle.frequency.setTargetAtTime(inside ? 650 : 18000, now, 0.25);
					if (inside && now > nextBeat) {
						heartbeat();
						nextBeat = now + 1.05;
					}
				}

				// For things that happen in the scene: only once sound is running.
				const live =
					(fn) =>
					(...args) =>
						ctx?.state === "running" && fn(...args);

				return {
					start,
					update,
					puff,
					impact,
					musicBox,
					witchPasses,
					scream,
					skitter,
					pour,
					hiss: live(hiss),
					pianoSong: live(pianoSong),
					pianoSlam: live(pianoSlam),
					scrape: live(scrape), knock: live(knock),
					squeak: live(squeak),
					patter: live(patter),
					setMuted,
					playing,
					started: () => !!ctx,
					muted: () => muted,
					onChange: (fn) => changed.push(fn),
				};
			})();

			for (const type of ["pointerdown", "keydown", "touchstart"]) {
				addEventListener(type, (event) => event.target !== soundButton && !soundButton.contains(event.target) && sounds.start(), { capture: true });
			}

			// Sound on/off, top right.
			const SPEAKER = '<path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/>';
			const WAVES = '<path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>';
			const CROSS = '<path d="M16.5 9.5l5 5m0-5l-5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>';
			const soundButton = document.createElement("button");
			Object.assign(soundButton.style, {
				position: "fixed",
				top: "14px",
				right: "14px",
				width: "42px",
				height: "42px",
				padding: "0",
				display: "grid",
				placeItems: "center",
				borderRadius: "50%",
				border: "1px solid rgba(255, 190, 120, 0.25)",
				background: "rgba(12, 10, 8, 0.55)",
				color: "#e8d2b0",
				cursor: "pointer",
				backdropFilter: "blur(4px)",
			});
			function updateSoundButton() {
				const on = sounds.playing();
				// The drawing spans x 4 to about 22, so shift the view box to center it.
				soundButton.innerHTML = `<svg width="22" height="22" viewBox="${on ? 0.9 : 1.15} 0 24 24" style="display: block" aria-hidden="true">${SPEAKER}${on ? WAVES : CROSS}</svg>`;
				soundButton.title = on ? "Mute sound" : "Turn sound on";
				soundButton.setAttribute("aria-label", soundButton.title);
			}
			soundButton.addEventListener("click", () => {
				if (!sounds.started()) sounds.start();
				else sounds.setMuted(!sounds.muted());
			});
			document.body.appendChild(soundButton);
			sounds.onChange(updateSoundButton);
			updateSoundButton();

			// What each thing sounds like when it lands.
			const impactKinds = new Map([
				[lidRoot, "pumpkin"],
				[apple, "thud"],
				[skull, "bone"],
				[wineGlass, "glass"],
				[jarLid, "metal"],
				...eyeballs.map(({ look }) => [look.parent, "squish"]),
			]);

			// =====================================================================
			// The cauldron: stirring, and boiling over
			// A gnarled stick stirs the potion on its own, faster when it's worked
			// up. Click it and the potion froths up over the rim and runs down the
			// sides in glossy rivulets that thin as they stretch and bead where
			// they slow. Drips fall from the belly of the pot, and a puddle spreads
			// where each rivulet reaches the ground. Then it drains away and the
			// puddles shrink back to nothing.
			// =====================================================================

			// Glowing slime: glossy, with its glow flowing along each rivulet in streaks.
			const slimeMaterial = new THREE.MeshPhysicalMaterial({
				color: "#123d10",
				emissive: "#46ff3c",
				emissiveIntensity: 0.95,
				roughness: 0.18,
				clearcoat: 1,
				clearcoatRoughness: 0.1,
				side: THREE.DoubleSide,
			});
			// Spread thin on the ground it glows less, and the wet surface shows.
			const puddleMaterial = new THREE.MeshPhysicalMaterial({
				color: "#061505",
				emissive: "#3cff36",
				emissiveIntensity: 0.32,
				roughness: 0.1,
				clearcoat: 1,
				clearcoatRoughness: 0.05,
			});
			slimeMaterial.onBeforeCompile = (shader) => {
				shader.uniforms.uTime = envTime;
				shader.vertexShader = shader.vertexShader
					.replace("#include <common>", "#include <common>\nvarying vec2 vSlime;")
					.replace("#include <begin_vertex>", "#include <begin_vertex>\nvSlime = uv;");
				shader.fragmentShader = shader.fragmentShader
					.replace(
						"#include <common>",
						`#include <common>
						uniform float uTime;
						varying vec2 vSlime;
						float slimeHash(vec2 p) {
							return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
						}
						float slimeNoise(vec2 p) {
							vec2 i = floor(p);
							vec2 f = fract(p);
							f = f * f * (3.0 - 2.0 * f);
							return mix(mix(slimeHash(i), slimeHash(i + vec2(1.0, 0.0)), f.x), mix(slimeHash(i + vec2(0.0, 1.0)), slimeHash(i + vec2(1.0, 1.0)), f.x), f.y);
						}`,
					)
					.replace(
						"#include <emissivemap_fragment>",
						`#include <emissivemap_fragment>
						float flow = slimeNoise(vec2(vSlime.x * 14.0 - uTime * 1.6, vSlime.y * 4.0)) * 0.6 + slimeNoise(vec2(vSlime.x * 40.0 - uTime * 2.4, vSlime.y * 9.0)) * 0.4;
						totalEmissiveRadiance *= 0.45 + 0.9 * flow;`,
					);
			};

			// The pot's outside, as [height, radius] pairs (matches its lathe).
			const potProfile = [
				[0.2, 0.9],
				[0.5, 1.4],
				[1.1, 1.65],
				[1.7, 1.6],
				[2.05, 1.35],
				[2.15, 1.42],
				[2.26, 1.48],
			];
			function potRadius(y) {
				for (let i = 1; i < potProfile.length; i++) {
					const [y0, r0] = potProfile[i - 1];
					const [y1, r1] = potProfile[i];
					if (y <= y1) return r0 + (r1 - r0) * clamp((y - y0) / (y1 - y0), 0, 1);
				}
				return potProfile[potProfile.length - 1][1];
			}

			// The stirring stick: a crooked branch leaning out over the rim, with a
			// band of slime where it meets the potion.
			const stirrer = new THREE.Group();
			{
				const curve = new THREE.CatmullRomCurve3(
					[
						[0.6, 1.2, 0],
						[0.62, 1.9, 0.02],
						[0.7, 2.6, -0.05],
						[0.84, 3.3, 0.06],
						[0.95, 3.9, -0.02],
						[1.08, 4.4, 0.08],
					].map(([x, y, z]) => new THREE.Vector3(x, y, z)),
				);
				const wood = new THREE.MeshStandardMaterial({ color: "#3a2a1b", roughness: 0.95 });
				const stick = new THREE.Mesh(new THREE.TubeGeometry(curve, 40, 0.07, 8), wood);
				const knot = new THREE.Mesh(new THREE.SphereGeometry(0.1, 8, 6), wood);
				knot.position.copy(curve.getPointAt(0.62));
				const coating = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3([0.12, 0.2, 0.28].map((s) => curve.getPointAt(s))), 12, 0.085, 8), slimeMaterial);
				stirrer.add(stick, knot, coating);
			}
			cauldron.add(shadowed(stirrer));
			let stirAngle = 0;

			// A flattened ribbon of slime swept along a path that hugs the pot:
			// wide where it pours over the rim, thin where it stretches, beaded
			// where it slows, and spreading out at the foot.
			function buildRivulet(points, width) {
				const curve = new THREE.CatmullRomCurve3(points);
				const SEGMENTS = 70;
				const AROUND = 10;
				const positions = [];
				const uvs = [];
				const index = [];
				const p = new THREE.Vector3();
				const tangent = new THREE.Vector3();
				const out = new THREE.Vector3();
				const across = new THREE.Vector3();
				const beads = [random(0.35, 0.55), random(0.6, 0.85)];
				for (let i = 0; i <= SEGMENTS; i++) {
					const s = i / SEGMENTS;
					curve.getPointAt(s, p);
					curve.getTangentAt(s, tangent);
					out.set(p.x, 0, p.z).normalize(); // away from the pot
					across.crossVectors(tangent, out).normalize();
					out.crossVectors(across, tangent).normalize();
					let w = width * (1.6 - smoothstep(0, 0.25, s) + 0.9 * smoothstep(0.8, 1, s));
					for (const bead of beads) w *= 1 + 0.55 * Math.exp(-(((s - bead) / 0.03) ** 2));
					for (let k = 0; k <= AROUND; k++) {
						const a = (k / AROUND) * TAU;
						const x = Math.cos(a) * w;
						const y = Math.sin(a) * w * 0.4; // flat against the pot
						positions.push(p.x + across.x * x + out.x * y, p.y + across.y * x + out.y * y, p.z + across.z * x + out.z * y);
						uvs.push(s, k / AROUND);
					}
				}
				for (let i = 0; i < SEGMENTS; i++) {
					for (let k = 0; k < AROUND; k++) {
						const a = i * (AROUND + 1) + k;
						const b = a + AROUND + 1;
						index.push(a, b, a + 1, a + 1, b, b + 1);
					}
				}
				const geometry = new THREE.BufferGeometry();
				geometry.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
				geometry.setAttribute("uv", new THREE.Float32BufferAttribute(uvs, 2));
				geometry.setIndex(index);
				geometry.computeVertexNormals();
				return geometry;
			}

			// A puddle: lobed, and domed like a drop of something thick.
			function puddleGeometry() {
				const phase = random(0, TAU);
				return displace(new THREE.CircleGeometry(1, 56).rotateX(-Math.PI / 2), (x, y, z) => {
					const a = Math.atan2(z, x);
					const k = 1 + 0.16 * Math.sin(a * 3 + phase) + 0.09 * Math.sin(a * 7 + phase * 2);
					return [x * k, 0.06 * (1 - x * x - z * z), z * k];
				});
			}

			rand = mulberry32(9090);
			const rivulets = Array.from({ length: 9 }, (_, i) => {
				const angle = random(0, TAU);
				const wiggle = random(0, TAU);
				const reach = random(0.25, 0.8);
				const at = (r, y, around = angle) => new THREE.Vector3(Math.cos(around) * r, y, Math.sin(around) * r);
				const points = [at(1.2, 2.3), at(1.47, 2.36), at(1.58, 2.25)];
				for (let y = 2.05; y > 0.35; y -= 0.25) points.push(at(potRadius(y) + 0.035, y, angle + 0.06 * Math.sin(y * 3 + wiggle)));
				points.push(at(potRadius(0.3) + 0.25, 0.06), at(1.35 + reach, 0.03));
				const geometry = buildRivulet(points, random(0.06, 0.12));
				geometry.setDrawRange(0, 0);
				cauldron.add(new THREE.Mesh(geometry, slimeMaterial));
				const puddle = new THREE.Mesh(puddleGeometry(), puddleMaterial);
				puddle.position.set(points[points.length - 1].x, 0.02 + i * 0.002, points[points.length - 1].z);
				puddle.rotation.y = random(0, TAU);
				puddle.scale.setScalar(0);
				cauldron.add(puddle);
				return { geometry, puddle, angle, size: random(0.4, 0.75), delay: random(0, 0.5), speed: random(0.7, 1.2) };
			});
			// One wide pool under the pot that the puddles run into.
			const basePool = new THREE.Mesh(puddleGeometry(), puddleMaterial);
			basePool.position.y = 0.015;
			basePool.scale.setScalar(0);
			cauldron.add(basePool);

			// Froth bubbling up all around the rim.
			const froth = Array.from({ length: 36 }, (_, i) => {
				const a = (i / 36) * TAU + random(-0.08, 0.08);
				const bubble = new THREE.Mesh(new THREE.SphereGeometry(1, 10, 8), slimeMaterial);
				const r = random(1.2, 1.46);
				bubble.position.set(Math.cos(a) * r, 2.32, Math.sin(a) * r);
				bubble.scale.setScalar(0);
				cauldron.add(bubble);
				return { bubble, size: random(0.06, 0.16), phase: random(0, TAU) };
			});

			// Drips falling from the belly of the pot, where the rivulets run over it.
			const drips = Array.from({ length: 8 }, () => {
				const drop = new THREE.Mesh(new THREE.SphereGeometry(1, 8, 6), slimeMaterial);
				drop.visible = false;
				cauldron.add(drop);
				return { drop, wait: Math.random(), velocity: 0, size: 0.04 };
			});

			let overflow = -1; // seconds since it boiled over; -1 when it's calm

			function boilOver() {
				overflow = overflow >= 0 && overflow < 5 ? Math.min(overflow, 1.8) : 0; // clicking again keeps it going
				cauldronSurge = 5;
				sounds.pour();
			}

			function updateCauldron(dt) {
				stirAngle += dt * (1.2 + cauldronSurge * 0.8);
				stirrer.rotation.set(0.05 * Math.sin(stirAngle * 2), stirAngle, 0.04 * Math.cos(stirAngle * 1.3));
				if (overflow < 0) return;
				overflow += dt;
				const t = overflow;
				const rise = smoothstep(0, 0.6, t) * (1 - smoothstep(5, 8, t));
				potion.position.y = 1.95 + 0.42 * rise;
				potion.scale.setScalar(1 + 0.16 * rise);
				cauldronSurge = Math.max(cauldronSurge, rise * 1.5);
				for (const { bubble, size, phase } of froth) {
					bubble.scale.setScalar(size * rise * (0.8 + 0.3 * Math.sin(t * 6 + phase)));
					bubble.position.y = 2.3 + 0.05 * rise + 0.03 * Math.sin(t * 4 + phase);
				}
				// Each rivulet runs down, then drains away from the top; its puddle
				// spreads once it arrives and shrinks as it dries up.
				for (const rivulet of rivulets) {
					const count = rivulet.geometry.index.count;
					const run = smoothstep(rivulet.delay, rivulet.delay + 1.4 / rivulet.speed, t);
					const drain = smoothstep(5, 7.5 + rivulet.delay, t);
					const start = Math.floor((count * drain) / 3) * 3;
					rivulet.geometry.setDrawRange(start, Math.max(0, Math.floor((count * run) / 3) * 3 - start));
					const spread = smoothstep(0.85, 1, run) * smoothstep(0, 1.2, t - rivulet.delay - 1.2 / rivulet.speed);
					rivulet.puddle.scale.setScalar(rivulet.size * spread * (1 - smoothstep(6.5, 9.5, t)) + 1e-4);
				}
				basePool.scale.setScalar(2.1 * smoothstep(1.4, 3, t) * (1 - smoothstep(6.5, 9.5, t)) + 1e-4);
				for (const drip of drips) {
					if (!drip.drop.visible) {
						drip.wait -= dt;
						if (drip.wait > 0 || rise < 0.5 || t < 1.2) continue;
						const a = rivulets[randInt(0, rivulets.length - 1)].angle + random(-0.05, 0.05);
						const r = potRadius(1.1) + 0.05;
						drip.drop.position.set(Math.cos(a) * r, 1.1, Math.sin(a) * r);
						drip.velocity = 0;
						drip.size = random(0.03, 0.05);
						drip.drop.visible = true;
					} else {
						drip.velocity -= 30 * dt; // thick stuff falls a little lazily
						drip.drop.position.y += drip.velocity * dt;
						drip.drop.scale.set(drip.size, drip.size * (1 + Math.min(2, -drip.velocity * 0.15)), drip.size);
						if (drip.drop.position.y < 0.05) {
							drip.drop.visible = false;
							drip.wait = random(0.1, 0.6);
						}
					}
				}
				if (t > 9.5) {
					overflow = -1;
					potion.position.y = 1.95;
					potion.scale.setScalar(1);
				}
			}

			// =====================================================================
			// The jump scare
			// The doll: click her and she blinks and her music box plays; click her
			// a third time and she comes straight at you, as somebody brings
			// their arms down on the piano keys, then it starts over.
			// And one of the spiders (which one depends on the seed) comes at you
			// every time. The other creatures just react to being clicked.
			// =====================================================================

			// Lights the creature's face as it reaches you. It's always there (at
			// zero) so turning it on doesn't make every material recompile.
			const scareLight = new THREE.PointLight("#ffd6b8", 0, 4, 2);
			scareLight.position.set(0, 0.25, 0.1);
			camera.add(scareLight);
			scene.add(camera);

			// How the doll is posed for her lunge: how big, which point of her ends
			// up in your face, how close she stops, and what to change on the copy.
			const scarePoses = {
				doll: { scale: 0.8, stop: 0.85, aim: new THREE.Vector3(0, 1.06, 0.1), pose: (copy) => copy.children[doll.children.indexOf(doll.userData.head)].rotation.set(0.25, 0, 0.35) },
			};

			let scare = null; // { rig, source, time }

			function jumpScare(kind, source) {
				if (scare || swarm) return;
				const { scale, aim, turn = 0, pose, stop } = scarePoses[kind];
				const copy = source.clone(true);
				copy.visible = true;
				copy.position.copy(aim).multiplyScalar(-scale);
				copy.rotation.set(0, turn, 0);
				if (turn) copy.position.applyAxisAngle(new THREE.Vector3(0, 1, 0), turn);
				copy.scale.setScalar(scale);
				copy.traverse((child) => (child.castShadow = false));
				pose?.(copy, source);
				const rig = new THREE.Group();
				rig.add(copy);
				scene.add(rig);
				source.visible = false; // it's not where it was any more
				scare = { rig, source, time: 0, stop };
				sounds.scream();
				sounds.pianoSlam(); // and somebody slams the piano
			}

			function updateScare(dt) {
				if (!scare) return;
				scare.time += dt;
				const t = scare.time;
				const calm = smoothstep(0.35, 1.1, t);
				// Appear a little way off, then rush in, faster and faster.
				const approach = smoothstep(0.06, 0.32, t);
				camera.getWorldDirection(_v);
				scare.rig.position
					.copy(camera.position)
					.addScaledVector(_v, 2.6 - (2.6 - scare.stop) * approach * approach)
					.add(new THREE.Vector3(Math.random() - 0.5, Math.random() - 0.5, 0).multiplyScalar(0.06 * (1 - calm)));
				scare.rig.lookAt(camera.position);
				scare.rig.rotateZ((Math.random() - 0.5) * 0.2 * (1 - calm));
				// A flash, then the lamp and the film stutter.
				scareLight.intensity = t < 1.1 ? (Math.random() < 0.5 ? 9 : 2.5) : 0;
				grade.uniforms.uFlicker.value = t < 0.06 ? 2.2 : t < 1.1 ? 0.65 + Math.random() * 0.8 : grade.uniforms.uFlicker.value;
				if (t < 1.1) grade.uniforms.uWeave.value.set((Math.random() - 0.5) * 0.02 * (1 - calm), (Math.random() - 0.5) * 0.02 * (1 - calm));
				if (t > 1.15) {
					scene.remove(scare.rig);
					scare.source.visible = true;
					scareLight.intensity = 0;
					scare = null;
				}
			}

			// The scary spider doesn't lunge. It drops down on its thread right in
			// front of your face, bounces and twitches there, while dozens more
			// pour across your view, then it shoots back up.
			let swarm = null; // { group, big, legs, thread, crawlers, source, time }

			function spiderSwarm(source) {
				if (swarm || scare) return;
				const group = new THREE.Group();
				camera.add(group); // everything here is placed relative to your view
				const copy = (scale) => {
					const spider = source.clone(true);
					spider.visible = true;
					spider.position.set(0, 0, 0);
					spider.rotation.set(Math.PI / 2, 0, 0); // back toward you, head down
					spider.scale.setScalar(scale);
					spider.traverse((child) => (child.castShadow = false));
					return spider;
				};
				const legsOf = (spider) => spider.children.filter((child) => child.isGroup);
				const big = new THREE.Group();
				const bigSpider = copy(0.62);
				big.add(bigSpider);
				const thread = new THREE.Line(
					new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3()]),
					new THREE.LineBasicMaterial({ color: "#d8dade", transparent: true, opacity: 0.6 }),
				);
				group.add(big, thread);
				const crawlers = Array.from({ length: 40 }, () => {
					const holder = new THREE.Group();
					const spider = copy(0.16 + Math.random() * 0.14);
					holder.add(spider);
					group.add(holder);
					// In from just outside an edge, across and out the other side.
					const edge = Math.random() * TAU;
					holder.position.set(Math.cos(edge) * 0.42, Math.sin(edge) * 0.27, -0.6 - Math.random() * 0.1);
					const heading = new THREE.Vector3(-holder.position.x + (Math.random() - 0.5) * 0.5, -holder.position.y + (Math.random() - 0.5) * 0.4, 0).normalize();
					holder.rotation.z = Math.atan2(heading.x, -heading.y);
					holder.visible = false;
					return { holder, legs: legsOf(spider), velocity: heading.multiplyScalar(0.25 + Math.random() * 0.25), delay: Math.random() * 0.6, gait: Math.random() * TAU };
				});
				source.visible = false;
				swarm = { group, big, legs: legsOf(bigSpider), thread, crawlers, source, time: 0 };
				sounds.skitter();
			}

			function updateSpiderSwarm(dt) {
				if (!swarm) return;
				swarm.time += dt;
				const t = swarm.time;
				const drop = t < 0.2 ? 1 - (t / 0.2) ** 2 : 0;
				const bounce = t >= 0.2 ? Math.exp(-(t - 0.2) * 5) * Math.sin((t - 0.2) * 22) * 0.04 : 0;
				const leave = smoothstep(2.2, 2.6, t);
				swarm.big.position.set(Math.sin(t * 2.3) * 0.015, 0.04 + drop * 0.35 + bounce + leave * 0.45, -0.45);
				swarm.big.rotation.z = Math.sin(t * 3.1) * 0.15;
				const thread = swarm.thread.geometry.attributes.position;
				thread.setXYZ(0, swarm.big.position.x * 0.2, 0.6, -0.45);
				thread.setXYZ(1, swarm.big.position.x, swarm.big.position.y + 0.02, -0.45);
				thread.needsUpdate = true;
				swarm.legs.forEach((hip, i) => (hip.rotation.y = Math.sin(t * 30 + i) * 0.35)); // twitching
				for (const crawler of swarm.crawlers) {
					crawler.holder.visible = t > crawler.delay;
					if (!crawler.holder.visible) continue;
					crawler.holder.position.addScaledVector(crawler.velocity, dt);
					crawler.gait += dt * 30;
					crawler.legs.forEach((hip, i) => (hip.rotation.y = 0.3 * Math.sin(crawler.gait + (i % 2) * Math.PI)));
				}
				scareLight.intensity = t < 2.2 ? (Math.random() < 0.3 ? 5 : 1.5) : 0;
				if (t < 0.12) grade.uniforms.uFlicker.value = 1.7;
				if (t > 2.7) {
					camera.remove(swarm.group);
					swarm.source.visible = true;
					scareLight.intensity = 0;
					swarm = null;
				}
			}

			// What they do when clicked (and what the doll does the first two times).
			const reactions = {
				cat: () => {
					catState.pause = Math.max(catState.pause, 4); // stops, stares and hisses
					sounds.hiss();
				},
				witch: () => sounds.witchPasses(),
				vulture: () => (vulture.userData.spread = 3),
				bat: (roost) => roost && startle(roost), // a roosting bat takes off
				spider: (spider) => {
					if (spider.mode !== "walk") return;
					spider.timer = 0; // scuttle off somewhere else
					spider.target = tablePoint();
				},
				doll: () => {
					doll.userData.blink = 1;
					sounds.musicBox();
				},
			};

			let dollClicks = 0;
			const scarySpider = spiders[Math.floor(mulberry32(settings.seed + 13)() * spiders.length)];
			function creatureClicked(kind, object, extra) {
				const scares = (kind === "doll" && dollClicks++ % 3 === 0) || (kind === "spider" && extra === scarySpider);
				if (scares && kind === "spider") spiderSwarm(object);
				else if (scares) jumpScare(kind, object);
				else reactions[kind](extra);
			}

			// Generous invisible targets, since most of them are small, far off or moving.
			function makeClickable(kind, object, radius, at, extra) {
				const target = clickTarget(radius);
				target.position.copy(at);
				object.add(target);
				interactives.push({ object, onClick: () => creatureClicked(kind, object, extra) });
				pickables.push(object);
			}
			makeClickable("cat", cat, 1.6, new THREE.Vector3(0, 1.4, 0.4));
			makeClickable("witch", witch, 2.5, new THREE.Vector3(0, 1.2, 0));

				ctx.moveTo(190, 278);
				ctx.quadraticCurveTo(170, 350, 196, 418);
				ctx.quadraticCurveTo(222, 452, 262, 446);
				ctx.quadraticCurveTo(312, 444, 330, 410);
				ctx.quadraticCurveTo(352, 372, 334, 330);
				ctx.quadraticCurveTo(334, 290, 318, 262);
				ctx.quadraticCurveTo(296, 246, 272, 252);
				ctx.quadraticCurveTo(250, 246, 230, 258);
				ctx.quadraticCurveTo(205, 260, 190, 278);
				ctx.fill();
				for (let i = 0; i < 70; i++) {
					// a ragged edge
					const a = random(0, TAU);
					ctx.fillStyle = red(random(0.7, 0.95));
					blob(258 + Math.cos(a) * random(70, 92), 350 + Math.sin(a) * random(80, 98), random(4, 12), random(4, 12));
				}
				for (const finger of fingers) {
					const w = finger[6];
					for (const [t0, t1] of [
						[0, 0.3],
						[0.4, 0.68],
						[0.76, 1],
					]) {
						if (t0 === 0.4 && rand() < 0.3) continue; // a joint that didn't print
						ctx.fillStyle = red(random(0.8, 0.97));
						for (let t = t0; t <= t1; t += 0.04) {
							const [x, y] = along(finger, t);
							blob(x + random(-2, 2), y + random(-2, 2), w * random(0.38, 0.5), w * random(0.38, 0.5));
						}
					}
					const [x, y] = along(finger, 1);
					ctx.fillStyle = red(0.95);
					blob(x, y, w * 0.55, w * 0.62); // the pad, pressed widest
				}
				// The runs.
				const ends = [];
				for (const [x, y] of starts) {
					ctx.fillStyle = red(random(0.85, 0.97));
					const long = rand() < 0.3;
					ends.push([run(x, y - 4, long ? random(140, 270) : random(20, 100), random(4, 11)), long]);
				}
				handDrips.push(...ends.filter(([[, y], long]) => long && y > 480).map(([end]) => end).slice(0, 6)); // only past the heel
				// A few drops flung off as it hit.
				for (let i = 0; i < 18; i++) {
					const a = random(0, TAU);
					const d = random(180, 260);
					ctx.fillStyle = red(random(0.8, 0.95));
					const r = random(2, 7);
					blob(256 + Math.cos(a) * d, 300 + Math.sin(a) * d * 0.8, r * random(1, 2.5), r, a);
				}
				// Gaps where the skin didn't touch: the lines of the palm, its hollow,
				// and specks.
				ctx.globalCompositeOperation = "destination-out";
				ctx.strokeStyle = "rgba(0, 0, 0, 0.6)";
				ctx.lineWidth = 3;
				for (const [x0, y0, cx, cy, x1, y1] of [
					[180, 300, 250, 280, 330, 300], // heart line
					[185, 335, 250, 320, 305, 345], // head line
					[300, 275, 250, 340, 290, 430], // life line
				]) {
					ctx.beginPath();
					ctx.moveTo(x0, y0);
					ctx.quadraticCurveTo(cx, cy, x1, y1);
					ctx.stroke();
				}
				const hollow = ctx.createRadialGradient(250, 335, 0, 250, 335, 60);
				hollow.addColorStop(0, "rgba(0, 0, 0, 0.5)");
				hollow.addColorStop(1, "rgba(0, 0, 0, 0)");
				ctx.fillStyle = hollow;
				ctx.fillRect(150, 230, 200, 210);
				for (let i = 0; i < 500; i++) {
					ctx.fillStyle = `rgba(0, 0, 0, ${random(0.2, 0.6)})`;
					blob(random(130, 450), random(50, 450), random(1, 3.5), random(1, 3.5));
				}
				// Darker where it pooled thickest, and a wet sheen down some runs.
				ctx.globalCompositeOperation = "source-atop";
				for (let i = 0; i < 45; i++) {
					ctx.fillStyle = `rgba(40, 2, 2, ${random(0.15, 0.45)})`;
					blob(random(150, 440), random(70, 520), random(5, 20), random(4, 14), random(0, TAU));
				}
				ctx.fillStyle = "rgba(190, 40, 34, 0.2)";
				for (const [[x, y]] of ends.slice(0, 12)) blob(x - 2, y - 40, 1.5, 30);
				return colorTexture(canvas);
			}
			// Each board's piece: the part of the patch under that board, following
			// its own surface.
			const handMaterial = new THREE.MeshStandardMaterial({ map: bloodyHand(), transparent: true, roughness: 0.55, depthWrite: false });
			const handPrints = handBoards.flatMap((board) => {
				const { length, width } = board.geometry.userData;
				const [bx, , bz] = plankBoxes[planks.indexOf(board)][0].toArray();
				const x0 = Math.max(HAND_CENTER[0] - HAND_SIZE[0] / 2, bx - length / 2 + 0.01);
				const x1 = Math.min(HAND_CENTER[0] + HAND_SIZE[0] / 2, bx + length / 2 - 0.01);
				const z0 = Math.max(HAND_CENTER[1] - HAND_SIZE[1] / 2, bz - width / 2 + 0.005);
				const z1 = Math.min(HAND_CENTER[1] + HAND_SIZE[1] / 2, bz + width / 2 - 0.005);
				if (x0 >= x1 || z0 >= z1) return []; // nowhere near this board
				const geometry = new THREE.PlaneGeometry(1, 1, 48, 24);
				const position = geometry.attributes.position;
				const uv = geometry.attributes.uv;
				for (let i = 0; i < position.count; i++) {
					const x = x0 + (position.getX(i) + 0.5) * (x1 - x0);
					const z = z0 + (position.getY(i) + 0.5) * (z1 - z0);
					uv.setXY(i, (x - HAND_CENTER[0]) / HAND_SIZE[0] + 0.5, (z - HAND_CENTER[1]) / HAND_SIZE[1] + 0.5);
					const { length: bl, width: bw, thickness, warp } = board.geometry.userData;
					const local = new THREE.Vector3(x, 0, z).applyMatrix4(board.matrix.clone().invert());
					position.setXYZ(i, local.x, -thickness / 2 + warp(clamp(local.x, -bl / 2, bl / 2), clamp(local.z, -bw / 2, bw / 2)) - 0.0015, local.z);
				}
				geometry.computeVertexNormals();
				const print = new THREE.Mesh(geometry, handMaterial);
				print.receiveShadow = true;
				board.add(print);
				return [print];
			});

			// Drops hanging at the ends of the longest runs: a film where it
			// clings to the wood, narrowing, then a round bead.
			const dropMaterial = new THREE.MeshStandardMaterial({ color: "#4a0403", roughness: 0.12 });
			for (const [x, y] of handDrips) {
				const length = random(0.025, 0.07);
				const bead = random(0.006, 0.011);
				const profile = [];
				for (let k = 0; k <= 16; k++) {
					const fromTip = length * (k / 16) ** 1.5;
					const film = bead * (0.45 + 0.9 * smoothstep(length * 0.55, length, fromTip));
					const swell = bead * Math.sqrt(Math.max(0, 1 - ((fromTip - bead) / bead) ** 2));
					profile.push([fromTip < bead ? swell : Math.max(film, swell), fromTip - length]);
				}
				const under = underBoard(...handOnTable(x, y));
				if (!under) continue; // it ended over the gap
				const drop = new THREE.Mesh(lathe(profile, 10), dropMaterial);
				drop.position.copy(under[1]).y -= 0.001;
				under[0].add(drop);
			}

			// What you hover and click: a plane facing down, so it can't be hit
			// from above, through the table.
			const markTarget = new THREE.Mesh(new THREE.PlaneGeometry(MARK_WIDTH, MARK_DEPTH).rotateX(Math.PI / 2), new THREE.MeshBasicMaterial({ visible: false }));
			markTarget.position.set(markX, -boardThickness / 2 - 0.01, 0);
			markBoard.add(markTarget);

			let markLooks = null; // [plain, underlined]
			const showMark = (underline) => markLooks && Object.assign(markMaterial, markLooks[underline ? 1 : 0]);
			Promise.race([alluraLoaded.then(() => document.fonts.load('400 100px "Allura"', "an")), new Promise((resolve) => setTimeout(resolve, 4000))]).then(() => {
				markLooks = [carveMark(false)];
				showMark(false);
				markMaterial.needsUpdate = true;
				// Open the board's underside where the patch covers it.
				const index = markBoard.geometry.index;
				const position = markBoard.geometry.attributes.position;
				const { start, count } = markBoard.geometry.groups[3];
				const inside = (v) => Math.abs(position.getX(v) - markX) < MARK_WIDTH / 2 && Math.abs(position.getZ(v)) < MARK_DEPTH / 2;
				for (let i = start; i < start + count; i += 3) {
					const [a, b, c] = [index.getX(i), index.getX(i + 1), index.getX(i + 2)];
					if (inside(a) && inside(b) && inside(c)) index.setXYZ(i, a, a, a);
				}
				index.needsUpdate = true;
				markPatch.visible = true;
				setTimeout(() => markLooks.push(carveMark(true)), 500);
				// Shrink what you hover to the lettering itself, underlines included.
				const [width, height] = MARK_PX;
				const ink = drawMark(true);
				let [left, right, top, bottom] = [width, 0, height, 0];
				for (let y = 0; y < height; y++) {
					for (let x = 0; x < width; x++) {
						if (ink[(y * width + x) * 4] < 128) continue;
						[left, right, top, bottom] = [Math.min(left, x), Math.max(right, x), Math.min(top, y), Math.max(bottom, y)];
					}
				}
				markTarget.scale.set((right - left + 24) / width, 1, (bottom - top + 24) / height);
				markTarget.position.x = markX + ((left + right) / 2 / width - 0.5) * MARK_WIDTH;
				markTarget.position.z = (0.5 - (top + bottom) / 2 / height) * MARK_DEPTH;
			});

			interactives.push({ object: markTarget, onClick: () => open("https://hemm.ing", "_blank", "noopener") });
			pickables.push(markTarget);
			let markHovered = false;
			addEventListener("pointermove", (event) => {
				if (event.pointerType === "touch" || press) return;
				pointerNDC.set((event.clientX / innerWidth) * 2 - 1, -(event.clientY / innerHeight) * 2 + 1);
				raycaster.setFromCamera(pointerNDC, camera);
				const over = raycaster.intersectObject(markTarget).length > 0;
				if (over === markHovered) return;
				markHovered = over;
				showMark(over);
				renderer.domElement.style.cursor = over ? "pointer" : "";
			});

			const cornerStyles = document.createElement("style");
			cornerStyles.textContent = `
				.maker-mark {
					position: fixed;
					right: max(18px, env(safe-area-inset-right));
					bottom: max(12px, env(safe-area-inset-bottom));
					display: inline-block;
					text-decoration: none;
					opacity: 0.25;
					transition: opacity 0.2s;
				}
				.maker-mark:hover,
				.maker-mark:focus-visible {
					opacity: 0.7;
				}
				/* The symbols sit in its top padding, inside its box. */
				.maker-mark__text {
					position: relative;
					display: block;
					padding-top: 14px;
					color: #f6f6f6;
					font: 300 18px/1 "Times New Roman", serif;
					letter-spacing: 0.1px;
					text-align: center;
					opacity: 0.6;
					transform: scaleX(1.15) scaleY(0.9);
				}
				.maker-mark__symbols {
					position: absolute;
					top: 0;
					left: 50%;
					display: flex;
					gap: 4px;
					align-items: center;
					justify-content: center;
					font: 200 9px/9px Arial, Helvetica, sans-serif;
					opacity: 0.5;
					transform: translateX(-50%) scaleY(1.1);
				}
				.maker-mark__an {
					display: inline-block;
					font: italic 400 14px "Allura", cursive;
					transform: scaleX(1) scaleY(1.5) translateY(-1px) rotate(-2.25deg);
				}
				.frame-rate {
					position: fixed;
					left: max(16px, env(safe-area-inset-left));
					bottom: max(14px, env(safe-area-inset-bottom));
					color: #e8d8bf;
					font: 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
					letter-spacing: 0.5px;
					opacity: 0.35;
					pointer-events: none;
				}
			`;
			document.head.appendChild(cornerStyles);

			// The mark from the footer of hemm.ing again, faintly, bottom right.
			const mark = document.createElement("a");
			mark.className = "maker-mark";
			mark.href = "https://hemm.ing";
			mark.target = "_blank";
			mark.rel = "noopener";
			mark.setAttribute("aria-label", "Hemming, an LLC: Parker Hemming's portfolio");
			mark.innerHTML = `
				<span class="maker-mark__text">
					<span class="maker-mark__symbols" aria-hidden="true"><span>®</span><span>©</span><span>℗</span><span>™</span></span>
					HEMMING<br /><span class="maker-mark__an">an</span> LLC
				</span>
			`;
			document.body.appendChild(mark);

			const frameRate = document.createElement("div");
			frameRate.className = "frame-rate";
			frameRate.setAttribute("aria-hidden", "true");
			document.body.appendChild(frameRate);
			const frames = { count: 0, time: 0 };
			function updateFrameRate(rawDt) {
				frames.count++;
				frames.time += rawDt;
				if (frames.time < 0.5) return; // twice a second, so it's readable
				frameRate.textContent = `${Math.round(frames.count / frames.time)} fps`;
				frames.count = 0;
				frames.time = 0;
			}

			// =====================================================================
			// Animation
			// =====================================================================

			// Flicker: a slow random walk, two quick wobbles, and the odd gust that
			// dips the light and bends the flame. Kept within ~15%.
			let flicker = 1;
			let flickerTarget = 1;
			let gust = 0;
			let gustSide = 1;
			let lit = 1; // eases between 0 and 1 when the candle goes out
			let ember = 1; // the wick keeps glowing a moment after the flame goes

			const clock = new THREE.Clock();
			const flameWorld = new THREE.Vector3();

			function animate() {
				const rawDt = clock.getDelta();
				const dt = Math.min(rawDt, 0.05);
				updateFrameRate(rawDt);
				const t = clock.elapsedTime;

				if (Math.random() < dt * 0.25) {
					gust = 0.08 + Math.random() * 0.1;
					gustSide = Math.random() < 0.5 ? -1 : 1;
				}
				gust *= Math.exp(-dt * 3);
				flickerTarget += (Math.random() - 0.5) * dt * 2 + (1 - flickerTarget) * dt * 1.5;
				flicker += (flickerTarget - flicker) * Math.min(1, dt * 12);
				const on = settings.candleLit ? 1 : 0;
				lit += (on - lit) * Math.min(1, dt * 6);
				ember += (on - ember) * Math.min(1, dt * 1.2);

				const level = flicker * (1 - gust) * (1 + 0.03 * Math.sin(t * 9.1) + 0.02 * Math.sin(t * 15.7 + 1.3)) * lit;
				const sway = 0.15 * Math.sin(t * 1.3) * Math.sin(t * 0.7 + 1) + gust * gustSide * 2.5;
				candleLight.intensity = CANDLE_INTENSITY * level;
				bounceLight.intensity = BOUNCE_INTENSITY * level;
				candleLight.position.set(lightHome.x + sway * 0.008, lightHome.y, lightHome.z + sway * 0.005);
				waxMaterial.emissiveIntensity = 0.25 * level;
				cutMaterial.emissiveIntensity = 0.45 * level;
				emberMaterial.emissiveIntensity = 3 * ember;
				flameMaterial.uniforms.uTime.value = t;
				flameMaterial.uniforms.uSway.value = sway;
				flame.visible = glow.visible = lit > 0.01;
				flame.scale.set(lit, (0.85 + 0.25 * level) * lit, lit);
				glow.material.opacity = 0.5 * level;

				// Turn the flame to face the camera, staying upright.
				flame.getWorldPosition(flameWorld);
				flame.rotation.y = Math.atan2(camera.position.x - flameWorld.x, camera.position.z - flameWorld.z) - pumpkin.rotation.y;

				stepPhysics(dt);
				updateProps(dt, t);
				updateSurroundings(dt, t);
				updateRat(dt, t);
				releaseGround();
				updateSweep(dt);
				controls.update();
				zoomTowardMark();
				holdAboveGround();

				// Cutaway follows the camera; wireframes only draw when it's close.
				cutaway.center.value.copy(camera.position);
				const near = camera.position.distanceTo(pumpkinCenter) < pumpkinReach;
				wires.forEach((wire) => (wire.visible = near));
				// Keep the near plane tight inside the pumpkin, looser outside.
				camera.near = clamp(camera.position.distanceTo(controls.target) * 0.02, 0.004, 0.05);
				camera.updateProjectionMatrix();

				starMaterial.uniforms.uTime.value = t;
				skyTime.value = t;
				updateContactShadows();
				sounds.update();
				adaptQuality(rawDt, t);
				updateFilm(dt);
				updateCauldron(dt);
				updateScare(dt); // after the film, so its flash and shake win
				updateSpiderSwarm(dt);
				composer.render(dt);
			}

			// =====================================================================
			// Resize
			// =====================================================================

			function resize() {
				const { clientWidth: width, clientHeight: height } = renderer.domElement;
				const aspect = width / height;
				camera.aspect = aspect;
				// On tall screens, widen the vertical view so the pumpkin still fits.
				camera.fov = aspect < 1 ? Math.min(75, THREE.MathUtils.radToDeg(2 * Math.atan(Math.tan(THREE.MathUtils.degToRad(19)) / aspect))) : 38;
				camera.updateProjectionMatrix();
				// Each rendered pixel takes over 100 bytes of GPU memory across the
				// multisampled buffers, so big high-density windows stop at about
				// four million pixels. Running out loses the WebGL context.
				renderer.setPixelRatio(Math.min(quality.level === 2 ? devicePixelRatio : 1, 2, Math.sqrt(4e6 / (width * height))));
				renderer.setSize(width, height, false);
				composer.setPixelRatio(renderer.getPixelRatio());
				composer.setSize(width, height);
				grade.uniforms.uResolution.value.set(width * renderer.getPixelRatio(), height * renderer.getPixelRatio());
				grade.uniforms.uPixelRatio.value = renderer.getPixelRatio();
				starMaterial.uniforms.uPixelRatio.value = renderer.getPixelRatio();
				placePiano();
				// Smoke particles size themselves in world units.
				pointScale.value = (height * renderer.getPixelRatio()) / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)));
			}

			addEventListener("resize", resize);
			resize();
			// Compile every shader before the first frame, in the background, so the
			// page doesn't freeze while it happens: Safari can take many seconds
			// the first time, and doing it all inside one frame can make it give up
			// on WebGL entirely. It's compiled for the buffer the scene really
			// renders into (not the screen), or it would all be done again. The
			// guide shows meanwhile, and its timer starts with the first frame.
			renderer.setRenderTarget(composer.readBuffer);
			const compiled = renderer.compileAsync(scene, camera);
			renderer.setRenderTarget(null);
			compiled.then(() => {
				renderer.setAnimationLoop(animate);
				setTimeout(dismissGuide, 9000);
			});
		</script>
	</body>
</html>
