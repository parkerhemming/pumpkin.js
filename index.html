<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>pumpkin.js</title>
		<script type="importmap">
			{
				"imports": {
					"three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
					"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
					"rapier": "https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.14.0/rapier.es.js"
				}
			}
		</script>
	</head>
	<body>
		<script type="module">
			import * as THREE from "three";
			import { OrbitControls } from "three/addons/controls/OrbitControls.js";
			import { mergeGeometries } from "three/addons/utils/BufferGeometryUtils.js";
			import RAPIER from "rapier";
			import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
			import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
			import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
			import { OutputPass } from "three/addons/postprocessing/OutputPass.js";
			import { ShaderPass } from "three/addons/postprocessing/ShaderPass.js";

			const TAU = Math.PI * 2;
			const clamp = (x, min, max) => Math.min(max, Math.max(min, x));
			const smoothstep = (a, b, x) => {
				const t = clamp((x - a) / (b - a), 0, 1);
				return t * t * (3 - 2 * t);
			};
			const wrapAngle = (a) => a - TAU * Math.round(a / TAU);

			// =====================================================================
			// Seeded randomness
			// =====================================================================

			function mulberry32(a) {
				return () => {
					a = (a + 0x6d2b79f5) | 0;
					let t = Math.imul(a ^ (a >>> 15), 1 | a);
					t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
					return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
				};
			}

			let rand = mulberry32(1);
			const random = (min, max) => min + rand() * (max - min);
			const randInt = (min, max) => Math.floor(random(min, max + 1));

			// Smooth 2D value noise for textures and warping.
			// `period` makes it wrap in x, for textures that go all the way around.
			function makeNoise() {
				const order = [...Array(256).keys()];
				for (let i = 255; i > 0; i--) {
					const j = Math.floor(rand() * (i + 1));
					[order[i], order[j]] = [order[j], order[i]];
				}
				const perm = Uint8Array.from({ length: 512 }, (_, i) => order[i & 255]);
				const values = Float32Array.from({ length: 256 }, rand);
				const hash = (x, y) => values[perm[perm[x & 255] + (y & 255)]];

				return (x, y, period = 0) => {
					const xi = Math.floor(x);
					const yi = Math.floor(y);
					const fx = x - xi;
					const fy = y - yi;
					const sx = fx * fx * (3 - 2 * fx);
					const sy = fy * fy * (3 - 2 * fy);
					const x0 = period ? ((xi % period) + period) % period : xi;
					const x1 = period ? (x0 + 1) % period : xi + 1;
					const a = hash(x0, yi);
					const b = hash(x1, yi);
					const c = hash(x0, yi + 1);
					const d = hash(x1, yi + 1);
					return a + (b - a) * sx + (c - a) * sy + (a - b - c + d) * sx * sy;
				};
			}

			function makeCanvas(width, height) {
				const canvas = document.createElement("canvas");
				canvas.width = width;
				canvas.height = height;
				return [canvas, canvas.getContext("2d", { willReadFrequently: true })];
			}

			function colorTexture(canvas) {
				const texture = new THREE.CanvasTexture(canvas);
				texture.colorSpace = THREE.SRGBColorSpace;
				texture.anisotropy = 8;
				return texture;
			}

			function dataTexture(canvas) {
				const texture = new THREE.CanvasTexture(canvas);
				texture.anisotropy = 8;
				return texture;
			}

			// Several same-sized canvases painted pixel by pixel in one pass.
			// paint(x, y, out) fills out[i] = [r, g, b] for each canvas (0..255).
			function paintCanvases(width, height, count, paint) {
				const canvases = Array.from({ length: count }, () => makeCanvas(width, height));
				const images = canvases.map(([, ctx]) => ctx.createImageData(width, height));
				const out = Array.from({ length: count }, () => [0, 0, 0]);
				for (let y = 0; y < height; y++) {
					for (let x = 0; x < width; x++) {
						paint(x, y, out);
						const i = (y * width + x) * 4;
						for (let c = 0; c < count; c++) {
							images[c].data[i] = out[c][0];
							images[c].data[i + 1] = out[c][1];
							images[c].data[i + 2] = out[c][2];
							images[c].data[i + 3] = 255;
						}
					}
				}
				canvases.forEach(([, ctx], c) => ctx.putImageData(images[c], 0, 0));
				return canvases;
			}

			// =====================================================================
			// Settings
			// Every load is a new seed: a new pumpkin, face, and jump-scare
			// creature. A link with #seed=777 (and optionally &face=spooky) loads
			// that one once; the address is then cleared so a refresh is new again.
			// =====================================================================

			const FACE_NAMES = ["classic", "goofy", "spooky", "surprised"];
			const hashParams = new URLSearchParams(location.hash.slice(1));
			const seed = parseInt(hashParams.get("seed")) || Math.floor(Math.random() * 1e9) + 1;
			const settings = {
				seed,
				face: FACE_NAMES.includes(hashParams.get("face")) ? hashParams.get("face") : FACE_NAMES[Math.floor(mulberry32(seed + 21)() * FACE_NAMES.length)],
				candleLit: true,
			};
			if (location.hash) history.replaceState(null, "", location.pathname + location.search);

			// =====================================================================
			// Renderer, camera, controls
			// =====================================================================

			Object.assign(document.body.style, { margin: "0", overflow: "hidden", backgroundColor: "black" });

			const renderer = new THREE.WebGLRenderer({ antialias: true });
			renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
			renderer.shadowMap.enabled = true;
			renderer.shadowMap.type = THREE.PCFSoftShadowMap;
			renderer.toneMapping = THREE.NeutralToneMapping;
			renderer.toneMappingExposure = 1.25;
			// Fixed to the viewport so the canvas can never widen the page on phones.
			Object.assign(renderer.domElement.style, { position: "fixed", inset: "0", width: "100%", height: "100%" });
			document.body.appendChild(renderer.domElement);

			const scene = new THREE.Scene();
			const camera = new THREE.PerspectiveCamera(38, 1, 0.01, 600);
			const controls = new OrbitControls(camera, renderer.domElement);
			controls.enableDamping = true;
			controls.enablePan = false;
			controls.minDistance = 0.15; // close enough to end up inside the pumpkin
			controls.maxDistance = 9;
			controls.minPolarAngle = 0.12 * Math.PI;
			controls.maxPolarAngle = 0.49 * Math.PI;

			// =====================================================================
			// Pumpkin shape
			// The surface is a grid over (u, v): u goes around (0..1, front at 0.5),
			// v runs from the stem (0) to the bottom (1). Everything else is built
			// from surfacePoint(u, v).
			// =====================================================================

			const SHELL = 0.11; // wall thickness (about 1.5 cm on a 30 cm pumpkin)

			rand = mulberry32(settings.seed);
			const W = random(0.95, 1.06); // half-width
			const D = W * random(0.92, 1.0); // half-depth: pumpkins are rarely perfectly round
			const H = random(0.68, 0.77); // half-height
			const lean = { x: random(-0.05, 0.05), z: random(-0.05, 0.05) };

			// Ribs: uneven spacing, each lobe bulging between two creases. The
			// creases wander as they run down, and differ in depth.
			const grooveCount = randInt(10, 13);
			const spacing = Array.from({ length: grooveCount }, () => random(0.7, 1.3));
			const spacingTotal = spacing.reduce((a, b) => a + b, 0);
			let grooveAngle = random(0, TAU);
			const grooves = spacing.map((step) => {
				const groove = {
					angle: grooveAngle,
					depth: random(0.05, 0.095),
					wander: random(-0.1, 0.1),
					phase: random(0, TAU),
					swell: random(-0.02, 0.03), // how much the lobe after it bulges
				};
				grooveAngle += (step / spacingTotal) * TAU;
				return groove;
			});

			const lumps = Array.from({ length: 4 }, () => ({
				m: randInt(1, 3),
				n: randInt(1, 3),
				amp: random(0.008, 0.02),
				phase: random(0, TAU),
			}));

			// Warts: a couple of clusters plus a few strays.
			const warts = [];
			for (let c = 0, clusters = randInt(1, 3); c < clusters; c++) {
				const theta = random(-Math.PI, Math.PI);
				const phi = random(0.3, 0.8) * Math.PI;
				for (let i = 0, n = randInt(4, 10); i < n; i++) {
					warts.push({ theta: theta + random(-0.18, 0.18), phi: phi + random(-0.15, 0.15), size: random(0.018, 0.04), height: random(0.006, 0.016) });
				}
			}
			for (let i = 0, n = randInt(3, 7); i < n; i++) {
				warts.push({ theta: random(-Math.PI, Math.PI), phi: random(0.25, 0.85) * Math.PI, size: random(0.015, 0.03), height: random(0.005, 0.012) });
			}

			const topDimple = random(0.2, 0.28);
			const bottomDimple = random(0.05, 0.1);

			const lidV = random(0.17, 0.2);
			const lidTeeth = randInt(5, 8);
			const lidJag = Array.from({ length: lidTeeth }, () => random(0.5, 1.4));
			const lidTilt = random(0, TAU);
			// Columns land exactly on every zig-zag tip.
			const COLS = lidTeeth * 2 * Math.round(180 / lidTeeth);

			const faceV = random(0.44, 0.48);
			const turn = random(-0.12, 0.12);
			const noise = makeNoise();

			// Groove positions at one height, as offsets from the first groove.
			const _offsets = new Float64Array(32);
			let _first = 0;
			function setGrooveRow(phi) {
				_first = grooves[0].angle + grooves[0].wander * Math.sin(phi * 2 + grooves[0].phase);
				for (let i = 1; i < grooveCount; i++) {
					const g = grooves[i];
					_offsets[i] = (((g.angle + g.wander * Math.sin(phi * 2 + g.phase) - _first) % TAU) + TAU) % TAU;
				}
				_offsets[0] = 0;
				_offsets[grooveCount] = TAU;
			}

			// Which lobe theta is on (after setGrooveRow), and how far across it
			// it sits in _lobeT (0 and 1 are the creases).
			let _lobeT = 0;

			// 1 on the middle of a lobe, 0 in a crease. The crease is a V with a
			// slightly rounded bottom, so the mesh can follow it without stepping.
			function lobeBulge(t) {
				const s = Math.sin(Math.PI * t);
				return Math.pow((Math.sqrt(s * s + 0.0225) - 0.15) / 0.8601, 0.6);
			}

			function lobeAt(theta) {
				const x = (((theta - _first) % TAU) + TAU) % TAU;
				let k = 0;
				while (k < grooveCount - 1 && x >= _offsets[k + 1]) k++;
				_lobeT = (x - _offsets[k]) / (_offsets[k + 1] - _offsets[k]);
				return k;
			}

			function surfacePoint(u, v, target = new THREE.Vector3()) {
				const theta = TAU * (u - 0.5);
				const phi = Math.PI * v;
				const s = Math.max(0, Math.sin(phi)); // v can overshoot 1 by a hair

				// Lobes and creases; they fade toward the poles so the surface closes.
				setGrooveRow(phi);
				const k = lobeAt(theta);
				const bulge = lobeBulge(_lobeT);
				const depth = _lobeT < 0.5 ? grooves[k].depth : grooves[(k + 1) % grooveCount].depth;
				const fade = Math.pow(s, 0.35);
				let r = 1 - depth * (1 - bulge) * fade + grooves[k].swell * bulge * fade;

				for (const lump of lumps) {
					r += lump.amp * s * Math.sin(lump.m * theta + lump.phase) * Math.sin(lump.n * phi + lump.phase);
				}
				for (const wart of warts) {
					const dPhi = phi - wart.phi;
					if (Math.abs(dPhi) > wart.size * 3) continue;
					const dTheta = wrapAngle(theta - wart.theta) * s;
					const d2 = (dPhi * dPhi + dTheta * dTheta) / (wart.size * wart.size);
					if (d2 < 9) r += wart.height * Math.exp(-d2);
				}

				// Sunken stem cavity and blossom end.
				r -= topDimple * Math.exp(-((phi / 0.32) ** 2));
				r -= bottomDimple * Math.exp(-(((Math.PI - phi) / 0.35) ** 2));

				// Squash the bottom so it sits flat on the table.
				let y = Math.cos(phi) * r * H;
				const floor = -0.8 * H;
				if (y < floor) y = floor - (floor - y) / (1 + (floor - y) / 0.05);

				return target.set(Math.sin(theta) * s * r * W + lean.x * y, y, Math.cos(theta) * s * r * D + lean.z * y);
			}

			const _p1 = new THREE.Vector3();
			const _p2 = new THREE.Vector3();
			const _du = new THREE.Vector3();
			const _dv = new THREE.Vector3();

			function surfaceNormal(u, v, target = new THREE.Vector3()) {
				if (v < 1e-4) return target.set(0, 1, 0);
				if (v > 1 - 1e-4) return target.set(0, -1, 0);

				const e = 1e-4;
				_du.subVectors(surfacePoint(u + e, v, _p1), surfacePoint(u - e, v, _p2));
				_dv.subVectors(surfacePoint(u, Math.min(1, v + e), _p1), surfacePoint(u, Math.max(0, v - e), _p2));
				return target.crossVectors(_dv, _du).normalize();
			}

			// Zig-zag knife line around the stem where the lid comes off.
			function lidCut(u) {
				const x = u * lidTeeth;
				const zig = 1 - Math.abs(2 * (x - Math.floor(x)) - 1);
				const tooth = lidJag[Math.floor(x) % lidTeeth];
				return lidV + 0.03 * (zig * tooth - 0.5) + 0.012 * Math.sin(TAU * u + lidTilt);
			}

			// =====================================================================
			// Faces
			// Shapes are drawn in "face units": x right, y down, about the size of
			// the pumpkin, centered on its front. toUV wraps them onto the surface.
			// Keep everything between y = -0.36 and 0.4 so it stays below the lid.
			// =====================================================================

			const toUV = ([x, y]) => [0.5 + x / (TAU * W), faceV + y / (Math.PI * H)];

			function triangle(cx, cy, width, height, tilt) {
				const c = Math.cos(tilt);
				const s = Math.sin(tilt);
				return [
					[random(-0.25, 0.25) * width, -height / 2],
					[width / 2, height / 2 + random(-0.1, 0.1) * height],
					[-width / 2, height / 2 + random(-0.1, 0.1) * height],
				].map(([x, y]) => [cx + x * c - y * s, cy + x * s + y * c]);
			}

			// An ellipse with a slightly lumpy edge.
			function blob(cx, cy, rx, ry, tilt = 0) {
				const c = Math.cos(tilt);
				const s = Math.sin(tilt);
				const lump = random(0, TAU);
				return Array.from({ length: 48 }, (_, i) => {
					const a = (i / 48) * TAU;
					const k = 1 + 0.06 * Math.sin(3 * a + lump);
					const x = Math.cos(a) * rx * k;
					const y = Math.sin(a) * ry * k;
					return [cx + x * c - y * s, cy + x * s + y * c];
				});
			}

			// A crescent: a grin, a frown, or (thin and arched) an eyebrow.
			// Teeth are bumps scaled to the mouth's local thickness: flat-topped,
			// or pointed with `sharp: true`.
			function grin(cy, halfWidth, bow, thickness, tilt, topTeeth = [], bottomTeeth = []) {
				const thick = (x) => thickness * Math.pow(Math.max(0, 1 - (x / halfWidth) ** 2), 0.6);
				const teeth = (x, list) =>
					list.reduce((sum, t) => {
						const d = Math.abs(x - t.x);
						const shape = t.sharp ? 1 - d / (t.w / 2) : (t.w / 2 + 0.012 - d) / 0.012;
						return sum + t.h * thick(t.x) * clamp(shape, 0, 1);
					}, 0);

				const top = [];
				const bottom = [];
				for (let k = 0; k <= 80; k++) {
					const x = halfWidth * (k / 40 - 1);
					const mid = cy + bow * (1 - (x / halfWidth) ** 2) + tilt * x;
					const topY = mid - thick(x) * 0.4 + teeth(x, topTeeth);
					const bottomY = mid + thick(x) * 0.6 - teeth(x, bottomTeeth);
					top.push([x, topY]);
					// Never let teeth close the mouth off.
					bottom.push([x, Math.max(bottomY, topY + Math.min(0.015, thick(x) * 0.3))]);
				}
				return [...top, ...bottom.reverse().slice(1, -1)];
			}

			const FACES = {
				classic() {
					const eyeY = random(-0.24, -0.18);
					const gap = random(0.26, 0.32);
					const size = random(0.2, 0.25);
					const eye = (side) =>
						triangle(side * gap + random(-0.03, 0.03), eyeY + random(-0.03, 0.03), size * random(0.85, 1.15), size * random(0.8, 1.1), random(-0.2, 0.2));
					const mouthHalf = random(0.36, 0.46);
					const tooth = (x) => ({ x: x * mouthHalf, w: random(0.07, 0.1), h: random(0.45, 0.6) });

					return [
						eye(-1),
						eye(1),
						triangle(random(-0.03, 0.03), random(-0.02, 0.02), random(0.09, 0.12), random(0.08, 0.11), random(-0.15, 0.15)),
						grin(random(0.17, 0.21), mouthHalf, random(0.05, 0.09), random(0.14, 0.18), random(-0.08, 0.08), [tooth(random(-0.25, 0.15))], [
							tooth(random(-0.6, -0.4)),
							tooth(random(0.35, 0.55)),
						]),
					];
				},

				// Mismatched round eyes, a blob nose, a lopsided grin with a buck tooth.
				goofy() {
					const big = random(0.11, 0.14);
					const small = big * random(0.55, 0.7);
					const side = rand() < 0.5 ? -1 : 1;
					return [
						blob(side * random(0.28, 0.32), random(-0.22, -0.18), big, big * random(0.9, 1.15), random(-0.3, 0.3)),
						blob(-side * random(0.25, 0.3), random(-0.26, -0.21), small, small * random(0.8, 1.1), random(-0.3, 0.3)),
						blob(random(-0.06, 0.06), random(-0.02, 0.02), random(0.04, 0.06), random(0.035, 0.05)),
						grin(
							random(0.16, 0.2),
							random(0.38, 0.46),
							random(0.08, 0.12),
							random(0.17, 0.21),
							random(-0.15, 0.15),
							[{ x: random(-0.06, 0.06), w: random(0.1, 0.13), h: 0.6 }],
							rand() < 0.5 ? [] : [{ x: side * random(0.2, 0.3), w: 0.07, h: 0.45 }],
						),
					];
				},

				// Slanted angry eyes, a slit nose, a jagged mouth full of fangs.
				spooky() {
					const eyeY = random(-0.24, -0.19);
					const gap = random(0.25, 0.3);
					const w = random(0.22, 0.27);
					const h = random(0.15, 0.19);
					const eye = (side) => {
						const slant = random(0.07, 0.11);
						const cx = side * (gap + random(-0.02, 0.02));
						const cy = eyeY + random(-0.02, 0.02);
						// Local x points toward the nose.
						return [
							[-w / 2, -h / 2],
							[w / 2, -h / 2 + slant],
							[w * 0.15, h / 2],
						].map(([x, y]) => [cx - side * x, cy + y]);
					};
					const mouthHalf = random(0.4, 0.48);
					const n = randInt(4, 5);
					const toothW = (1.5 * mouthHalf) / n;
					const start = -0.75 * mouthHalf;
					const fangs = (count, offset, min, max) =>
						Array.from({ length: count }, (_, i) => ({ x: start + toothW * (i + offset), w: toothW, h: random(min, max), sharp: true }));
					return [
						eye(-1),
						eye(1),
						triangle(random(-0.02, 0.02), random(-0.02, 0.02), random(0.06, 0.08), random(0.12, 0.15), random(-0.1, 0.1)),
						grin(random(0.2, 0.24), mouthHalf, random(-0.04, 0.02), random(0.17, 0.21), random(-0.05, 0.05), fangs(n, 0.5, 0.6, 0.75), fangs(n - 1, 1, 0.55, 0.7)),
					];
				},

				// Wide round eyes under raised brows, and a little "O" mouth.
				surprised() {
					const eyeY = random(-0.17, -0.14);
					const gap = random(0.25, 0.3);
					const eye = (side) =>
						blob(side * gap + random(-0.02, 0.02), eyeY + random(-0.02, 0.02), random(0.08, 0.1), random(0.1, 0.12), random(-0.2, 0.2));
					const brow = (side) =>
						grin(eyeY - 0.17 + random(-0.015, 0.01), random(0.08, 0.1), random(-0.04, -0.025), 0.035, side * random(0, 0.15)).map(([x, y]) => [
							x + side * gap,
							y,
						]);
					return [
						eye(-1),
						eye(1),
						brow(-1),
						brow(1),
						triangle(random(-0.02, 0.02), random(0.0, 0.03), random(0.06, 0.08), random(0.06, 0.08), random(-0.15, 0.15)),
						blob(random(-0.03, 0.03), random(0.21, 0.24), random(0.07, 0.09), random(0.1, 0.13), random(-0.15, 0.15)),
					];
				},
			};

			function densify(poly, step) {
				const out = [];
				poly.forEach((a, i) => {
					const b = poly[(i + 1) % poly.length];
					const n = Math.max(1, Math.ceil(Math.hypot(b[0] - a[0], b[1] - a[1]) / step));
					for (let k = 0; k < n; k++) out.push([a[0] + ((b[0] - a[0]) * k) / n, a[1] + ((b[1] - a[1]) * k) / n]);
				});
				return out;
			}

			// Knife wobble: nudge the outline in and out so cuts look hand-made.
			function wobble(poly, amp) {
				const p1 = random(0, TAU);
				const p2 = random(0, TAU);
				let s = 0;
				return poly.map((p, i) => {
					const prev = poly[(i - 1 + poly.length) % poly.length];
					const next = poly[(i + 1) % poly.length];
					s += Math.hypot(p[0] - prev[0], p[1] - prev[1]);
					const dx = next[0] - prev[0];
					const dy = next[1] - prev[1];
					const len = Math.hypot(dx, dy) || 1;
					const offset = amp * (Math.sin(s * 40 + p1) + 0.5 * Math.sin(s * 97 + p2));
					return [p[0] + (dy / len) * offset, p[1] - (dx / len) * offset];
				});
			}

			// Holes wind so their inside is on the +v side when moving in +u.
			// buildRim relies on this to face the cut walls into the hole.
			function orient(poly) {
				let area = 0;
				poly.forEach(([u1, v1], i) => {
					const [u2, v2] = poly[(i + 1) % poly.length];
					area += u1 * v2 - u2 * v1;
				});
				return area > 0 ? poly : poly.reverse();
			}

			rand = mulberry32(settings.seed + 1);
			const holes = FACES[settings.face]().map((shape) => orient(wobble(densify(shape, 0.012), 0.004).map(toUV)));

			// The carving mask: white = pumpkin, black = hole. It cuts the shells
			// (via alphaMap) and tells buildShell which grid cells to drop.
			const MASK_W = 2048;
			const MASK_H = 1024;
			const [maskCanvas, maskCtx] = makeCanvas(MASK_W, MASK_H);
			maskCtx.fillStyle = "#fff";
			maskCtx.fillRect(0, 0, MASK_W, MASK_H);
			maskCtx.fillStyle = "#000";
			for (const hole of holes) {
				maskCtx.beginPath();
				for (const [u, v] of hole) maskCtx.lineTo(u * MASK_W, v * MASK_H);
				maskCtx.fill();
			}
			const maskPixels = maskCtx.getImageData(0, 0, MASK_W, MASK_H).data;
			const maskTexture = new THREE.CanvasTexture(maskCanvas);

			function isHole(u, v) {
				const x = Math.min(MASK_W - 1, Math.floor(u * MASK_W));
				const y = Math.min(MASK_H - 1, Math.floor(v * MASK_H));
				return maskPixels[(y * MASK_W + x) * 4] < 128;
			}

			// =====================================================================
			// Shell geometry
			// =====================================================================

			// One patch of shell, returned as [skin, flesh] geometries on the same
			// grid. vRange(u) gives [vStart, vEnd] for each column, so the lid and
			// body share the zig-zag cut line exactly.
			function buildShell(rows, vRange) {
				const outer = [];
				const inner = [];
				const outerNormals = [];
				const innerNormals = [];
				const uvs = [];
				const vGrid = [];
				const outerIndex = [];
				const innerIndex = [];
				const p = new THREE.Vector3();
				const n = new THREE.Vector3();
				const id = (i, j) => i * (rows + 1) + j;

				for (let i = 0; i <= COLS; i++) {
					const u = i / COLS;
					const [v0, v1] = vRange(u);
					for (let j = 0; j <= rows; j++) {
						const v = v0 + ((v1 - v0) * j) / rows;
						surfacePoint(u, v, p);
						surfaceNormal(u, v, n);
						outer.push(p.x, p.y, p.z);
						outerNormals.push(n.x, n.y, n.z);
						p.addScaledVector(n, -SHELL);
						inner.push(p.x, p.y, p.z);
						innerNormals.push(-n.x, -n.y, -n.z);
						uvs.push(u, 1 - v);
						vGrid.push(v);
					}
				}

				// Drop cells that lie entirely inside a hole, so the wireframe shows
				// real openings. The mask trims the cells along the edges.
				const carved = (i, j) => {
					for (const a of [0, 0.5, 1]) {
						for (const b of [0, 0.5, 1]) {
							const left = (1 - b) * vGrid[id(i, j)] + b * vGrid[id(i, j + 1)];
							const right = (1 - b) * vGrid[id(i + 1, j)] + b * vGrid[id(i + 1, j + 1)];
							if (!isHole((i + a) / COLS, (1 - a) * left + a * right)) return false;
						}
					}
					return true;
				};

				for (let i = 0; i < COLS; i++) {
					for (let j = 0; j < rows; j++) {
						if (carved(i, j)) continue;
						const a = id(i, j);
						const b = id(i + 1, j);
						const c = id(i, j + 1);
						const d = id(i + 1, j + 1);
						outerIndex.push(a, c, b, b, c, d);
						innerIndex.push(a, b, c, b, d, c); // inside faces point inward
					}
				}

				const geometry = (positions, normals, index) => {
					const g = new THREE.BufferGeometry();
					g.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
					g.setAttribute("normal", new THREE.Float32BufferAttribute(normals, 3));
					g.setAttribute("uv", new THREE.Float32BufferAttribute(uvs, 2));
					g.setIndex(index);
					return g;
				};
				return [geometry(outer, outerNormals, outerIndex), geometry(inner, innerNormals, innerIndex)];
			}

			// The cut walls: for each closed loop of (u, v) points, a strip from the
			// outer skin to the inner skin. Faces point to the +v side of +u.
			// uv.x runs along the cut, uv.y across it (0 = skin, 1 = inside).
			const RIM_ROWS = [0, 0.05, 0.12, 0.55, 1];
			function buildRim(loops) {
				const positions = [];
				const uvs = [];
				const index = [];
				const p = new THREE.Vector3();
				const n = new THREE.Vector3();
				const q = new THREE.Vector3();
				const prev = new THREE.Vector3();
				const rows = RIM_ROWS.length;

				for (const loop of loops) {
					const start = positions.length / 3;
					let s = 0;
					for (let k = 0; k <= loop.length; k++) {
						const [u, v] = loop[k % loop.length];
						surfacePoint(u, v, p);
						surfaceNormal(u, v, n);
						if (k > 0) s += p.distanceTo(prev);
						prev.copy(p);
						for (const f of RIM_ROWS) {
							q.copy(p).addScaledVector(n, -SHELL * f);
							positions.push(q.x, q.y, q.z);
							uvs.push(s / 0.4, f);
						}
					}
					for (let k = 0; k < loop.length; k++) {
						for (let r = 0; r < rows - 1; r++) {
							const a = start + k * rows + r;
							const b = a + rows;
							index.push(a, a + 1, b, b, a + 1, b + 1);
						}
					}
				}

				const geometry = new THREE.BufferGeometry();
				geometry.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
				geometry.setAttribute("uv", new THREE.Float32BufferAttribute(uvs, 2));
				geometry.setIndex(index);
				geometry.computeVertexNormals();
				return geometry;
			}

			// =====================================================================
			// Pumpkin textures
			// =====================================================================

			// Skin: color, bump and roughness in one pass. Per-lobe tint, darker
			// creases that turn greenish near the stem, fine lengthwise striations
			// and pale veins, a pale "ground spot" where it lay in the field, then
			// warts, scabs, healed scratches, pores and dirt painted on top.
			function skinTextures() {
				rand = mulberry32(settings.seed + 3);
				const w = 2048;
				const h = 1024;
				const lobeTint = grooves.map(() => random(-1, 1));
				const spot = { u: random(0, 1), v: random(0.74, 0.86), ru: random(0.06, 0.1), rv: random(0.08, 0.12) };
				let rowV = -1;

				const [[colorCanvas, colorCtx], [bumpCanvas, bumpCtx], [roughCanvas, roughCtx]] = paintCanvases(w, h, 3, (x, y, out) => {
					const u = (x + 0.5) / w;
					const v = (y + 0.5) / h;
					if (v !== rowV) {
						setGrooveRow(Math.PI * v);
						rowV = v;
					}
					const k = lobeAt(TAU * (u - 0.5));
					const crease = 1 - lobeBulge(_lobeT);
					const c2 = crease * crease;
					const streak = noise(u * 700, v * 5, 700);
					const vein = Math.max(0, noise(u * 1300, v * 2.5 + 40, 1300) - 0.7) * 3.3;
					const blotch = noise(u * 8, v * 5 + 20, 8);
					const tone = 0.5 + 0.3 * lobeTint[k] + 0.35 * (blotch - 0.5);

					const shade = 0.97 + 0.04 * streak;
					let r = (222 + 33 * tone) * shade;
					let g = (98 + 52 * tone) * shade;
					let b = (12 + 16 * tone) * shade;
					r += (252 - r) * vein * 0.1;
					g += (176 - g) * vein * 0.1;
					b += (70 - b) * vein * 0.1;

					const green = c2 * Math.max(0, 1 - v / 0.3);
					r += (120 - r) * c2 * 0.55 + (95 - r) * green * 0.5;
					g += (52 - g) * c2 * 0.5 + (85 - g) * green * 0.5;
					b += (12 - b) * c2 * 0.5 + (30 - b) * green * 0.5;

					const du = (u - spot.u - Math.round(u - spot.u)) / spot.ru;
					const dv = (v - spot.v) / spot.rv;
					const ground = smoothstep(1, 0.55, Math.hypot(du, dv) + 0.3 * (noise(u * 40, v * 40, 40) - 0.5));
					r += (226 - r) * ground * 0.75;
					g += (178 - g) * ground * 0.75;
					b += (92 - b) * ground * 0.75;

					const pole = Math.max(Math.exp(-((v / 0.06) ** 2)), Math.exp(-(((1 - v) / 0.08) ** 2)));
					r += (112 - r) * pole;
					g += (90 - g) * pole;
					b += (44 - b) * pole;

					out[0][0] = r;
					out[0][1] = g;
					out[0][2] = b;
					const bump = 255 * (0.5 + 0.1 * (streak - 0.5) + 0.12 * vein);
					out[1][0] = out[1][1] = out[1][2] = bump;
					const rough = 255 * (0.5 + 0.12 * crease + 0.3 * ground + 0.06 * streak + 0.3 * pole);
					out[2][0] = out[2][1] = out[2][2] = rough;
				});

				const all = [colorCtx, bumpCtx, roughCtx];
				const wrapX = (draw) => {
					// Draw near the seam twice so marks wrap around the back.
					for (const dx of [-w, 0, w]) draw(dx);
				};

				// Pores: tiny pale dots.
				for (let i = 0; i < 6000; i++) {
					const x = random(0, w);
					const y = random(0, h);
					const size = random(0.8, 1.8);
					colorCtx.fillStyle = `rgba(255, 205, 130, ${random(0.15, 0.4)})`;
					colorCtx.fillRect(x, y, size, size);
					bumpCtx.fillStyle = "rgba(255, 255, 255, 0.4)";
					bumpCtx.fillRect(x, y, size, size);
				}

				// Warts: corky, pale-topped bumps where the geometry has them.
				for (const wart of warts) {
					const x = ((wart.theta / TAU + 0.5) % 1) * w;
					const y = (wart.phi / Math.PI) * h;
					const ry = (wart.size / Math.PI) * h * 1.6;
					const rx = (wart.size / (TAU * Math.max(0.2, Math.sin(wart.phi)))) * w * 1.6;
					wrapX((dx) => {
						for (const [ctx, inner, outer] of [
							[colorCtx, "rgba(214, 168, 104, 0.9)", "rgba(170, 80, 20, 0)"],
							[bumpCtx, "rgba(255, 255, 255, 0.9)", "rgba(255, 255, 255, 0)"],
							[roughCtx, "rgba(220, 220, 220, 0.9)", "rgba(220, 220, 220, 0)"],
						]) {
							const gradient = ctx.createRadialGradient(x + dx, y, 0, x + dx, y, Math.max(rx, ry));
							gradient.addColorStop(0, inner);
							gradient.addColorStop(1, outer);
							ctx.fillStyle = gradient;
							ctx.beginPath();
							ctx.ellipse(x + dx, y, rx, ry, 0, 0, TAU);
							ctx.fill();
						}
					});
				}

				// Scabs: irregular brown corky patches with lighter rims.
				for (let i = 0, n = randInt(3, 6); i < n; i++) {
					const cx = random(0, w);
					const cy = random(0.25, 0.9) * h;
					const radius = random(6, 22);
					const points = Array.from({ length: 14 }, (_, k) => {
						const a = (k / 14) * TAU;
						const r = radius * random(0.6, 1.3);
						return [cx + Math.cos(a) * r * 1.4, cy + Math.sin(a) * r];
					});
					for (const [ctx, fill, stroke] of [
						[colorCtx, "rgba(98, 58, 28, 0.85)", "rgba(178, 128, 74, 0.6)"],
						[bumpCtx, "rgba(150, 150, 150, 0.9)", "rgba(255, 255, 255, 0.7)"],
						[roughCtx, "rgba(235, 235, 235, 1)", "rgba(220, 220, 220, 1)"],
					]) {
						ctx.beginPath();
						points.forEach(([px, py]) => ctx.lineTo(px, py));
						ctx.closePath();
						ctx.fillStyle = fill;
						ctx.fill();
						ctx.lineWidth = 2;
						ctx.strokeStyle = stroke;
						ctx.stroke();
					}
				}

				// Healed scratches: thin, raised, tan lines.
				for (let i = 0, n = randInt(4, 9); i < n; i++) {
					let x = random(0, w);
					let y = random(0.2, 0.9) * h;
					let a = random(0, TAU);
					const steps = randInt(8, 30);
					for (const ctx of all) ctx.beginPath();
					for (const ctx of all) ctx.moveTo(x, y);
					for (let s = 0; s < steps; s++) {
						a += random(-0.3, 0.3);
						x += Math.cos(a) * 5;
						y += Math.sin(a) * 5;
						for (const ctx of all) ctx.lineTo(x, y);
					}
					colorCtx.strokeStyle = "rgba(208, 166, 104, 0.75)";
					bumpCtx.strokeStyle = "rgba(255, 255, 255, 0.8)";
					roughCtx.strokeStyle = "rgba(230, 230, 230, 1)";
					for (const ctx of all) {
						ctx.lineWidth = random(1.2, 2.6);
						ctx.stroke();
					}
				}

				// Dirt smudges toward the bottom.
				colorCtx.filter = "blur(6px)";
				for (let i = 0; i < 26; i++) {
					colorCtx.fillStyle = `rgba(52, 36, 22, ${random(0.08, 0.22)})`;
					colorCtx.beginPath();
					colorCtx.ellipse(random(0, w), random(0.84, 1) * h, random(10, 40), random(5, 18), random(0, TAU), 0, TAU);
					colorCtx.fill();
				}
				colorCtx.filter = "none";

				// The knife line around the lid.
				for (const [ctx, style] of [
					[colorCtx, "rgba(60, 22, 4, 0.85)"],
					[bumpCtx, "rgba(0, 0, 0, 0.9)"],
				]) {
					ctx.strokeStyle = style;
					ctx.lineWidth = 3;
					ctx.beginPath();
					for (let i = 0; i <= COLS; i++) ctx.lineTo((i / COLS) * w, lidCut(i / COLS) * h);
					ctx.stroke();
				}

				return [colorTexture(colorCanvas), dataTexture(bumpCanvas), dataTexture(roughCanvas)];
			}

			// Inside wall: pale, fibrous flesh with spoon scrapes and stringy pulp
			// left near the bottom.
			function fleshTextures() {
				const w = 1024;
				const h = 512;
				const [[colorCanvas, colorCtx], [bumpCanvas, bumpCtx]] = paintCanvases(w, h, 2, (x, y, out) => {
					const u = x / w;
					const v = y / h;
					const fiber = noise(u * 160, v * 14 + 30, 160);
					const blotch = noise(u * 9, v * 5 + 60, 9);
					const deep = smoothstep(0.75, 1, v);
					out[0][0] = 242 - 18 * fiber - 10 * deep;
					out[0][1] = 182 + 25 * blotch - 30 * fiber - 40 * deep;
					out[0][2] = 78 + 20 * blotch - 25 * deep;
					out[1][0] = out[1][1] = out[1][2] = 255 * (0.5 + 0.2 * fiber);
				});

				for (let i = 0; i < 110; i++) {
					const x = random(0, w);
					const y = random(0.15, 0.95) * h;
					const rx = random(20, 70);
					const start = random(0, TAU);
					for (const [ctx, style] of [
						[colorCtx, "rgba(255, 228, 165, 0.2)"],
						[bumpCtx, "rgba(0, 0, 0, 0.3)"],
					]) {
						ctx.strokeStyle = style;
						ctx.lineWidth = random(2, 6);
						ctx.beginPath();
						ctx.ellipse(x, y, rx, rx * random(0.4, 0.8), random(0, TAU), start, start + random(0.6, 1.6));
						ctx.stroke();
					}
				}

				for (let i = 0; i < 60; i++) {
					let x = random(0, w);
					let y = random(0.7, 1) * h;
					colorCtx.strokeStyle = `rgba(214, 120, 30, ${random(0.35, 0.7)})`;
					colorCtx.lineWidth = random(1.2, 3);
					colorCtx.beginPath();
					colorCtx.moveTo(x, y);
					for (let s = 0; s < 8; s++) {
						x += random(-12, 12);
						y += random(-6, 6);
						colorCtx.lineTo(x, y);
					}
					colorCtx.stroke();
				}

				return [colorTexture(colorCanvas), dataTexture(bumpCanvas)];
			}

			// Cut faces: a thin band of orange skin, then pale flesh with knife
			// streaks. The glow map makes the flesh light up from within, the way
			// thin cut edges do on a real lantern.
			function rimTextures() {
				const w = 512;
				const h = 64;
				const [[colorCanvas], [glowCanvas]] = paintCanvases(w, h, 2, (x, y, out) => {
					const t = y / (h - 1);
					const fiber = 0.5 + 0.4 * (noise(x * 0.35, t * 3 + 200) - 0.5);
					const skin = t < 0.05 ? 1 : 1 - smoothstep(0.05, 0.1, t);
					const flesh = [246 - 10 * fiber, 150 - 30 * t - 20 * fiber, 42 - 20 * t - 10 * fiber];
					const skinColor = [176, 72, 14];
					for (let c = 0; c < 3; c++) out[0][c] = flesh[c] + (skinColor[c] - flesh[c]) * skin;
					const glow = 255 * (1 - skin) * (0.2 + 0.8 * t) * (0.85 + 0.15 * fiber);
					out[1][0] = glow;
					out[1][1] = glow * 0.75;
					out[1][2] = glow * 0.4;
				});
				const color = colorTexture(colorCanvas);
				const glow = colorTexture(glowCanvas);
				color.wrapS = glow.wrapS = THREE.RepeatWrapping;
				return [color, glow];
			}

			// =====================================================================
			// Cutaway
			// Wherever the pumpkin is within reach of the camera, its surface
			// dissolves and a wireframe of the same mesh fades in, so moving through
			// the shell shows the inside instead of a wall.
			// =====================================================================

			const cutaway = {
				center: { value: new THREE.Vector3(0, -999, 0) },
				radius: { value: 0.32 },
			};

			function addCutaway(material, wire = false) {
				material.onBeforeCompile = (shader) => {
					shader.uniforms.uCutCenter = cutaway.center;
					shader.uniforms.uCutRadius = cutaway.radius;
					shader.vertexShader = shader.vertexShader
						.replace("#include <common>", "#include <common>\nvarying vec3 vCutWorld;")
						.replace("#include <project_vertex>", "#include <project_vertex>\nvCutWorld = (modelMatrix * vec4(transformed, 1.0)).xyz;");
					shader.fragmentShader = shader.fragmentShader
						.replace("#include <common>", "#include <common>\nuniform vec3 uCutCenter;\nuniform float uCutRadius;\nvarying vec3 vCutWorld;")
						.replace(
							"void main() {",
							`void main() {
								float cutFade = smoothstep(uCutRadius * 0.5, uCutRadius, distance(vCutWorld, uCutCenter));
								${
									wire
										? "if (cutFade > 0.99) discard;"
										: "if (cutFade < fract(52.9829189 * fract(dot(gl_FragCoord.xy, vec2(0.06711056, 0.00583715))))) discard;"
								}`,
						);
					if (wire) {
						shader.fragmentShader = shader.fragmentShader.replace(
							"#include <dithering_fragment>",
							"#include <dithering_fragment>\ngl_FragColor.a *= 1.0 - cutFade;",
						);
					}
				};
				material.customProgramCacheKey = () => (wire ? "cutaway-wire" : "cutaway-solid");
				return material;
			}

			// =====================================================================
			// Materials
			// =====================================================================

			const [skinMap, skinBump, skinRough] = skinTextures();
			const [fleshMap, fleshBump] = fleshTextures();
			const [rimMap, rimGlow] = rimTextures();

			// A light clearcoat gives the waxy sheen of pumpkin skin.
			const skinMaterial = addCutaway(
				new THREE.MeshPhysicalMaterial({
					map: skinMap,
					bumpMap: skinBump,
					bumpScale: 1.2,
					roughnessMap: skinRough,
					roughness: 1,
					clearcoat: 0.12,
					clearcoatRoughness: 0.6,
					alphaMap: maskTexture,
					alphaTest: 0.5,
				}),
			);
			const fleshMaterial = addCutaway(
				new THREE.MeshStandardMaterial({
					map: fleshMap,
					bumpMap: fleshBump,
					bumpScale: 2,
					roughness: 0.6,
					alphaMap: maskTexture,
					alphaTest: 0.5,
				}),
			);
			const cutMaterial = addCutaway(
				new THREE.MeshStandardMaterial({
					map: rimMap,
					emissiveMap: rimGlow,
					emissive: "#ffffff",
					emissiveIntensity: 0.45,
					roughness: 0.45, // freshly cut flesh is moist
				}),
			);
			const stemMaterial = addCutaway(new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.9 }));
			const tendrilMaterial = new THREE.MeshStandardMaterial({ color: "#5f5a2c", roughness: 0.8 });
			const wireMaterial = addCutaway(
				new THREE.MeshBasicMaterial({ color: "#ffb46a", wireframe: true, transparent: true, opacity: 0.45, depthWrite: false }),
				true,
			);

			// =====================================================================
			// Stem and tendrils
			// =====================================================================

			// A thick, corky stem with uneven angular ridges that spread into
			// "fingers" where it grows out of the pumpkin, and a dry cut end.
			function buildStem() {
				rand = mulberry32(settings.seed + 4);
				const base = surfacePoint(0, 0);
				const height = random(0.32, 0.46);
				const radius = random(0.085, 0.11);
				const lean = random(0.08, 0.3);
				const bend = random(-0.15, 0.15);
				const leanAngle = random(0, TAU);
				const side = new THREE.Vector3(Math.cos(leanAngle), 0, Math.sin(leanAngle));
				const across = new THREE.Vector3(-side.z, 0, side.x);
				const curve = new THREE.CatmullRomCurve3(
					[0, 0.25, 0.5, 0.75, 1].map((s) =>
						base
							.clone()
							.add(new THREE.Vector3(0, height * s - 0.04, 0))
							.addScaledVector(side, height * lean * s * s)
							.addScaledVector(across, height * bend * Math.sin(Math.PI * s)),
					),
				);

				const SEGMENTS = 40;
				const AROUND = 48;
				const ridges = randInt(5, 6);
				const ridgeSize = Array.from({ length: ridges }, () => random(0.7, 1.3));
				const twist = random(-0.6, 0.6);
				const frames = curve.computeFrenetFrames(SEGMENTS, false);
				const jag = Array.from({ length: AROUND }, () => random(-0.012, 0.012));
				const valley = new THREE.Color("#3b3420");
				const ridgeGreen = new THREE.Color("#6f6c40");
				const ridgeDry = new THREE.Color("#a8956a");
				const cutEnd = new THREE.Color("#9c8a5e");
				const cutCore = new THREE.Color("#c2ae80");
				const color = new THREE.Color();
				const p = new THREE.Vector3();
				const positions = [];
				const colors = [];
				const index = [];

				for (let i = 0; i <= SEGMENTS; i++) {
					const s = i / SEGMENTS;
					const center = curve.getPointAt(s);
					const flare = 1 + 1.7 * Math.exp(-s * 9);
					const ridgeDepth = 0.16 + 0.24 * Math.exp(-s * 6);
					for (let k = 0; k < AROUND; k++) {
						const a = (k / AROUND) * TAU;
						const turned = a + twist * s;
						const ridge = Math.pow(Math.abs(Math.cos((turned * ridges) / 2)), 1.6);
						const which = Math.floor(((((turned / TAU) % 1) + 1) % 1) * ridges);
						const bumpy = 1 + 0.035 * (noise(k * 0.6, i * 0.45 + 300) - 0.5);
						const r = radius * flare * (1 - 0.18 * s) * (1 - ridgeDepth * (1 - ridge) * ridgeSize[which]) * bumpy;
						p.copy(center)
							.addScaledVector(frames.normals[i], Math.cos(a) * r)
							.addScaledVector(frames.binormals[i], Math.sin(a) * r);
						if (i === SEGMENTS) p.addScaledVector(frames.tangents[i], jag[k]);
						positions.push(p.x, p.y, p.z);

						const streak = noise(a * 5, s * 6 + 500);
						color.copy(ridgeGreen).lerp(ridgeDry, clamp(s * 1.2 + 0.4 * streak - 0.1, 0, 1));
						color.lerp(valley, (1 - ridge) * 0.7);
						color.multiplyScalar(0.85 + 0.3 * streak);
						colors.push(color.r, color.g, color.b);
					}
				}

				for (let i = 0; i < SEGMENTS; i++) {
					for (let k = 0; k < AROUND; k++) {
						const a = i * AROUND + k;
						const b = i * AROUND + ((k + 1) % AROUND);
						index.push(a, b, a + AROUND, b, b + AROUND, a + AROUND);
					}
				}

				// Cut end: pale dry fibers, darker toward the rind.
				const ring = positions.length / 3 - AROUND;
				const capStart = ring + AROUND;
				for (let k = 0; k < AROUND; k++) {
					positions.push(...positions.slice((ring + k) * 3, (ring + k) * 3 + 3));
					colors.push(cutEnd.r, cutEnd.g, cutEnd.b);
				}
				const tip = curve.getPointAt(1).addScaledVector(frames.tangents[SEGMENTS], -0.01);
				positions.push(tip.x, tip.y, tip.z);
				colors.push(cutCore.r, cutCore.g, cutCore.b);
				for (let k = 0; k < AROUND; k++) index.push(capStart + AROUND, capStart + k, capStart + ((k + 1) % AROUND));

				const geometry = new THREE.BufferGeometry();
				geometry.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
				geometry.setAttribute("color", new THREE.Float32BufferAttribute(colors, 3));
				geometry.setIndex(index);
				geometry.computeVertexNormals();
				return geometry;
			}

			// A dried vine that creeps across the top, then curls up off the surface.
			function buildTendril(angle) {
				const points = [];
				const p = new THREE.Vector3();
				const n = new THREE.Vector3();
				const reach = random(0.09, 0.13);
				const wiggle = random(0, TAU);

				for (let k = 0; k <= 8; k++) {
					const u = 0.5 + angle / TAU + 0.02 * Math.sin(k * 0.8 + wiggle);
					const v = 0.02 + (reach * k) / 8;
					surfacePoint(u, v, p);
					surfaceNormal(u, v, n);
					points.push(p.clone().addScaledVector(n, 0.015));
				}

				const end = points[points.length - 1];
				const along = end.clone().sub(points[points.length - 2]).normalize();
				const sideways = new THREE.Vector3().crossVectors(along, n);
				const loops = random(1.5, 2.5);
				const size = random(0.04, 0.07);
				const drift = random(-0.06, 0.06);
				const center = end.clone().addScaledVector(n, size);
				for (let k = 1; k <= 40; k++) {
					const t = k / 40;
					const a = t * loops * TAU;
					const r = size * (1 - 0.6 * t);
					points.push(
						center
							.clone()
							.addScaledVector(along, r * Math.sin(a))
							.addScaledVector(n, -r * Math.cos(a))
							.addScaledVector(sideways, drift * t),
					);
				}
				return new THREE.TubeGeometry(new THREE.CatmullRomCurve3(points), 160, 0.006, 6, false);
			}

			// =====================================================================
			// Tealight
			// A short candle in a crimped aluminium cup, sitting on the floor of
			// the pumpkin. Its flame, glow and light are kept for the session.
			// =====================================================================

			const flameMaterial = new THREE.ShaderMaterial({
				uniforms: { uTime: { value: 0 }, uSway: { value: 0 }, uPhase: { value: 0 } },
				transparent: true,
				depthWrite: false,
				blending: THREE.AdditiveBlending,
				vertexShader: `
					varying vec2 vUv;
					void main() {
						vUv = uv;
						gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
					}
				`,
				fragmentShader: `
					uniform float uTime;
					uniform float uSway;
					uniform float uPhase;
					varying vec2 vUv;

					void main() {
						float y = vUv.y;
						// The tip sways more than the base.
						float x = (vUv.x - 0.5) * 2.0 - (uSway + 0.06 * sin(uTime * 9.0 + uPhase + y * 4.0)) * y * y;
						// Teardrop: round bottom, pointed top.
						float width = y < 0.25
							? sqrt(max(0.0, 1.0 - pow((0.25 - y) / 0.25, 2.0)))
							: pow(max(1.0 - (y - 0.25) / 0.75, 0.0), 1.3);
						float d = abs(x) / max(width * 0.9, 0.001);

						float body = smoothstep(1.0, 0.5, d) * mix(0.45, 1.0, smoothstep(0.04, 0.2, y));
						float core = smoothstep(0.7, 0.0, d) * smoothstep(0.75, 0.2, y);
						vec3 color = mix(vec3(1.0, 0.5, 0.12), vec3(1.0, 0.9, 0.6), core);
						color = mix(vec3(0.3, 0.4, 1.0), color, smoothstep(0.03, 0.18, y));
						gl_FragColor = vec4(pow(color, vec3(2.2)) * 2.5, body); // linear, and bright enough to bloom
					}
				`,
			});

			const flameGeometry = new THREE.PlaneGeometry(0.05, 0.14);
			flameGeometry.translate(0, 0.07, 0);
			const flame = new THREE.Mesh(flameGeometry, flameMaterial);

			const [glowCanvas, glowCtx] = makeCanvas(128, 128);
			const glowGradient = glowCtx.createRadialGradient(64, 64, 0, 64, 64, 64);
			glowGradient.addColorStop(0, "rgba(255, 190, 110, 1)");
			glowGradient.addColorStop(0.25, "rgba(255, 140, 50, 0.35)");
			glowGradient.addColorStop(1, "rgba(255, 120, 40, 0)");
			glowCtx.fillStyle = glowGradient;
			glowCtx.fillRect(0, 0, 128, 128);
			const glow = new THREE.Sprite(
				new THREE.SpriteMaterial({ map: colorTexture(glowCanvas), blending: THREE.AdditiveBlending, depthWrite: false, opacity: 0.5 }),
			);
			glow.scale.setScalar(0.45);

			const CANDLE_INTENSITY = 4.5;
			const candleLight = new THREE.PointLight("#ffa850", CANDLE_INTENSITY, 0, 1.5);
			candleLight.castShadow = true;
			candleLight.shadow.mapSize.set(1024, 1024);
			candleLight.shadow.camera.near = 0.02;
			candleLight.shadow.camera.far = 14;
			candleLight.shadow.bias = -0.003;
			const lightHome = new THREE.Vector3(); // where the light rests, before it sways
			// Light bouncing around the orange walls: no shadows, so nothing inside
			// goes pitch black.
			const BOUNCE_INTENSITY = 0.5;
			const bounceLight = new THREE.PointLight("#ff8a3a", BOUNCE_INTENSITY, 1.6, 1.2);

			const waxMaterial = new THREE.MeshPhysicalMaterial({
				color: "#f3eee4",
				roughness: 0.4,
				clearcoat: 0.7, // the molten pool
				clearcoatRoughness: 0.15,
				emissive: "#ff9a50",
				emissiveIntensity: 0.25,
			});
			const emberMaterial = new THREE.MeshStandardMaterial({ color: "#000", emissive: "#ff6a20", emissiveIntensity: 3 });

			function buildTealight() {
				rand = mulberry32(settings.seed + 5);
				const R = 0.125;
				const CUP = 0.1;
				const tealight = new THREE.Group();
				tealight.position.set(random(-0.04, 0.04), surfacePoint(0, 1).y + SHELL - 0.004, random(-0.04, 0.04));

				// Cup: base, crimped wall, rolled lip, and the inside of the wall.
				const cup = new THREE.LatheGeometry(
					[
						[0.001, 0],
						[R - 0.004, 0],
						[R, 0.004],
						[R, CUP - 0.003],
						[R - 0.0015, CUP],
						[R - 0.003, CUP - 0.003],
						[R - 0.003, CUP - 0.02],
					].map(([r, y]) => new THREE.Vector2(r, y)),
					72,
				);
				const dents = random(0, TAU);
				const position = cup.attributes.position;
				for (let i = 0; i < position.count; i++) {
					const x = position.getX(i);
					const y = position.getY(i);
					const z = position.getZ(i);
					if (Math.hypot(x, z) < R * 0.9 || y < 0.004) continue;
					const a = Math.atan2(z, x);
					const k = 1 + 0.012 * Math.abs(Math.sin(a * 30)) - 0.006 + 0.01 * Math.sin(a * 2 + dents) * (y / CUP);
					position.setXYZ(i, x * k, y, z * k);
				}
				cup.computeVertexNormals();
				const cupMesh = new THREE.Mesh(cup, new THREE.MeshStandardMaterial({ color: "#d9d9d9", metalness: 0.85, roughness: 0.32 }));
				cupMesh.castShadow = true;
				cupMesh.receiveShadow = true;

				// Wax: nearly fills the cup, dipping into a pool around the wick.
				const waxTop = CUP - 0.018;
				const wax = new THREE.Mesh(
					new THREE.LatheGeometry(
						[
							[R - 0.004, 0.004],
							[R - 0.004, waxTop],
							[R * 0.6, waxTop - 0.002],
							[0.001, waxTop - 0.005],
						].map(([r, y]) => new THREE.Vector2(r, y)),
						48,
					),
					waxMaterial,
				);
				wax.receiveShadow = true;

				const wickTop = new THREE.Vector3(random(-0.005, 0.005), waxTop + 0.02, random(-0.005, 0.005));
				const wick = new THREE.Mesh(
					new THREE.TubeGeometry(
						new THREE.QuadraticBezierCurve3(new THREE.Vector3(0, waxTop - 0.006, 0), new THREE.Vector3(0, waxTop + 0.012, 0), wickTop),
						8,
						0.003,
						6,
					),
					new THREE.MeshStandardMaterial({ color: "#1b130d", roughness: 1 }),
				);
				const ember = new THREE.Mesh(new THREE.SphereGeometry(0.004, 8, 6), emberMaterial);
				ember.position.copy(wickTop);

				flame.position.copy(wickTop).y -= 0.012;
				glow.position.copy(wickTop).y += 0.04;
				lightHome.copy(wickTop).y += 0.035;
				candleLight.position.copy(lightHome);
				bounceLight.position.set(0, 0.35, 0);
				tealight.add(cupMesh, wax, wick, ember, flame, glow, candleLight, bounceLight);
				return tealight;
			}

			// Seeds and stringy pulp the carver missed, lying on the floor inside.
			function buildLeftovers() {
				rand = mulberry32(settings.seed + 6);
				const group = new THREE.Group();
				const p = new THREE.Vector3();
				const n = new THREE.Vector3();
				const up = new THREE.Vector3(0, 1, 0);
				const insidePoint = (u, v, lift) => {
					surfacePoint(u, v, p);
					surfaceNormal(u, v, n);
					return p.clone().addScaledVector(n, -SHELL - lift);
				};

				const seedGeometry = new THREE.SphereGeometry(1, 12, 6);
				const seedMaterial = new THREE.MeshStandardMaterial({ color: "#eadcb4", roughness: 0.5 });
				for (let i = 0; i < 10; i++) {
					const seed = new THREE.Mesh(seedGeometry, seedMaterial);
					seed.position.copy(insidePoint(random(0, 1), random(0.84, 0.93), 0.006));
					seed.scale.set(0.034, 0.007, 0.021);
					seed.quaternion.setFromUnitVectors(up, n.clone().negate()).multiply(new THREE.Quaternion().setFromAxisAngle(up, random(0, TAU)));
					seed.receiveShadow = true;
					group.add(seed);
				}

				const pulpMaterial = new THREE.MeshStandardMaterial({ color: "#e08a2a", roughness: 0.45 });
				for (let i = 0; i < 4; i++) {
					const u0 = random(0, 1);
					const points = Array.from({ length: 6 }, (_, k) => insidePoint(u0 + k * random(0.01, 0.025), random(0.82, 0.92), 0.008));
					const strand = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(points), 40, random(0.005, 0.01), 5), pulpMaterial);
					strand.receiveShadow = true;
					group.add(strand);
				}
				return group;
			}

			// =====================================================================
			// Build the pumpkin
			// =====================================================================

			function shellMesh(geometry, material) {
				const mesh = new THREE.Mesh(geometry, material);
				mesh.castShadow = true;
				mesh.receiveShadow = true;
				return mesh;
			}

			const lidRing = Array.from({ length: COLS }, (_, i) => [i / COLS, lidCut(i / COLS)]);
			const [bodySkin, bodyFlesh] = buildShell(200, (u) => [lidCut(u), 1]);
			const [lidSkin, lidFlesh] = buildShell(40, (u) => [0, lidCut(u)]);

			const lid = new THREE.Group();
			lid.add(shellMesh(lidSkin, skinMaterial), shellMesh(lidFlesh, fleshMaterial), shellMesh(buildRim([lidRing]), cutMaterial));
			const stem = new THREE.Mesh(buildStem(), stemMaterial);
			stem.castShadow = true;
			lid.add(stem);
			rand = mulberry32(settings.seed + 7);
			const firstTendril = random(0, TAU);
			for (let i = 0, count = randInt(1, 2); i < count; i++) {
				const tendril = new THREE.Mesh(buildTendril(firstTendril + (i * TAU) / count + random(-0.5, 0.5)), tendrilMaterial);
				tendril.castShadow = true;
				lid.add(tendril);
			}

			// Wireframes of the shells, shown only where the cutaway opens them.
			const wires = [bodySkin, bodyFlesh, lidSkin, lidFlesh].map((geometry) => new THREE.Mesh(geometry, wireMaterial));
			wires.forEach((wire) => (wire.renderOrder = 1));

			const pumpkin = new THREE.Group();
			pumpkin.add(
				shellMesh(bodySkin, skinMaterial),
				shellMesh(bodyFlesh, fleshMaterial),
				shellMesh(buildRim([[...lidRing].reverse(), ...holes]), cutMaterial),
				lid,
				buildTealight(),
				buildLeftovers(),
				...wires.slice(0, 2),
			);
			lid.add(...wires.slice(2));

			bodySkin.computeBoundingBox();
			pumpkin.position.y = -bodySkin.boundingBox.min.y;
			pumpkin.rotation.y = turn;
			scene.add(pumpkin);
			const pumpkinCenter = new THREE.Vector3(0, pumpkin.position.y, 0);
			const pumpkinReach = Math.max(W, H) + 0.4; // beyond this the cutaway can't touch it

			// =====================================================================
			// Table
			// A small, rickety table: four warped planks on crooked legs.
			// =====================================================================

			rand = mulberry32(1031); // fixed seed: the setting is the same for every pumpkin
			const woodNoise = makeNoise();
			const TABLE_LEG = 4.6; // tabletop to ground

			// Grain, knots, wear and cracks for one board. Returns color and bump.
			function woodTextures(length, width) {
				const w = 1024;
				const h = Math.max(64, Math.round((1024 * width) / length));
				const offset = random(0, 100);
				const knots = Array.from({ length: randInt(0, 2) }, () => ({
					x: random(0.3, length - 0.3),
					z: random(0.1, width - 0.1),
					r: random(0.03, 0.06),
				}));

				const [[colorCanvas, colorCtx], [bumpCanvas, bumpCtx]] = paintCanvases(w, h, 2, (x, y, out) => {
					const X = (x / w) * length;
					const Z = (y / h) * width;
					let rings = Z * (12 + 10 * woodNoise(X * 0.3 + offset, Z * 3)) + 3 * woodNoise(X * 0.4 + offset, offset) + 1.5 * woodNoise(X * 1.5 + offset, Z * 8);
					let knot = 0;
					for (const k of knots) {
						const d2 = ((X - k.x) ** 2 + (Z - k.z) ** 2) / (k.r * k.r);
						rings += 3 * Math.exp(-d2 * 0.3);
						knot = Math.max(knot, Math.exp(-d2 * 1.5));
					}
					const grain = Math.sin((rings - Math.floor(rings)) * Math.PI) ** 2;
					const fiber = woodNoise(X * 3 + offset, Z * 140);
					const blotch = woodNoise(X * 0.7 + offset, Z * 2.5 + offset);
					// Edges and ends are worn paler and greyer.
					const edge = Math.max(smoothstep(0.25, 0, Math.min(Z, width - Z)), smoothstep(0.3, 0, Math.min(X, length - X)));
					let tone = (0.35 + 0.3 * grain + 0.2 * fiber + 0.35 * (blotch - 0.5)) * (1 - 0.7 * knot);
					tone += 0.15 * edge;
					out[0][0] = 38 + 90 * tone;
					out[0][1] = 27 + 66 * tone;
					out[0][2] = 18 + 46 * tone;
					out[1][0] = out[1][1] = out[1][2] = 255 * (0.35 + 0.35 * grain + 0.3 * fiber);
				});

				for (let i = 0; i < 30; i++) {
					const x = random(0, w);
					const y = random(0, h);
					const a = random(-0.6, 0.6);
					const len = random(10, 60);
					colorCtx.strokeStyle = `rgba(170, 140, 100, ${random(0.05, 0.15)})`;
					colorCtx.lineWidth = 1;
					colorCtx.beginPath();
					colorCtx.moveTo(x, y);
					colorCtx.lineTo(x + Math.cos(a) * len, y + Math.sin(a) * len);
					colorCtx.stroke();
				}

				for (let c = 0, count = randInt(1, 3); c < count; c++) {
					let x = rand() < 0.65 ? (rand() < 0.5 ? 0 : w) : random(0.2, 0.8) * w;
					let y = random(0.15, 0.85) * h;
					const dir = x === 0 ? 1 : x === w ? -1 : rand() < 0.5 ? 1 : -1;
					const steps = randInt(15, 50);
					for (let s = 0; s < steps; s++) {
						const nx = x + dir * random(4, 10);
						const ny = clamp(y + random(-1.5, 1.5), 2, h - 2);
						for (const [ctx, style] of [
							[colorCtx, "rgba(12, 7, 4, 0.9)"],
							[bumpCtx, "#000"],
						]) {
							ctx.strokeStyle = style;
							ctx.lineWidth = 2.6 * (1 - s / steps) + 0.4;
							ctx.beginPath();
							ctx.moveTo(x, y);
							ctx.lineTo(nx, ny);
							ctx.stroke();
						}
						x = nx;
						y = ny;
					}
				}

				return [colorTexture(colorCanvas), dataTexture(bumpCanvas)];
			}

			function woodMaterial(length, width) {
				const [map, bumpMap] = woodTextures(length, width);
				return new THREE.MeshStandardMaterial({ map, bumpMap, bumpScale: 2, roughness: 0.85 });
			}

			// A warped board: cupped across, bowed along, twisted, with ragged
			// ends and worn edges.
			function buildPlank(length, width, thickness) {
				const geometry = new THREE.BoxGeometry(length, thickness, width, 40, 1, 8);
				const position = geometry.attributes.position;
				const cup = random(-0.015, 0.015);
				const bow = random(-0.02, 0.012);
				const twist = random(-0.02, 0.02);
				const slant = [random(-0.08, 0.08), random(-0.08, 0.08)];
				const offset = random(0, 100);

				for (let i = 0; i < position.count; i++) {
					let x = position.getX(i);
					let y = position.getY(i);
					let z = position.getZ(i);
					const nx = x / (length / 2);
					const nz = z / (width / 2);
					if (Math.abs(nx) > 0.999) x += Math.sign(x) * (slant[x > 0 ? 1 : 0] * nz - 0.06 * woodNoise(z * 25 + offset, x > 0 ? 7 : 3));
					if (Math.abs(nz) > 0.999) z -= Math.sign(z) * 0.02 * woodNoise(x * 3 + offset, z > 0 ? 1 : 9);
					// Worn, rounded top edges.
					if (y > 0) y -= 0.012 * smoothstep(0.85, 1, Math.abs(nz));
					y += cup * nz * nz + bow * (1 - nx * nx) + twist * nx * nz;
					position.setXYZ(i, x, y, z);
				}
				geometry.computeVertexNormals();
				return geometry;
			}

			const table = new THREE.Group();
			const plankWidths = Array.from({ length: 4 }, () => random(0.6, 0.72));
			const gaps = plankWidths.map(() => random(0.012, 0.03));
			const tableDepth = plankWidths.reduce((sum, w, i) => sum + w + gaps[i], 0);
			const tableLength = 4;
			const plankBoxes = []; // [center, size] for each board, for physics later
			let plankZ = -tableDepth / 2;

			for (let i = 0; i < plankWidths.length; i++) {
				const width = plankWidths[i];
				const length = tableLength + random(-0.15, 0.2);
				const thickness = random(0.1, 0.12);
				const plank = new THREE.Mesh(buildPlank(length, width, thickness), woodMaterial(length, width));
				plank.position.set(random(-0.12, 0.12), -thickness / 2 + random(-0.008, 0.004), plankZ + width / 2);
				plank.rotation.y = random(-0.012, 0.012);
				plank.castShadow = true;
				plank.receiveShadow = true;
				table.add(plank);
				plankBoxes.push([plank.position.clone(), new THREE.Vector3(length, thickness, width)]);
				plankZ += width + gaps[i];
			}

			// Frame: an apron under the top, crooked splayed legs, and one
			// diagonal brace somebody nailed on to stop the wobble.
			const frameMaterial = woodMaterial(4.6, 0.2);
			const legX = tableLength / 2 - 0.35;
			const legZ = tableDepth / 2 - 0.22;
			for (const side of [-1, 1]) {
				const apronLong = new THREE.Mesh(new THREE.BoxGeometry(tableLength - 0.6, 0.32, 0.07), frameMaterial);
				apronLong.position.set(0, -0.3, side * (legZ - 0.02));
				apronLong.rotation.x = random(-0.03, 0.03);
				const apronShort = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.32, tableDepth - 0.4), frameMaterial);
				apronShort.position.set(side * (legX - 0.02), -0.3, 0);
				table.add(apronLong, apronShort);

				for (const end of [-1, 1]) {
					const leg = new THREE.Mesh(new THREE.BoxGeometry(0.17, TABLE_LEG, 0.17, 1, 6, 1), frameMaterial);
					const position = leg.geometry.attributes.position;
					const bend = random(-0.05, 0.05);
					for (let i = 0; i < position.count; i++) {
						const t = position.getY(i) / TABLE_LEG + 0.5;
						position.setX(i, position.getX(i) + bend * Math.sin(Math.PI * t));
					}
					leg.geometry.computeVertexNormals();
					leg.position.set(side * legX, -0.12 - TABLE_LEG / 2, end * legZ);
					leg.rotation.set(end * random(0.01, 0.03), 0, -side * random(0.01, 0.035)); // splayed
					leg.castShadow = true;
					leg.receiveShadow = true;
					table.add(leg);
				}
			}
			const brace = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.12, Math.hypot(tableDepth - 0.4, 2.6)), frameMaterial);
			brace.position.set(legX + 0.1, -2.6, 0);
			brace.rotation.x = Math.atan2(2.6, tableDepth - 0.4);
			table.add(brace);
			table.traverse((object) => object.isMesh && (object.receiveShadow = true));
			table.position.z = 0.15;
			scene.add(table);

			// =====================================================================
			// Ground and sky
			// =====================================================================

			const groundY = -0.12 - TABLE_LEG;
			const [[groundCanvas]] = paintCanvases(512, 512, 1, (x, y, out) => {
				const n = woodNoise(x * 0.05 + 500, y * 0.05) * 0.6 + woodNoise(x * 0.3 + 700, y * 0.3) * 0.4;
				out[0][0] = 26 + 26 * n;
				out[0][1] = 23 + 22 * n;
				out[0][2] = 18 + 14 * n;
			});
			const groundMap = colorTexture(groundCanvas);
			groundMap.wrapS = groundMap.wrapT = THREE.RepeatWrapping;
			groundMap.repeat.set(30, 30);
			const ground = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshStandardMaterial({ map: groundMap, roughness: 1 }));
			ground.rotation.x = -Math.PI / 2;
			ground.position.y = groundY;
			ground.receiveShadow = true;
			scene.add(ground);

			const skyTime = { value: 0 };
			scene.add(
				new THREE.Mesh(
					new THREE.SphereGeometry(300, 32, 16),
					new THREE.ShaderMaterial({
						side: THREE.BackSide,
						depthWrite: false,
						uniforms: { uTime: skyTime },
						vertexShader: `
							varying vec3 vDirection;
							void main() {
								vDirection = normalize(position);
								gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
							}
						`,
						fragmentShader: `
							uniform float uTime;
							varying vec3 vDirection;

							float hash(vec2 p) {
								return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
							}
							float noise(vec2 p) {
								vec2 i = floor(p);
								vec2 f = fract(p);
								f = f * f * (3.0 - 2.0 * f);
								return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), f.x), mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), f.x), f.y);
							}
							float fbm(vec2 p) {
								float value = 0.0;
								float amplitude = 0.5;
								for (int i = 0; i < 5; i++) {
									value += amplitude * noise(p);
									p *= 2.03;
									amplitude *= 0.5;
								}
								return value;
							}

							void main() {
								vec3 dir = normalize(vDirection);
								float h = dir.y;
								vec3 color = mix(vec3(0.11, 0.1, 0.17), vec3(0.012, 0.008, 0.035), smoothstep(-0.02, 0.45, h));
								// A violet glow low in the sky: muted behind the scene, deepening to a
								// vivid purple toward the sides and behind the camera.
								float towardCamera = smoothstep(-0.85, 0.75, dir.z);
								float low = exp(-max(h, 0.0) * 6.0) * smoothstep(-0.1, 0.02, h);
								vec3 violet = mix(vec3(0.16, 0.12, 0.22), vec3(0.38, 0.09, 0.52), towardCamera);
								color = mix(color, violet, low * (0.3 + 0.55 * towardCamera));
								// Thin clouds drifting across, lit purple, paler near the moon.
								float c = fbm(dir.xz / (max(h, 0.0) + 0.12) * 0.9 + vec2(uTime * 0.004, 0.0));
								float clouds = smoothstep(0.45, 0.8, c) * smoothstep(-0.02, 0.1, h) * (1.0 - smoothstep(0.45, 0.9, h));
								float nearMoon = pow(max(dot(dir, vec3(-0.338, 0.089, -0.937)), 0.0), 8.0);
								color = mix(color, mix(mix(vec3(0.15, 0.1, 0.2), vec3(0.3, 0.09, 0.4), towardCamera), vec3(0.6, 0.45, 0.52), nearMoon), clouds * (0.35 + 0.35 * towardCamera));
								color *= smoothstep(-0.5, 0.0, h) * 0.8 + 0.2;
								gl_FragColor = vec4(pow(color, vec3(2.2)), 1.0);
							}
						`,
					}),
				),
			);

			const STAR_COUNT = 1500;
			const starPositions = new Float32Array(STAR_COUNT * 3);
			const starSizes = new Float32Array(STAR_COUNT);
			const starPhases = new Float32Array(STAR_COUNT);
			for (let i = 0; i < STAR_COUNT; i++) {
				const y = random(-0.05, 1);
				const a = random(0, TAU);
				const r = Math.sqrt(1 - y * y);
				starPositions.set([Math.cos(a) * r * 280, y * 280, Math.sin(a) * r * 280], i * 3);
				starSizes[i] = 1 + 2.4 * rand() ** 3;
				starPhases[i] = random(0, 1);
			}
			const starGeometry = new THREE.BufferGeometry();
			starGeometry.setAttribute("position", new THREE.BufferAttribute(starPositions, 3));
			starGeometry.setAttribute("size", new THREE.BufferAttribute(starSizes, 1));
			starGeometry.setAttribute("phase", new THREE.BufferAttribute(starPhases, 1));
			const starMaterial = new THREE.ShaderMaterial({
				uniforms: { uTime: { value: 0 }, uPixelRatio: { value: renderer.getPixelRatio() } },
				transparent: true,
				depthWrite: false,
				vertexShader: `
					attribute float size;
					attribute float phase;
					uniform float uTime;
					uniform float uPixelRatio;
					varying float vTwinkle;
					void main() {
						vTwinkle = 0.75 + 0.25 * sin(uTime * (1.0 + phase) * 1.3 + phase * 20.0);
						gl_PointSize = size * uPixelRatio;
						gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
					}
				`,
				fragmentShader: `
					varying float vTwinkle;
					void main() {
						float a = smoothstep(0.5, 0.1, length(gl_PointCoord - 0.5)) * vTwinkle;
						gl_FragColor = vec4(vec3(1.0, 0.95, 0.85) * 1.3, a);
					}
				`,
			});
			scene.add(new THREE.Points(starGeometry, starMaterial));

			// =====================================================================
			// Physics
			// Rapier, in scene units (1 unit ≈ 15 cm), so gravity is scaled up.
			// Static: ground, tabletop, pumpkin shell, candles, jar, bottle, doll.
			// Dynamic: the lid and the small things you can pick up.
			// =====================================================================

			await RAPIER.init();
			const world = new RAPIER.World({ x: 0, y: -9.81 / 0.15, z: 0 });
			const PHYSICS_STEP = 1 / 60;
			const dynamicBodies = []; // { body, object }: objects follow their bodies
			const _v = new THREE.Vector3();
			const _q = new THREE.Quaternion();

			function addStatic(desc, x, y, z) {
				return world.createCollider(desc.setTranslation(x, y, z));
			}

			// Vertices of an object's meshes (every `step`th), relative to `frame`'s
			// position and rotation (not its scale, since bodies don't scale).
			function pointsIn(object, frame = object, step = 1) {
				object.updateMatrixWorld(true);
				frame.updateMatrixWorld(true);
				const inverse = new THREE.Matrix4()
					.compose(frame.getWorldPosition(new THREE.Vector3()), frame.getWorldQuaternion(new THREE.Quaternion()), new THREE.Vector3(1, 1, 1))
					.invert();
				const points = [];
				object.traverse((child) => {
					if (!child.isMesh) return;
					const position = child.geometry.attributes.position;
					const toFrame = inverse.clone().multiply(child.matrixWorld);
					for (let i = 0; i < position.count; i += step) {
						_v.fromBufferAttribute(position, i).applyMatrix4(toFrame);
						points.push(_v.x, _v.y, _v.z);
					}
				});
				return new Float32Array(points);
			}

			const hull = (object, step = 1) => RAPIER.ColliderDesc.convexHull(pointsIn(object, object, step));

			// A dynamic body for an object already placed in world space (a direct
			// child of the scene).
			function addDynamic(object, colliders, { density = 1, friction = 0.6, restitution = 0.1, asleep = false } = {}) {
				object.updateMatrixWorld(true);
				const body = world.createRigidBody(
					RAPIER.RigidBodyDesc.dynamic()
						.setTranslation(object.position.x, object.position.y, object.position.z)
						.setRotation({ x: object.quaternion.x, y: object.quaternion.y, z: object.quaternion.z, w: object.quaternion.w })
						.setAngularDamping(0.6)
						.setCcdEnabled(true),
				);
				for (const desc of colliders) world.createCollider(desc.setDensity(density).setFriction(friction).setRestitution(restitution), body);
				if (asleep) body.sleep();
				dynamicBodies.push({ body, object });
				return body;
			}

			addStatic(RAPIER.ColliderDesc.cuboid(100, 0.5, 100), 0, groundY - 0.5, 0);
			for (const [center, size] of plankBoxes) {
				addStatic(RAPIER.ColliderDesc.cuboid(size.x / 2, size.y / 2, size.z / 2), center.x + table.position.x, center.y, center.z + table.position.z);
			}

			// The pumpkin body: a coarse copy of the outer and inner shell joined at
			// the opening, so the lid can rest on the rim and things can fall in.
			// (The carved holes are left solid here.)
			pumpkin.updateMatrixWorld(true);
			{
				const cols = 96;
				const rows = 28;
				const positions = [];
				const index = [];
				const p = new THREE.Vector3();
				const n = new THREE.Vector3();
				for (let i = 0; i < cols; i++) {
					const u = i / cols;
					const v0 = lidCut(u);
					for (let j = 0; j <= rows; j++) {
						const v = v0 + ((1 - v0) * j) / rows;
						surfacePoint(u, v, p);
						surfaceNormal(u, v, n);
						_v.copy(p).applyMatrix4(pumpkin.matrixWorld);
						positions.push(_v.x, _v.y, _v.z);
						_v.copy(p).addScaledVector(n, -SHELL).applyMatrix4(pumpkin.matrixWorld);
						positions.push(_v.x, _v.y, _v.z);
					}
				}
				const id = (i, j, inner) => ((i % cols) * (rows + 1) + j) * 2 + inner;
				for (let i = 0; i < cols; i++) {
					for (let j = 0; j < rows; j++) {
						for (const inner of [0, 1]) index.push(id(i, j, inner), id(i, j + 1, inner), id(i + 1, j, inner), id(i + 1, j, inner), id(i, j + 1, inner), id(i + 1, j + 1, inner));
					}
					index.push(id(i, 0, 0), id(i, 0, 1), id(i + 1, 0, 0), id(i + 1, 0, 0), id(i, 0, 1), id(i + 1, 0, 1));
				}
				world.createCollider(RAPIER.ColliderDesc.trimesh(new Float32Array(positions), new Uint32Array(index)));
			}

			// The lid becomes its own body, resting asleep on the opening. Its
			// shape: a hull of the cap's outer skin, plus one around the stem.
			const ringCenter = lidRing.reduce((sum, [u, v]) => sum.add(surfacePoint(u, v)), new THREE.Vector3()).divideScalar(lidRing.length);
			const lidRoot = new THREE.Group();
			lidRoot.position.copy(ringCenter).applyMatrix4(pumpkin.matrixWorld);
			lidRoot.quaternion.copy(pumpkin.quaternion);
			lid.position.copy(ringCenter).negate();
			lidRoot.add(lid);
			scene.add(lidRoot);
			const capPoints = [];
			for (let i = 0; i < 48; i++) {
				for (let j = 0; j <= 6; j++) {
					const u = i / 48;
					// A convex hull would fill in the zig-zag and swallow the body's
					// teeth, so stop at the tips of the teeth: it rests on them.
					const tips = lidV - 0.015 + 0.012 * Math.sin(TAU * u + lidTilt) - 0.004;
					// Slightly wider than the lid, so it catches the outer lip of the cut
					// instead of sliding down the sloping cut face.
					surfacePoint(u, (tips * j) / 6, _v).sub(ringCenter);
					capPoints.push(_v.x * 1.07, _v.y, _v.z * 1.07);
				}
			}
			const lidBody = addDynamic(lidRoot, [RAPIER.ColliderDesc.convexHull(new Float32Array(capPoints)), RAPIER.ColliderDesc.convexHull(pointsIn(stem, lidRoot, 5))], {
				density: 0.6,
				asleep: true,
			});

			// =====================================================================
			// Props: shared helpers
			// =====================================================================

			// Move every vertex of a geometry: fn(x, y, z) returns [x, y, z].
			function displace(geometry, fn) {
				const position = geometry.attributes.position;
				for (let i = 0; i < position.count; i++) {
					const [x, y, z] = fn(position.getX(i), position.getY(i), position.getZ(i));
					position.setXYZ(i, x, y, z);
				}
				geometry.computeVertexNormals();
				return geometry;
			}

			const lathe = (profile, segments = 48) => new THREE.LatheGeometry(profile.map(([r, y]) => new THREE.Vector2(r, y)), segments);
			const bump = (p, cx, cy, cz, size) => Math.exp(-((p.x - cx) ** 2 + (p.y - cy) ** 2 + (p.z - cz) ** 2) / (size * size));

			function shadowed(object) {
				object.traverse((child) => {
					if (child.isMesh) child.castShadow = child.receiveShadow = true;
				});
				return object;
			}

			// Something you can grab (it has a body) and/or click.
			const interactives = []; // { object, body?, onClick? }
			const clickTarget = (radius) => new THREE.Mesh(new THREE.SphereGeometry(radius, 8, 6), new THREE.MeshBasicMaterial({ visible: false }));

			// =====================================================================
			// Flames
			// Each flame can be clicked out. Once out it stays out and its wick
			// keeps giving off a thin thread of smoke.
			// =====================================================================

			const flames = []; // { mesh, material, on, lit, wax? }
			const pumpkinFlame = { mesh: flame, material: flameMaterial, on: true, lit: 1 };
			flames.push(pumpkinFlame);

			function addFlame(parent, position, width, height, wax) {
				const material = flameMaterial.clone();
				material.uniforms.uPhase.value = random(0, 50);
				const geometry = new THREE.PlaneGeometry(width, height);
				geometry.translate(0, height / 2, 0);
				const mesh = new THREE.Mesh(geometry, material);
				mesh.position.copy(position);
				parent.add(mesh);
				const entry = { mesh, material, on: true, lit: 1, wax };
				flames.push(entry);
				const target = clickTarget(width * 1.3);
				target.position.copy(position).y += height * 0.4;
				parent.add(target);
				interactives.push({ object: target, onClick: () => putOut(entry) });
				return entry;
			}

			function putOut(entry) {
				if (!entry.on) return;
				entry.on = false;
				if (entry === pumpkinFlame) settings.candleLit = false;
				smokeEmitters.push({ flame: entry, age: 0, carry: 0 });
				sounds.puff(entry.mesh.getWorldPosition(new THREE.Vector3()));
			}

			const pumpkinFlameTarget = clickTarget(0.06);
			pumpkinFlameTarget.position.copy(flame.position).y += 0.05;
			flame.parent.add(pumpkinFlameTarget);
			interactives.push({ object: pumpkinFlameTarget, onClick: () => putOut(pumpkinFlame) });

			// =====================================================================
			// Tall dripping candles (back left)
			// =====================================================================

			// Wax that glows from within near its flame: a per-vertex glow amount
			// feeds the emissive color, scaled by how lit the candle is.
			function glowingWax(color) {
				const material = new THREE.MeshStandardMaterial({ color, roughness: 0.55 });
				const level = { value: 1 };
				material.userData.level = level;
				material.onBeforeCompile = (shader) => {
					shader.uniforms.uGlowLevel = level;
					shader.vertexShader = shader.vertexShader
						.replace("#include <common>", "#include <common>\nattribute float aGlow;\nvarying float vGlow;")
						.replace("#include <begin_vertex>", "#include <begin_vertex>\nvGlow = aGlow;");
					shader.fragmentShader = shader.fragmentShader
						.replace("#include <common>", "#include <common>\nuniform float uGlowLevel;\nvarying float vGlow;")
						.replace("#include <emissivemap_fragment>", "#include <emissivemap_fragment>\ntotalEmissiveRadiance += vec3(1.0, 0.5, 0.18) * vGlow * vGlow * uGlowLevel * 0.8;");
				};
				return material;
			}

			// A pillar candle: uneven body, a lumpy lip around a melted crater,
			// heavy drips (most short, a few running nearly to the foot, each with
			// a bead at the end) and a puddle of wax around the base.
			function buildPillar(radius, height) {
				const phase = random(0, 100);
				const parts = [];

				parts.push(
					displace(new THREE.CylinderGeometry(radius, radius * 1.03, height, 40, 24, true).translate(0, height / 2, 0), (x, y, z) => {
						const a = Math.atan2(z, x);
						const k = 1 + 0.05 * (woodNoise(a * 2 + phase, y * 2) - 0.5) + 0.02 * Math.sin(a * 3 + phase);
						return [x * k, y, z * k];
					}),
				);

				parts.push(
					displace(
						lathe([
							[radius, height - 0.02],
							[radius * 1.05, height + 0.03],
							[radius * 0.93, height + 0.05],
							[radius * 0.7, height - 0.02],
							[radius * 0.3, height - 0.06],
							[0.001, height - 0.07],
						]),
						(x, y, z) => {
							const a = Math.atan2(z, x);
							const lip = smoothstep(radius * 0.6, radius, Math.hypot(x, z));
							return [x, y + lip * 0.05 * (woodNoise(a * 3 + phase, 7) - 0.5), z];
						},
					),
				);

				for (let i = 0, count = randInt(24, 38); i < count; i++) {
					const a = random(0, TAU);
					const length = height * Math.min(0.9, Math.pow(rand(), 1.8) * 0.85 + 0.04);
					const r = random(0.014, 0.034);
					const top = height + random(-0.01, 0.035);
					const points = Array.from({ length: 7 }, (_, k) => {
						const t = k / 6;
						const aa = a + 0.05 * Math.sin(t * 3 + i);
						const rr = radius + r * 0.35 + 0.012 * (1 - t);
						return new THREE.Vector3(Math.cos(aa) * rr, top - length * t, Math.sin(aa) * rr);
					});
					parts.push(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(points), 10, r, 6, false));
					const end = points[6];
					parts.push(new THREE.SphereGeometry(r * 1.4, 8, 6).scale(1, 1.3, 1).translate(end.x, end.y, end.z));
				}

				parts.push(
					lathe([
						[radius * 1.5, 0],
						[radius * 1.35, 0.03],
						[radius * 1.08, 0.05],
						[radius * 0.98, 0.07],
					]),
				);

				for (const part of parts) {
					const position = part.attributes.position;
					const glowAmount = new Float32Array(position.count);
					for (let i = 0; i < position.count; i++) glowAmount[i] = smoothstep(height - 0.9, height + 0.05, position.getY(i));
					part.setAttribute("aGlow", new THREE.BufferAttribute(glowAmount, 1));
				}
				return mergeGeometries(parts);
			}

			rand = mulberry32(77);
			const candleCluster = new THREE.Group();
			const clusterFlames = [];
			for (const [x, z, radius, height] of [
				[-1.45, -0.88, 0.27, 2.1],
				[-0.88, -1.05, 0.3, 1.6],
				[-1.78, -0.42, 0.24, 1.15],
				[-1.3, -0.25, 0.26, 0.7],
			]) {
				const wax = glowingWax(new THREE.Color("#e6d9c0").offsetHSL(random(-0.01, 0.01), random(-0.05, 0.05), random(-0.04, 0.03)));
				const candle = new THREE.Mesh(buildPillar(radius, height), wax);
				candle.position.set(x, 0, z);
				candle.rotation.y = random(0, TAU);
				candleCluster.add(candle);
				const wickTop = new THREE.Vector3(x, height - 0.03, z);
				const wick = new THREE.Mesh(new THREE.CylinderGeometry(0.006, 0.006, 0.07, 6), new THREE.MeshStandardMaterial({ color: "#1b130d" }));
				wick.position.copy(wickTop).y -= 0.03;
				wick.rotation.z = random(-0.2, 0.2);
				candleCluster.add(wick);
				clusterFlames.push(addFlame(candleCluster, wickTop, 0.075, 0.22, wax));
				addStatic(RAPIER.ColliderDesc.cylinder(height / 2, radius * 1.05), x, height / 2, z);
			}
			scene.add(shadowed(candleCluster));

			const CLUSTER_INTENSITY = 3.2;
			const clusterLight = new THREE.PointLight("#ffa04a", CLUSTER_INTENSITY, 0, 1.4);
			clusterLight.position.set(-1.3, 2.0, -0.6);
			clusterLight.castShadow = true;
			clusterLight.shadow.mapSize.set(512, 512);
			clusterLight.shadow.camera.near = 0.1;
			clusterLight.shadow.bias = -0.004;
			scene.add(clusterLight);

			// =====================================================================
			// Skull (right). Click it and its jaw chatters.
			// Sculpted as a distance field (negative inside): ellipsoids and
			// capsules smoothly joined, then carved for the eye sockets, the nasal
			// opening and the hollow temples under the cheekbone arches, and
